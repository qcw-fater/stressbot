# stressbot + newGm 多项目共用 Nginx 配置
#
# 同一端口（80）通过路径前缀分流：
#   - newGm 占根路径 /，API 走 /api/
#   - stressbot 占 /stressbot/，API 走 /sbot/
#
# 使用方式：
#   1. 将此文件内容合并到 Nginx server 配置中
#   2. 修改 upstream sbot_admin 为实际 Admin 服务器地址
#   3. 修改 alias 路径为实际 dist 目录
#   4. nginx -t && nginx -s reload

upstream sbot_admin {
    server host.docker.internal:7718;
}

server {
    listen 80;
    server_name 150.158.79.197;
    client_max_body_size 100m;

    root /data/newGm/web;
    index index.php index.html index.htm default.php default.htm default.html;

    # ── 静态资源缓存 ──
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── 防爬虫 ──
    location ~* \.(php|asp|aspx|jsp|pl|cgi)$ {
        return 404;
    }

    # ── newGm excel 下载 ──
    location /excel/ {
        root /data/newGm/server;
        add_header Content-Disposition "attachment; filename=$arg_filename";
        sendfile on;
        tcp_nopush on;
        autoindex off;
    }

    # ── newGm API ──
    location /api {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── stressbot 前端（/stressbot/ 子路径）──
    location /stressbot/ {
        alias /data/stressbot/web/;
        index index.html;
        try_files $uri $uri/ /stressbot/index.html;
    }

    # ── stressbot API ──
    location /sbot/ {
        proxy_pass http://sbot_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── newGm 前端路由（兜底）──
    location / {
        try_files $uri $uri/ /index.html;
        expires max;
    }
}
