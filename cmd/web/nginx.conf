# stressbot + newGm 多项目共用 Nginx 配置
#
# 同一端口（80）通过路径前缀分流：
#   - newGm 占根路径 /，API 走 /api/
#   - stressbot 占 /stressbot/，API 走 /sbot/
#
# 部署方式：
#   cp -r dist /data/stressbot/web/     → /data/stressbot/web/dist/index.html
#   nginx -t && nginx -s reload

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    root /data/newGm/web;
    index index.html;

    # ── 静态资源缓存 ──
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── 防爬虫 ──
    location ~* \.(php|asp|aspx|jsp|pl|cgi)$ {
        return 404;
    }

    # ── newGm excel 下载 ──
    location /excel/ {
        root /data/newGm/server;
        add_header Content-Disposition "attachment; filename=$arg_filename";
        sendfile on;
        tcp_nopush on;
        autoindex off;
    }

    # ── newGm API ──
    location /api {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── stressbot 前端（/stressbot/ 子路径）──
    location ^~ /stressbot/ {
        alias /data/stressbot/web/dist/;
        try_files $uri $uri/ @stressbot;
    }

    # SPA 路由兜底
    location @stressbot {
        root /data/stressbot/web/dist;
        rewrite .* /index.html break;
    }

    # ── stressbot API ──
    location /sbot/ {
        proxy_pass http://host.docker.internal:7718;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── newGm 前端路由（兜底）──
    location / {
        try_files $uri $uri/ /index.html;
        expires max;
    }
}
