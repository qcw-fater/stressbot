version: v2
plugins:
  - local: "C:/Users/Administrator/go/bin/protoc-gen-go.exe"
    out: controlplane/controlv1
    opt:
      - paths=source_relative
  - local: "C:/Users/Administrator/go/bin/protoc-gen-go-grpc.exe"
    out: controlplane/controlv1
    opt:
      - paths=source_relative
      - require_unimplemented_servers=true
