# stressbot Admin 服务器配置
# ─────────────────────────────────────────────────────
# 用法: go run ./cmd/admin -config conf/admin.toml
#
# Admin 是中心调度服务器，管理 Agent 节点、下发任务、聚合指标、归档历史。
# 对外暴露两个监听面：
#   - 管理面（HTTP）：面向浏览器，提供 Web UI 和 REST API
#   - 控制面（gRPC）：面向 Agent 节点，负责任务下发和指标收集
#
# 环境变量展开：
#   ${VAR}          展开，未定义则启动报错（推荐用于密码，避免明文写入配置文件）
#   ${VAR:-default} 展开，未定义则用 default
#   $$              转义为字面 $
#
# 严格模式：拼写错误的字段名会导致启动失败。

# ─── 顶层标量（必须在所有 [section] 之前）────────────
# daemon 是否以守护进程模式运行（仅 Linux，Windows 下忽略）。
# 也可通过命令行 -d flag 覆盖。
daemon = false

# ─── 管理面（HTTP，面向浏览器）────────────────────────
[server]
# port HTTP 管理面监听端口。浏览器访问 http://<listenHost>:<port> 打开 Web UI。
port = 7718

# listenHost HTTP 管理面监听地址。
# 127.0.0.1 = 仅本机可访问（安全）；0.0.0.0 = 允许远程访问（注意防火墙）。
listenHost = "127.0.0.1"

# staticDir 前端静态文件目录（相对进程工作目录）。
# 默认指向 cmd/web/dist（前端构建产物）。若从其他目录启动需相应调整。
staticDir = "cmd/web/dist"

# ─── 控制面（gRPC，面向 Agent 节点）──────────────────
[controlPlane]
# port gRPC 控制面监听端口。Agent 的 agent.adminAddress 应指向此端口。
port = 7720

# listenHost gRPC 控制面监听地址。
# 生产环境通常与管理面设为相同或不同的内网地址。
listenHost = "127.0.0.1"

# heartbeatInterval 期望的 Agent 心跳间隔（秒级）。
# Admin 会在 Agent 注册时将此值下发给 Agent，Agent 据此调整心跳频率。
# 必须 < unhealthyAfter，否则 Agent 还没来得及发心跳就被判为不健康。
heartbeatInterval = "10s"

# unhealthyAfter 心跳超时阈值。超过此时间未收到 Agent 心跳则标记为 unhealthy。
# 同时作为任务租约时长：Admin 认为此时间内 Agent 应完成或续约任务。
# 必须 > heartbeatInterval 且 < offlineAfter。
unhealthyAfter = "30s"

# offlineAfter 离线判定阈值。超过此时间仍无心跳则标记为 offline 并从注册表删除。
# 删除后该 Agent ID 可被重新注册。
# 必须 > unhealthyAfter。
offlineAfter = "60s"

# ─── MySQL 历史归档（host 留空=不启用）────────────────
# 启用后将任务运行结果归档到 MySQL，支持历史查询、对比、趋势分析。
# 不启用时历史归档功能不可用，但 Admin 基本管理功能不受影响。
[mysql]
# host MySQL 主机地址。留空表示不启用 MySQL 历史归档。
host = "127.0.0.1"

# port MySQL 端口号。
port = 3306

# username MySQL 用户名。
username = "root"

# password MySQL 密码。
# 推荐用环境变量注入（${STRESSBOT_MYSQL_PASSWORD}），避免明文密码写入配置文件。
# 使用 ${VAR} 语法时，环境变量未定义会导致启动失败（fail-loud，不会静默用空密码）。
password = "${STRESSBOT_MYSQL_PASSWORD}"

# database 数据库名。启动时会自动建表/迁移，无需手动初始化。
database = "stressbot"

# retentionDays 历史数据保留天数。超过此天数的归档记录自动清理（每天定时执行）。
retentionDays = 90

  # mysql.pool MySQL 连接池参数。
  # Admin 是管理面，并发量不高，连接池无需太大。
  [mysql.pool]
  # dialTimeout 建立 TCP 连接的超时。
  dialTimeout = "5s"

  # readTimeout 单次查询读取超时（MySQL DSN readTimeout）。
  # 历史查询（timeseries 等）可能较慢，建议设宽裕些。
  readTimeout = "30s"

  # writeTimeout 单次写入超时（MySQL DSN writeTimeout）。
  writeTimeout = "30s"

  # maxOpenConns 最大打开连接数。
  maxOpenConns = 10

  # maxIdleConns 最大空闲连接数。
  maxIdleConns = 5

  # connMaxLifetime 连接最大存活时间，超过后自动关闭重建。
  connMaxLifetime = "1h"

# ─── Redis 共享状态（host 留空=不启用）────────────────
# 用于跨 Robot / 跨 Agent 的共享状态（KV / Counter / Claim / Queue / Hash）。
# 由 Lua 脚本通过 require("share") 模块访问。
[redis]
# host Redis 主机地址。留空表示不启用共享状态。
host = "127.0.0.1"

# port Redis 端口号。
port = 6379

# keyPrefix Redis key 前缀。多套压测环境共用同一 Redis 时用不同前缀隔离。
keyPrefix = "stressbot"

# defaultClaimTTL Claim（分布式锁）默认持有时长。
defaultClaimTTL = "30s"

# opTimeout 单次 Redis 操作超时。
opTimeout = "5s"

  # redis.pool Redis 连接池参数。
  # 压测时大量 Robot 并发访问共享状态，连接池建议设大些。
  [redis.pool]
  # dialTimeout 建立 TCP 连接的超时。
  dialTimeout = "5s"

  # readTimeout 单次读取超时。
  readTimeout = "2s"

  # writeTimeout 单次写入超时。
  writeTimeout = "2s"

  # maxOpenConns 最大打开连接数（对应 go-redis PoolSize）。
  maxOpenConns = 128

  # maxIdleConns 最大空闲连接数。
  maxIdleConns = 32

  # connMaxLifetime 连接最大存活时间。"0" = 不限制。
  connMaxLifetime = "1h"

# ─── 日志 ──────────────────────────────────────────────
[log]
# path 日志文件路径（相对进程工作目录）。
path = "log/admin.log"

# level 日志级别: debug / info / warn / error。
level = "info"

# printConsole 是否同时输出到控制台。
printConsole = true

# maxSizeMB 单个日志文件最大体积（MB），超过后轮转。
maxSizeMB = 100

# maxBackups 轮转后保留的旧文件数量。
maxBackups = 10

# maxAge 旧文件最大保留天数。
maxAge = 30

# localTime 轮转文件名是否使用本地时区。
localTime = true

# compress 是否 gzip 压缩旧日志文件。
compress = true

# ─── pprof 调试 ────────────────────────────────────────
# 启用后 http://localhost:<port>/debug/pprof 可获取 Go runtime profile。
[pprof]
# port pprof HTTP 监听端口。
port = 6060
