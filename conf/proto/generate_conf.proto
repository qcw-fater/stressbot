}

//ActorLevel.csv
message ActorLevelConfig
{
	int32 Level = 1; //Level
	int32 NextExp = 2; //升级所需经验值
}

//ActorRenderModule.csv
message ActorRenderModuleConfig
{
	int32 ActorRenderType = 1; //单位表现类型
