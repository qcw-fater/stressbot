}

//AreaParameter.csv
message AreaParameterConfig
{
	int32 ID = 1; //ID
	int32 Param1 = 2; //参数1
	float Param2 = 3; //参数2
	string Param3 = 4; //参数3
	repeated int32 Param4 = 5; //参数4
}

//Attribute.csv
message AttributeConfig
{
	int32 ID = 1; //ID
	string AttrName = 2; //属性名称
	string Name = 3; //Name
	int32 ShowType = 4; //显示类型
	string ShowUnit = 5; //显示单位
	int32 KeepDecimal = 6; //保留小数位数
	int32 IsShow = 7; //是否显示该属性
	int32 AttrUnitValue = 8; //单位价值的属性值
}

//AudioPlayFMODPool.csv
message AudioPlayFMODPoolConfig
{
	int32 ID = 1; //ID
	int32 RandomType = 2; //随机类型
	int32 RandomProbability = 3; //随机播放概率[0， 10000]
	repeated int32 RandomWeights = 4; //随机权重列表
	string AudioAssetName = 5; //音效资源名
	string AudioEventName = 6; //音效事件列表
	repeated string ParameterNames = 7; //音效参数名列表
	repeated string ParameterValues = 8; //对应音效参数值列表
	repeated string AudioClipNames = 9; //音频名称列表
	int32 GroupType = 10; //音频组类型
	int32 DelayPlayTime = 11; //延迟播放时间(ms)
}

//AudioPlayPool.csv
message AudioPlayPoolConfig
{
	int32 ID = 1; //ID
	string TemplateName = 2; //播放模板名称
	int32 RandomType = 3; //随机类型
	int32 RandomProbability = 4; //随机播放概率[0， 10000]
	repeated int32 RandomWeights = 5; //随机权重列表
	repeated string AudioClipNames = 6; //音频名称列表
	repeated int32 Volumes = 7; //音频音量列表[0， 100]
	int32 IsLoopRaw = 8; //是否循环播放
	int32 GroupType = 9; //音频组类型
	int32 DelayPlayTime = 10; //延迟播放时间(ms)
	int32 FadeInTime = 11; //淡入时间(ms)
	int32 FadeOutTime = 12; //淡出时间(ms)
}

//AutoEmojiRegister.csv
message AutoEmojiRegisterConfig
{
	int32 ID = 1; //id
	string Name = 2; //名称
	repeated int32 Params = 3; //条件类型
	int32 IsOn = 4; //是否启用
}

//AutoMessageConfig.csv
message AutoMessageConfigConfig
{
	int32 ID = 1; //序号
	int32 MessageType = 2; //消息类型
	int32 CheckType = 3; //检测目标类型
	string MessageGroup = 4; //消息分组(给优先级使用的)
	int32 Priority = 5; //优先级
	int32 StartTriggerID = 6; //开始触发的行为ID
	int32 EndTriggerID = 7; //结束触发的行为ID
	repeated int64 Desc = 8; //多语言描述
	repeated int32 RandomWeight = 9; //随机权重
	int64 BtnName = 10; //按钮名字
	int32 ShowFireName = 11; //是否显示触发者名称
	int32 ShowFireIcon = 12; //是否显示触发者头像
	string BigIcon = 13; //大图标
	string SmallIcon = 14; //小图标
	repeated int32 EnableGameTypes = 15; //启用的游戏模式
	int32 BtnShowDurationMS = 16; //按钮显示持续时间(毫秒)
	int32 ShowDurationMS = 17; //消息持续时间
	int32 CoolDownTimeMS = 18; //内置cd
	repeated int32 AudioIDs = 19; //音频ID
	int32 MaxScore = 20; //最大分
	int32 AIRandomRate = 21; //AI发送概率（0-100）
	int32 EmojiID = 22; //emoji表情id
	int32 AIDelayTimeMS = 23; //随机时间
}

