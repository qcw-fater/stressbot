syntax = "proto3";
option go_package = ".;pb";
package Game;
import "common.proto";

//AchievementBase.csv
message AchievementBaseConfig
{
	int32 ID = 1; //成就ID
	int32 Type = 2; //成就类型
	int32 TypeParameter = 3; //类型参数
	repeated int32 TaskID = 4; //任务ID
	repeated int32 TaskLogic = 5; //任务间逻辑
	int32 Score = 6; //积分奖励
	repeated RewardConfig Reward = 7; //成就奖励
	int32 IsShowInGame = 8; //是否在局内弹出
}

//AchievementIP.csv
message AchievementIPConfig
{
	int32 ID = 1; //ID
	int32 IPID = 2; //IPID
	int32 HeroID = 3; //英雄ID
	string Image = 4; //单人图片
	int32 TeamID = 5; //组ID
	string TeamName = 6; //组名称
	string TeamImage = 7; //组图片
	string StartTime = 8; //展示时间
}

//AchievementReward.csv
message AchievementRewardConfig
{
	int32 ID = 1; //IPID
	repeated int32 Score = 2; //积分要求
	repeated int32 Reward = 3; //奖励
}

//ActiveReward.csv
message ActiveRewardConfig
{
	int32 ID = 1; //序号
	int32 ActiveValue = 2; //活跃度
	int32 Type = 3; //类型
	repeated string Icons = 4; //图标组
	int32 RewardID = 5; //奖励ID
}

//ActivityBase.csv
message ActivityBaseConfig
{
	int32 ActivityID = 1; //活动ID
	int32 PageID = 2; //页签ID
	string PageName = 3; //页签名称
	string PageIcon = 4; //页签图标
	int32 PageIndex = 5; //页签排序
	string Name = 6; //活动名称
	string Desc = 7; //活动描述
	int32 Type = 8; //活动类型
	int32 Index = 9; //排序
	int32 TimeType = 10; //计时类型
	string StartTime = 11; //开始时间
	int32 Time = 12; //持续时间
	int32 TrophyLimit = 13; //可见奖杯
	string BackGround = 14; //活动背景图
	string Title = 15; //活动标题图片
	string TitleText = 16; //活动名称（程序字时使用）
	int32 DataSources = 17; //数据来源
	repeated int32 UIGoTo = 18; //跳转ID
	string HallButtonName = 19; //大厅入口名称
	string HallButtonIcon = 20; //大厅入口图片
	repeated int32 CashID = 21; //直购ID
}

//ActivityCompetitionBase.csv
message ActivityCompetitionBaseConfig
{
	int32 ID = 1; //活动序号
	int32 Name = 2; //活动赛主题
	string StarTime = 3; //开始时间
	int32 Days = 4; //持续时间
	repeated int32 StageGameBattle = 5; //阶段地图
	int32 BaseDefeat = 6; //基础失败次数
	int32 BuyDefeatNum = 7; //购买失败次数
	int32 MaxBuyNum = 8; //最大购买次数
	repeated int32 BuyCost = 9; //购买消耗
	string BackgroundImg = 10; //背景图片
}

//ActivityCompetitionReward.csv
message ActivityCompetitionRewardConfig
{
	int32 ID = 1; //奖励id
	int32 Stage = 2; //阶段
	int32 CompetitionId = 3; //活动id
	repeated RewardConfig Reward = 4; //胜场奖励
	int32 VictorNum = 5; //胜场数
	int32 IsEndReward = 6; //是否最终奖励
}

//ActivityExchange.csv
message ActivityExchangeConfig
{
	int32 ID = 1; //兑换ID
	int32 ActivityID = 2; //所属活动ID
	repeated RewardConfig ItemNeed = 3; //兑换需要
	repeated RewardConfig ItemExchange = 4; //兑换产出
	int32 LimitNumber = 5; //限购次数
	int32 Select = 6; //默认勾选
}

//ActivityHeroTrailHallButton.csv
message ActivityHeroTrailHallButtonConfig
{
	int32 ID = 1; //试炼活动ID
	string HallButtonName = 2; //大厅入口名称
	string HallButtonIcon = 3; //大厅入口图片
}

//ActivityMain.csv
message ActivityMainConfig
{
	int32 ID = 1; //活动序号
	string Name = 2; //关联活动
	string SubTitle = 3; //子标题
	string NameEn = 4; //英文名
	int32 UnLockCond = 5; //解锁条件
	int32 UnlockParam = 6; //解锁参数
	int32 Order = 7; //排序
	int32 Tag = 8; //标签
	string Icon = 9; //图标
	int32 IsShow = 10; //是否开启
}

//ActivityPicture.csv
message ActivityPictureConfig
{
	int32 ID = 1; //ID
	int32 ActivityID = 2; //活动ID
	string Name = 3; //图片资源名称
