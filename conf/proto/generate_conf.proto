//ActorRevive.csv
message ActorReviveConfig
{
	int32 ID = 1; //ID
	int32 ReviveTime = 2; //复活时间
}

//AlwaysFreeHero.csv
message AlwaysFreeHeroConfig
{
	int32 ID = 1; //ID
	int32 LevelLimit = 2; //等级下限
	int32 IgnoreLimitHero = 3; //是否忽略每周限免
	repeated int32 HeroID = 4; //永久免费英雄池
}

//AppearanceLimit.csv
message AppearanceLimitConfig
{
	int32 ID = 1; //限定ID
	int32 ComponentId = 2; //装扮部件id
	int32 OutputLimit = 3; //产出上限
