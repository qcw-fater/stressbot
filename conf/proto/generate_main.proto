// 心跳
message MainServerTimeC2S {
    int32 playerId = 1; // 玩家id
}
// 心跳
message MainServerTimeS2C {
    int64 timestamp = 1; // 服务器时间戳
    int32 year      = 2; // 服务器年份
    int32 month     = 3; // 服务器月份
    int32 day       = 4; // 服务器日期
    int32 hour      = 5; // 服务器小时数
    int32 minute    = 6; // 服务器分钟数
    int32 second    = 7; // 服务器秒数
    int32 timezone  = 8; // 服务器时区
}

// 通知客户端踢人
message MainPlayerKickS2C {
    // int32 reason = 1; //原因 0:顶号 1:踢人通知 2:数据异常 3:gm踢人
