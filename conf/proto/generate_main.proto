// 战斗画面设置面板
message MainBattleFrameSettingC2S {
    int32 dpi                 = 1;  // 分辨率：低、中、高、超高
    int32 frameRate           = 2;  // 帧率：低、中、高
    int32 MSAA                = 3;  // 抗锯齿：低、中、高
    int32 SceneQuality        = 4;  // 战斗场景质量：低、中、高、超高
    int32 roleQuality         = 5;  // 战斗角色质量：低、中、高
    int64 battleId            = 6;  // 是否战斗中
    int32 AutoNormalAttack    = 7;  // 自动普攻
    int32 AutoChaseDistance   = 8;  // 自动追击距离
    int32 lensHeight          = 9;  // 镜头高低
    int32 FullShow            = 10; // 非全屏演出
    int32 EquipSite           = 11; // 局内出装位置
    int32 PreciseNormalAttack = 12; // 精确普攻
    float LensSensitivity     = 13; // 镜头灵敏度
    float SkillSensitivity    = 14; // 技能轮盘灵敏度
    int32 AttackPriority      = 15; // 优先选择规则
    int32 SkillSite           = 16; // 技能轮盘呼出位置
    int32 PictureSettings     = 17; // 画面设置
}
// 战斗画面设置面板
message MainBattleFrameSettingS2C {}

