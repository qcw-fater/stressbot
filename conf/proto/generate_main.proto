// 进入训练模式
message MainEnterTrainingC2S {
    int32 heroId       = 1; // 使用角色
    int32 skillId      = 2; // 使用技能
    int32 target_hero  = 3; // target_hero: 对方英雄
    int32 target_skill = 4; // target_skill：对方技能
    int64 awake        = 5; //    awake：觉醒数据
    int32 step         = 6; // 当前步骤
}
// 退出训练模式
message MainExitTrainingC2S {
    int32 heroId       = 1; // 使用角色
    int32 skillId      = 2; // 使用技能
    int32 target_hero  = 3; // target_hero: 对方英雄
    int32 target_skill = 4; // target_skill：对方技能
    int64 awake        = 5; //    awake：觉醒数据
    int32 exitType     = 6; //  退出方式  （0：中途退出，1：战斗结束）
    int32 time         = 7; //  战斗时长 单位：秒
}

// 通知客户端返回大厅
message MainBackLobbyS2C {
    BL_REASON      Reason          = 1; // 返回大厅原因
    GameModel      model           = 2; // 游戏模式
    GameType       gType           = 3; // 游戏类型
    int32          battleModeId    = 4; // 当前匹配的模式
    repeated int32 playerIdList    = 5; // 异常玩家id列表
    int64          notReadyEndTime = 6; // 匹配惩罚结束时间
    int32          notReadyCnt     = 7; // 匹配未准备次数
}

message MoneyInfo {
    int32 moneyId    = 1; // 货币id
    int64 moneyValue = 2; // 货币当前值
}

