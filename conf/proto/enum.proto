    BS_Loading    = 1; // 加载
    BS_Fighting   = 2; // 开始战斗
    BS_Settlement = 3; // 结算
}

// 返回大厅原因
enum BL_REASON {
    BL_INVALID          = 0;  // 占位111
    UNUSUAL_RESULT      = 1;  // 异常结算,全部为AI
    UNUSUAL_MATCH       = 2;  // 表示匹配异常
    NO_PREPARE          = 3;  // 标识未准备被踢
    PREPARE_TIMEOUT     = 4;  // 已准备因有玩家未准备
    UNUSUAL_CRC_FAILED  = 5;  // CRC校验失败
    TEAM_KICK           = 6;  // 队长踢人
    INITIATIVE_BACK     = 7;  // 主动返回大厅
    SERVER_UNUSUAL      = 8;  // 服务器异常
    SETTLE_TIMEOUT      = 9;  // 玩家停留在战斗结算界面过长，房间销毁，回到大厅
    INIT_STATE          = 10; // 自定义房间初始状态到达最大时长,在初始状态停留过长
    MAX_TIMEOUT         = 11; // 房间最大时长
    MD5_UNUSUAL_RESULT  = 12; // MD5异常结算,需要仲裁
    PLAYER_REPETITION   = 13; // 房间内存在相同的玩家，房间无效，直接解散
    NOT_FIND_BATTLE     = 14; // 房间到达最大时长，战斗服务器，战斗未找到
    BATTLE_CREATE_FAIL  = 15; // 等待战斗服反馈创建房间超时
    RANDOM_HERO_ERR     = 16; // 未随机到英雄，战斗异常，所有玩家返回大厅
    GET_BATTLE_ERROR    = 17; // 未找到战斗服务器
    SELECT_HERO_ERROR   = 18; // 有玩家没有选择英雄,可能没有英雄选择
    QUIT_LOOK           = 19; // 裁判位退出观战
    SELECT_HERO_REPEAT  = 20; // 有玩家预选了相同的英雄
    SELECT_HERO_TIMEOUT = 21; // 有玩家选择英雄超时,未选择英雄
}

// 战斗结算原因
enum BE_REASON {
    BE_INVALID                    = 0; // 占位
    BE_NORMAL                     = 1; // 正常结算
    BE_UNUSUAL_CRC                = 2; // CRC异常, 终止战斗
    BE_UNUSUAL_ALL_AI             = 3; // 房间没人, 解散
    BE_UNUSUAL_SETTLEMENT_TIMEOUT = 4; // 结算超时
    BE_CAPITULATE                 = 5; // 投降认输
    BE_EXIT                       = 6; // 退出本局
    BE_ALL_CAPITULATE             = 7; // 全投降认输
    BE_RESULT_ABNORMAL            = 8; // 战斗结果异常
}

