syntax             = "proto3"; //[proto2|proto3]

option  go_package = ".;pb";
package Game;

enum LoginType {
    LT_default       = 0; // 正常登录
    LT_reconnect     = 1; // 重连
    LT_changeConnect = 2; // 更换logic
}

// 玩家状态
enum PlayerStatus {
