syntax = "proto3";  //[proto2|proto3]

option go_package = ".;pb";
package Game;

// 导入枚举
import "player.proto";
import "enum_battle.proto";
import "enum.proto"; // BOType / LadderDraftType（ObBattleInfoBase/ObBattleBaseClient 的 boType/draftType 字段）
import "nohot_custom_battle.proto"; // PlayerStandings（ObReplayInfo 展示体）

message ObBattlePlayer {
    PlayerBase base = 1;  // 玩家基础数据
    CampType camp   = 2;  // 阵营
    bool IsRobot    = 3;  // 是否为机器人
    int32 index     = 4;  // 房间内的唯一编号
    int32 ladder    = 5;  // 段位
}

// 用作列表展示
message ObBattleInfoBase {
    int64 battleId                  = 1;  // 房间ID
    GameModel model                 = 2;  // 玩法类型
    GameType gType                  = 3;  // 玩法类型
    int32 battleModeId              = 4;  // 匹配类型
    repeated PlayerGameInfo players = 5;  // 玩家信息
    int64 randSeed                  = 6;  // 随机种子
    int64 beginTimestamp            = 7;  // 开始时间
    int32 avgLadder                 = 8;  // 平均段位
    int32 battleServerId            = 9;  // 战斗服务器地址
    int32 avgStar                   = 10; // 平均星级
    int32 matchFlag                 = 11; // 匹配标识 0普通 1新手 2温暖
    int32 hazardOpsDifficultyLevel  = 12; // 搜打撤难度等级
    repeated int32 affix            = 13; // 词缀（与真实战斗 Record.affix 同源，客户端据此还原 BattleEventIdxs）
    int32 godPlayerId               = 14; // 上榜代表玩家 ID（room 写 detail 时固化；0=无代表/未上榜）
    BOType boType                   = 15; // 自定义房间赛制（BO几：0无效/1单局/3三局两胜/5五局三胜），与参战方 BattleStartLoadingS2C.Record.Bo 同源
    LadderDraftType draftType       = 16; // 征召类型（0自由/1Pick/2BanPick），与参战方 BattleStartLoadingS2C.Record.DraftType 同源
}

message ObBattleInfo {
    ObBattleInfoBase base = 1;  // 基础数据
    int32 playerCount     = 2;  // 观看人数
}

// 用于客户端展示
message ObPlayerInfoClient {
    CampType camp      = 1;   // 阵营
    int32 selectHeroId = 2;   // 选择的英雄
    string name        = 3;   // 玩家姓名
    int32 icon         = 4;   // 头像
    int32 iFrame       = 5;   // 头像框
    int32 showLevel    = 6;   // 玩家总等级
    int32 ladderLevel  = 7;   // 5v5段位等级
    int32 starNum      = 8;   // 5v5星星数量
    int32 DragonScore  = 9;   // 龙珠积分
    int32 playerId     = 10;  // 玩家ID
    bool isGod         = 11;  // 是否为本局大神观战代表（上榜推荐分最高的 1 人；仅大神列表 31|1 置位）
    int32 cupNumber    = 12;  // 所选英雄杯数（selectHeroes[0] 对应 HeroInfo.cupNumber）
}

// 用于客户端展示
message ObBattleBaseClient {
    int64 battleId                      = 1;  // 房间ID
    GameModel model                     = 2;  // 游戏模式
    GameType gType                      = 3;  // 玩法类型
    int32 battleModeId                  = 4;  // 匹配类型
    repeated ObPlayerInfoClient players = 5;  // 玩家信息
    int64 randSeed                      = 6;  // 随机种子
    int64 beginTimestamp                = 7;  // 开始时间
    int32 avgLadder                     = 8;  // 平均段位
    int32 battleServerId                = 9;  // 战斗服务器地址
    int32 avgStar                       = 10;  // 平均星级
    repeated int32 affix                = 11;  // 地图词缀（与 ObBattleInfoBase.affix 同源，客户端据此还原 BattleEventIdxs）
    BOType boType                       = 12;  // 自定义房间赛制（与 ObBattleInfoBase.boType 同源，客户端据此还原 BO3 流程）
    LadderDraftType draftType           = 13;  // 征召类型（与 ObBattleInfoBase.draftType 同源）
}
// 用于客户端展示
message ObBattleClient {
    ObBattleBaseClient base = 1;  // 基础数据
    int32 playerCount       = 2;  // 观看人数
}

message CommonRpcRequest {
    int32 srcSid         = 1;  // 来源服务器Id
    int32 targetSid      = 2;  // 目标服务器Id
    int64 srcObjectId    = 3;  // 来源对象Id
    int64 targetObjectId = 4;  // 目标对象Id
    int32 cmd            = 5;
    int32 act            = 6;
    int32 index          = 7;
    bytes data           = 8;
    int32 errorId        = 9;
}

message BattleFrameData {
    repeated bytes frames = 1;
    int64 latestFrame     = 2;  // 当前帧前沿索引（observer 拉帧用，PERF）
    bool endFlag          = 3;  // 战斗是否已结束
}

// 回放/录像/收藏列表通用条目（同时作为玩家维度录像/收藏的存储 meta，B3）
// 展示体统一用 PlayerStandings（对战后战绩，含结果/段位/英雄），回放榜/我的录像/收藏共用。
message ObReplayInfo {
    PlayerStandings standings = 1;  // 对战战绩（展示体）
    int32 avgLadderCode       = 2;  // 平均段位编码（巅峰回放榜排序分）
    bool collected            = 3;  // 当前玩家是否已收藏
    int64 markTimestamp       = 4;  // 保存/收藏时间戳
    string battleVersion      = 5;  // 录像版本（对齐 PlayerBattleEnd.battleVersion，失效判定绑定）
    bool valid                = 6;  // 录像是否有效（版本更新后列表层标失效，文件不删）
    int32 recordType          = 7;  // 来源类型 0=主动保存 1=收藏 2=巅峰回放
    int32 winCamp             = 8;  // 对战结果：胜方阵营
}

message BulletInfo {
    int64 timestamp   = 1;  // 发送时间
    string content    = 2;  // 内容
    string senderName = 3;  // 发送者名字
    int32 senderId    = 4;  // 发送者Id
    int64 battleId    = 5;  // 战斗Id
}
message BulletInfoMap {
    map<int32, BulletInfo> mp = 1;  // key:senderId
}

message FriendBattleInfo {
    ObBattleClient base = 1;
    int32 friendId      = 2;
}