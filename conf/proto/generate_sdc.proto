syntax             = "proto3";
option  go_package = ".;pb";
package Game;

import "custom_sdc.proto";
import "nohot_custom_battle.proto";
import "common.proto";

// ==================== 战备系统协议 ====================

// 请求战备数据
message SdcGetPrepareDataC2S {}

// 战备数据响应
message SdcGetPrepareDataS2C {
    SDCPrepareData data     = 1; // 战备数据
    int32 errorCode         = 2; // 错误码
    SDCSuitState suitState  = 3; // 当前套装使用状态
}

// 装配道具请求
message SdcEquipItemC2S {
    int64 itemGuid = 1; // 道具GUID
    int32 slotType = 2; // 目标槽位类型
}

// 装配道具响应
message SdcEquipItemS2C {
    SDCEquipSlot slot               = 1; // 装配后的槽位信息
    int32 totalValue                = 2; // 更新后的总价值
    SDCHeroTalentAwakeInfo heroInfo = 3; // 更新后的英雄天赋觉醒（装配影响加成时有值）
    int32 errorCode                 = 4; // 错误码
    SDCWarehouseData warehouseData  = 5; // 仓库数据（道具来自仓库时有值）
    SDCPackSlot sourcePack          = 6; // 来源背包数据（道具来自背包时有值）
    SDCPackSlot collectionPack      = 7; // 藏品背包数据（slotType=3时有值）
}

// 卸下道具请求
message SdcUnequipItemC2S {
    int32 slotType = 1; // 槽位类型
}

// 卸下道具响应
message SdcUnequipItemS2C {
    int32 slotType                           = 1; // 槽位类型
    SDCWarehouseItem item                    = 2; // 卸下的道具
    int32 totalValue                         = 3; // 更新后的总价值
    repeated SDCWarehouseItem relocatedItems = 4; // 归位仓库的藏品列表
    SDCHeroTalentAwakeInfo heroInfo          = 5; // 更新后的英雄天赋觉醒（卸下影响加成时有值）
    int32 errorCode                          = 6; // 错误码
}

// 移动道具请求
message SdcMoveItemC2S {
    int64 itemGuid     = 1; // 道具GUID
    int32 fromPackType = 2; // 来源背包类型（0=仓库，-1=装配槽位）
    int32 toPackType   = 3; // 目标背包类型（0=仓库）
    int32 fromSlotType = 4; // 来源装配槽位类型（fromPackType=-1时为SDCSlotType枚举值）
}

// 移动道具响应
message SdcMoveItemS2C {
    SDCPackSlot fromPack           = 1; // 来源背包（fromPackType=0时为nil）
    SDCPackSlot toPack             = 2; // 目标背包（toPackType=0时为nil）
    int32 totalValue               = 3; // 更新后的装配区域总价值
    int32 errorCode                = 4; // 错误码
    SDCWarehouseData warehouseData = 5; // 仓库数据（涉及仓库操作时有值）
    SDCEquipSlot unequippedSlot    = 6; // 被清空的装配槽位（从装配槽位移出时有值）
}

// 出售道具请求
message SdcSellItemC2S {
    int64 itemGuid = 1; // 道具GUID
    int32 fromType = 2; // 来源类型（0=仓库 1=装配槽位 2=背包）
    int32 fromSlot = 3; // 来源槽位/背包类型
}

// 出售道具响应
message SdcSellItemS2C {
    int64 itemGuid   = 1; // 道具GUID
    int32 sellValue  = 2; // 出售获得数量
    int32 moneyType  = 3; // 出售货币类型
    int32 totalValue = 4; // 更新后的装配区域总价值
    int32 errorCode  = 5; // 错误码
    repeated SDCPackSlot updatedPacks = 6; // 出售后发生变化的背包数据；背包被删除时仅携带packType
}

// 批量出售请求
message SdcBatchSellC2S {
    repeated int64 itemGuids = 1; // 道具GUID列表
}

// 单种货币的出售结果
message SdcSellCurrencyResult {
    int32 moneyType  = 1; // 货币类型
    int32 totalValue = 2; // 获得数量
}

// 批量出售响应
message SdcBatchSellS2C {
    repeated int64 soldGuids                 = 1; // 成功出售的道具GUID列表
    repeated SdcSellCurrencyResult currencyResults = 2; // 各货币类型获得明细
    int32 errorCode                          = 3; // 错误码
    repeated SDCPackSlot updatedPacks        = 4; // 出售后发生变化的背包数据；背包被删除时仅携带packType
}

// ==================== 仓库系统协议 ====================

// 请求仓库数据
message SdcGetWarehouseDataC2S {}

// 仓库数据响应
message SdcGetWarehouseDataS2C {
    SDCWarehouseData data = 1; // 仓库数据
    int32 errorCode       = 2; // 错误码
}

// ==================== 赛季系统协议 ====================

// 请求赛季数据
message SdcGetSeasonDataC2S {
    int32 playerId = 1; // 目标玩家ID，0表示自己
}

// 赛季数据响应
message SdcGetSeasonDataS2C {
    SDCSeasonData data = 1; // 赛季数据
    int32 errorCode    = 2; // 错误码
}

// 领取赛季奖励请求
message SdcSeasonRewardC2S {
    int32 rewardId = 1; // 奖励配置 ID（SDCSeasonReward.ID）
}

// 领取赛季奖励响应
message SdcSeasonRewardS2C {
    int32 rewardId                    = 1; // 奖励配置 ID（SDCSeasonReward.ID）
    repeated SDCWarehouseItem rewards = 2; // 奖励道具
    int32 errorCode                   = 3; // 错误码
}

// ==================== 成长系统协议 ====================

// 请求成长数据
message SdcGetGrowthDataC2S {}

// 成长数据响应
message SdcGetGrowthDataS2C {
    SDCGrowthData data = 1; // 成长数据
    int32 errorCode    = 2; // 错误码
}

// 成长升级请求
message SdcGrowthUpgradeC2S {
    SDCGrowthUpgradeType upgradeType = 1; // 升级类型
}

// 成长升级响应
message SdcGrowthUpgradeS2C {
    SDCGrowthData data = 1; // 升级后的完整成长数据
    int32 errorCode    = 2; // 错误码
}

// ==================== 藏品系统协议 ====================

// 请求藏品数据
message SdcGetCollectionDataC2S {}

// 藏品数据响应
message SdcGetCollectionDataS2C {
    SDCCollectionData data = 1; // 藏品数据
    int32 errorCode        = 2; // 错误码
}

// ==================== 队伍系统协议 ====================

// 设置补齐队友选项请求
message SdcFillTeammateC2S {
    bool fillTeammate = 1; // 是否开启补齐队友
}

// 设置补齐队友选项响应
message SdcFillTeammateS2C {}
//打开背包请求
message SdcPackOpenC2S
{
}
//打开背包请求
message SdcPackOpenS2C
{
	SDCPrepareData data = 1; // 战备数据（包含背包信息）
}

// SDC 道具使用请求
message SdcPackUseC2S {
    int64 itemGuid = 1;   // 道具GUID
    int32 number   = 2;   // 使用数量
}

// SDC 道具使用响应
message SdcPackUseS2C {
    SDCHeroTalentAwakeInfo heroInfo = 1;  // 更新后的天赋觉醒加成信息
    SDCWarehouseData warehouseData  = 2; // 使用后的仓库数据
    SDCPackSlot collectionPack      = 3; // 使用后的藏品背包数据
}
//获取升级预览列表
message SdcGetUpgradePreviewC2S
{
	int32 moduleType = 1; // 模块类型（ModuleType枚举：1仓库 2战斗背包 3商店 4-7制作台）
}
//获取升级预览列表
message SdcGetUpgradePreviewS2C
{
	repeated SDCUpgradePreviewItem previewList = 1; // 预览列表
	int32 errorCode = 2;
}
//获取制作台可制作列表
message SdcGetCraftListC2S
{
	int32 stationType = 1; // 制作台类型（1护甲 2增幅器 3芯片 4消耗品）
}
//获取制作台可制作列表
message SdcGetCraftListS2C
{
	repeated SDCCraftableItem craftableItems = 1; // 可制作道具列表
	repeated SDCCraftSlot craftSlots         = 2; // 制作台状态
	int32 errorCode = 3;
}
//发起制作
message SdcStartCraftC2S
{
	int32 stationType = 1; // 制作台类型
	int32 itemId      = 2; // 要制作的道具ID
}
//发起制作
message SdcStartCraftS2C
{
	SDCCraftSlot craftSlot = 1; // 制作台状态
	int32 errorCode        = 2;
}
//领取制作产物
message SdcClaimCraftC2S
{
	int32 stationType = 1; // 制作台类型
}
//领取制作产物
message SdcClaimCraftS2C
{
	SDCWarehouseItem item    = 1; // 领取的道具
	SDCCraftSlot craftSlot   = 2; // 制作台状态（已清空）
	int32 errorCode          = 3;
}
//仓库道具变更推送（服务器主动推送）
message SdcWarehouseUpdateS2C
{
    repeated SDCWarehouseItem addItems = 1; // 新增的仓库道具列表
}
//替换道具请求（背包↔仓库、背包↔装配槽位拖动替换）
message SdcSwapItemC2S
{
    int64 sourceItemGuid  = 1; // 被拖动的道具GUID
    int32 sourcePackType  = 2; // 来源背包类型（SDCPackType枚举，仓库为0）
    int32 swapType        = 3; // 替换类型（1=背包→仓库 2=仓库→背包 3=背包→装配槽位）
    int64 targetItemGuid  = 4; // 目标位置道具GUID（0=空位不替换）
    int32 targetPackType  = 5; // 目标背包类型（swapType=2时有效）
    int32 targetSlotIndex = 6; // 目标背包槽位索引（swapType=2时有效，-1=自动分配）
    int32 targetSlotType  = 7; // 目标装配槽位类型（swapType=3时有效，SDCSlotType枚举，仅4/5/6）
}
//替换道具响应
message SdcSwapItemS2C
{
    SDCPackSlot sourcePack           = 1; // 来源背包数据
    SDCPackSlot targetPack           = 2; // 目标背包数据
    SDCWarehouseData warehouseData   = 3; // 仓库数据
    SDCEquipSlot targetSlot          = 4; // 替换后的装配槽位（swapType=3时有值）
    SDCEquipSlot unequippedSlot      = 5; // 被清空的装配槽位
    int32 totalValue                 = 6; // 更新后的装配区域总价值
    int32 errorCode                  = 7; // 错误码
    SDCHeroTalentAwakeInfo heroInfo  = 8; // 更新后的英雄天赋觉醒
    SDCPackSlot collectionPack       = 9; // 藏品背包数据
}
//赛季结算与继承展示数据
message SdcSeasonSettleShowC2S
{
}
//赛季结算与继承展示数据
message SdcSeasonSettleShowS2C
{
    SDCSeasonSettleShowData data = 1; // 赛季结算展示数据
    int32 errorCode              = 2; // 错误码
}
//历史赛季列表
message SdcHistorySeasonListC2S
{
    int32 playerId = 1; // 目标玩家ID，0表示自己
}
//历史赛季列表
message SdcHistorySeasonListS2C
{
    repeated SDCHistorySeasonData list = 1; // 历史赛季列表
    int32 errorCode                      = 2; // 错误码
}
//历史赛季详情
message SdcHistorySeasonDetailC2S
{
    int32 seasonId = 1; // 赛季 ID
    int32 playerId = 2; // 目标玩家ID，0表示自己
}
//历史赛季详情
message SdcHistorySeasonDetailS2C
{
    SDCHistorySeasonData data = 1; // 历史赛季详情
    int32 errorCode           = 2; // 错误码
}
//设置排位功能开关（玩家勾选）
message SdcSetRankEnabledC2S
{
    bool enabled = 1; // 是否开启排位
}
//设置排位功能开关（玩家勾选）
message SdcSetRankEnabledS2C
{
    bool enabled    = 1; // 当前排位开关状态
    int32 errorCode = 2; // 错误码
}

//图鉴数据查询
message SdcGetCodexDataC2S {}
//图鉴数据查询
message SdcGetCodexDataS2C
{
    repeated SDCCodexEntryInfo entries = 1; // 全量条目信息（含状态、数量、奖励预览）
    repeated SDCCodexIpInfo ipList     = 2; // IP 收藏册数据（按 IP 分组的条目+里程碑）
}
//图鉴激活（首次/重复）
message SdcActivateCodexC2S
{
    int32 codexId = 1; // 要激活的条目 ID
}
//图鉴激活（首次/重复）
message SdcActivateCodexS2C
{
    int32 codexId           = 1; // 激活的条目 ID
    int64 firstActivateTime = 2; // 首次激活时间（首次激活时返回）
    int32 repeatCount       = 3; // 当前重复激活次数
    repeated SDCCodexRewardItem rewards = 4; // 本次获得的奖励
    repeated SDCCodexRewardItem endRewards = 5; // 最终奖励（n=RepeatNum 时返回）
    SDCCodexIpInfo affectedIpInfo = 6; // 受影响的 IP 收藏册数据（含更新后的里程碑状态）
}
//IP 里程碑领奖
message SdcClaimCodexMilestoneC2S
{
    int32 milestoneId = 1; // 里程碑 ID
}
//IP 里程碑领奖
message SdcClaimCodexMilestoneS2C
{
    int32 milestoneId       = 1; // 已领取的里程碑 ID
    repeated SDCCodexRewardItem rewards = 2; // 领取的奖励
    int32 status            = 3; // 领奖后状态（固定=2 已领取）
}
//一键入库请求
message SdcQuickDepositC2S
{
}
//一键入库响应
message SdcQuickDepositS2C
{
    repeated int64 depositedGuids     = 1; // 已成功入库的道具GUID列表
    SDCWarehouseData warehouseData    = 2; // 入库后的仓库数据
    repeated SDCPackSlot updatedPacks = 3; // 入库后发生变化的背包数据
    int32 totalValue                  = 4; // 更新后的装配区域总价值
    int32 errorCode                   = 5; // 错误码
    repeated SDCEquipSlot updatedSlots = 6; // 入库后发生变化的装配槽位数据，清空槽位仅保留slotType
}
//获取套装/预设界面数据
message SdcGetSuitPresetDataC2S
{
}
//获取套装/预设界面数据
message SdcGetSuitPresetDataS2C
{
    SDCPrepareData prepareData        = 1; // 最新战备数据
    SDCSuitState suitState            = 2; // 当前套装使用状态
    repeated SDCSuitPlanDisplay plans = 3; // 当前套装方案展示定档
    SDCPresetData lastPreset          = 4; // 上次配装
    repeated SDCPresetData presets    = 5; // 我的方案列表
}
//手动刷新套装方案
message SdcRefreshSuitPlanC2S
{
    int32 suitType = 1; // 套装券档位
    int32 planId   = 2; // 方案ID
}
//手动刷新套装方案
message SdcRefreshSuitPlanS2C
{
    SDCSuitPlanDisplay plan = 1; // 刷新后的方案展示
    SDCSuitPlanState state       = 2; // 刷新后的定档状态
}
//使用套装
message SdcUseSuitC2S
{
    int32 suitType = 1; // 套装券档位
    int32 planId   = 2; // 方案ID
}
//使用套装
message SdcUseSuitS2C
{
    SDCPrepareData prepareData = 1; // 使用套装后的战备数据
    SDCSuitState suitState     = 2; // 使用后的套装状态
    SDCWarehouseData warehouseData = 3; // 使用后的仓库数据
}
//取消套装
message SdcCancelSuitC2S
{
}
//取消套装
message SdcCancelSuitS2C
{
    SDCPrepareData prepareData        = 1; // 恢复后的战备数据
    SDCSuitState suitState            = 2; // 清理后的套装状态
    repeated SDCSuitPlanDisplay plans = 3; // 取消后展示的最新定档
}
//保存/覆盖我的方案
message SdcSavePresetC2S
{
    int32 slotIndex      = 1; // 我的方案槽位，从1开始
    string name          = 2; // 方案名
    SDCPresetData preset = 3; // 保存内容
    bool overwrite       = 4; // 是否覆盖已有方案
}
//保存/覆盖我的方案
message SdcSavePresetS2C
{
    SDCPresetData preset = 1; // 保存后的方案
}
//重命名我的方案
message SdcRenamePresetC2S
{
    int32 slotIndex = 1; // 我的方案槽位
    string name     = 2; // 新名称
}
//重命名我的方案
message SdcRenamePresetS2C
{
    SDCPresetData preset = 1; // 改名后的方案
}
//使用方案
message SdcUsePresetC2S
{
    int32 slotIndex = 1; // 方案槽位，0表示使用上次配装
    SDCPresetData preset = 2; // 可选临时方案内容，非空时优先使用，不回写上次配装/我的方案
}
//使用方案
message SdcUsePresetS2C
{
    SDCPrepareData prepareData = 1; // 使用后的战备数据
    SDCPresetData preset       = 2; // 本次使用的方案
    SDCWarehouseData warehouseData = 3; // 使用后的仓库数据
}
//一键购买补齐并使用方案
message SdcBuyFillPresetC2S
{
    int32 slotIndex                   = 1; // 方案槽位，0表示临时/上次配装
    repeated int32 itemIds            = 2; // 兼容旧字段：需要补齐的道具ID列表，重复次数表示数量
    repeated SDCBuyFillItem fillItems = 3; // 需要补齐的道具和数量；非空时优先使用该字段
    SDCPresetData preset              = 4; // 可选临时方案内容，非空时优先使用，不回写上次配装/我的方案
}
//一键购买补齐并使用方案
message SdcBuyFillPresetS2C
{
    SDCPrepareData prepareData          = 1; // 补齐并装配后的战备数据
    repeated SDCPurchaseFillInfo fills  = 2; // 实际购买补齐明细
    repeated ShowReward rewards         = 3; // 购买获得展示
    SDCWarehouseData warehouseData      = 4; // 补齐并装配后的仓库数据
}
//套装/预设数据变更推送
message SdcSuitPresetUpdateS2C
{
    SDCPrepareData prepareData        = 1; // 最新战备数据，可为空
    SDCSuitState suitState            = 2; // 最新套装状态，可为空
    repeated SDCSuitPlanDisplay plans = 3; // 变化后的方案定档，可为空
    SDCPresetData lastPreset          = 4; // 更新后的上次配装，可为空
    repeated SDCPresetData presets    = 5; // 更新后的我的方案，可为空
    repeated ShowReward rewards       = 6; // 自动分解等展示，可为空
    int32 reason                      = 7; // 推送原因：1=手动操作 2=自动刷新 3=进战提交 4=奖励分解
}
//取消制作
message SdcCancelCraftC2S
{
	int32 stationType = 1; // 制作台类型
}
//取消制作
message SdcCancelCraftS2C
{
	SDCCraftSlot craftSlot = 1; // 制作台状态（已清空）
	int32 errorCode        = 2;
}
//请求局外容器数据
message SdcGetOutBattleContainerDataC2S
{
}
//请求局外容器数据
message SdcGetOutBattleContainerDataS2C
{
	repeated SDCOutBattleContainerState containers = 1; // 钥匙链、安全箱状态
	SDCWarehouseData warehouseData                  = 2; // 当前仓库数据
	int32 errorCode                                 = 3; // 错误码
}
//激活局外容器权限卡
message SdcActivateOutBattleContainerC2S
{
	SDCPackType packType  = 1; // 激活目标类别
	int32 sdcParameterId  = 2; // 激活目标等级
	int64 itemGuid        = 3; // 仓库内权限卡GUID
	int32 number          = 4; // 使用数量
}
//激活局外容器权限卡
message SdcActivateOutBattleContainerS2C
{
	SDCOutBattleContainerState container = 1; // 激活后的目标容器状态
	SDCWarehouseData warehouseData       = 2; // 扣除权限卡后的仓库数据
	int32 errorCode                      = 3; // 错误码
}
//切换局外容器等级
message SdcSwitchOutBattleContainerC2S
{
	SDCPackType packType = 1; // 切换类别
	int32 sdcParameterId = 2; // 切换目标等级
}
//切换局外容器等级
message SdcSwitchOutBattleContainerS2C
{
	SDCOutBattleContainerState container = 1; // 切换后的目标容器状态
	SDCPackSlot packSlot                 = 2; // 当前容器格子数据
	int32 errorCode                      = 3; // 错误码
}
//过期容器全部移出
message SdcMoveOutBattleContainerAllC2S
{
	SDCPackType packType = 1; // 全部移出的容器类别
}
//过期容器全部移出
message SdcMoveOutBattleContainerAllS2C
{
	SDCOutBattleContainerState container = 1; // 移出后的容器状态
	SDCWarehouseData warehouseData       = 2; // 移出后的仓库数据
	repeated SDCWarehouseItem movedItems = 3; // 本次成功移出的道具
	repeated SDCWarehouseItem remainedItems = 4; // 仓库空间不足而仍留在原容器的道具
	bool partial                         = 5; // 是否部分移出
	int32 errorCode                      = 6; // 错误码
}
//局外容器状态推送
message SdcOutBattleContainerUpdateS2C
{
	repeated SDCOutBattleContainerState containers = 1; // 发生变化的容器状态
	SDCWarehouseData warehouseData                  = 2; // 如仓库变化则携带
