syntax = "proto3";
option go_package = ".;pb";
package Game;

// 设定星
message DisPatchEventMap
{
  map<int32, int32>    disPatchEventMap = 1;    //设星id key:id value:状态 0未完成  1完成
}

//建筑
message BuildDB
{
  int32   buildId = 1;    //建筑Id
  int32   level = 2;    //等级
  double  exp = 3;     //经验
  int32   conjunctionDegree = 4;    //契合度
  int32   productionStatus = 5;    //生产状态  0.空闲 1.运行中 2.终止 3
  int64   beginTime = 6;    //生产开始时间
  repeated int32 heroList = 7;    //生产的英雄
//  int64   lastYieldTime = 8;    //上次产出时间
  HeroBufferTypeList buffers = 9;    //英雄附加Buffer
  map<int32, double>       CommonItemMap = 10;    //普通产出 key:id value:数量 要包含小数
  map<int32, double>       SpecialItemMap = 11;    //特殊产出 key:id value:数量 要包含小数
  int32   maxLevel = 12;    //最大解锁等级
  int64   lastExpYieldTime = 13;    //上次毅之华产出和消耗时间
  int64   lastCommonOutYieldTime = 14;    //上次产出时间
  int64   lastSpecialOutYieldTime = 15;    //上次特殊产出时间
  int64   lastEventOutYieldTime = 16;    //上次产出时间
  int64   lastHeroOutYieldTime = 17;    //上次英雄特殊产出时间
  map<int32, double>       HeroOutItemMap = 18;    //英雄产出 key:id value:数量 要包含小数
  map<int32, double>       HeroOutItemRecordMap = 19;    //英雄产出记录 服务器使用
}

