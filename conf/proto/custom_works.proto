// 设定星记录
message DisPatchEventRecord
{
  int32  disPatchEventId = 1; //设定星id
  int64  productionTime = 2; //产出时间戳 秒
  int32  state = 3;        // 设定星状态  0未完成  1完成
}


//登录消息结构
message WorksLogin
{
  //WorksMainDB              mainInfo = 1;    //已解锁区域
  map<int32, BuildDB>       builds = 1;    //建筑信息
}

message HeroBuffer
{
  repeated int32 parameter = 1;         //buffer参数
}


message HeroBufferList
{
  repeated  HeroBuffer  list = 1;    //同类型buffer列表
}

message HeroBufferTypeList
{
  map<int32, HeroBufferList> typeMap = 1;  //buffer类型map
}