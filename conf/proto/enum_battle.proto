// 游戏模式
enum GameModel {
    GM_INVALID     = 0; // 无
    GM_NORMAL      = 1; // 休闲玩法
    GM_LADDER      = 2; // 排位赛
    GM_CUSTOM      = 3; // 自定义房间
    GM_TRAINING    = 4; // 训练模式
    GM_RECREATION  = 5; // 娱乐模式
    GM_BattleGuide = 6; // 战斗引导
    GM_ACTIVITY    = 7; // 活动赛
    GM_HAZARD_OPS  = 8; // 危险行动（搜打撤）
    GM_ACTIVITY_SINGLE = 9; // 单模式活动赛
}

// 玩法类型
enum GameType {
    GT_Invalid                 = 0;   // 无
    GT_BRAWL_STARS             = 1;   // 3v3卷轴争夺战
    GT_DUEL_ONE                = 2;   // 单人吃鸡
    GT_DUEL_TWO                = 3;   // 双人吃鸡
    GT_BUDOKAI                 = 4;   // 武道会
    GT_3V3_ATHLETICS           = 5;   // 3v3积分争夺
    GT_3V3_INFINITE_CITY       = 6;   // 3v3无限城
    GT_3V3_JUJUTSU_KAISEN      = 7;   // 3v3咒术高专交流会
    GT_TAKE_POSITION           = 8;   // 3V3夺点
    GT_MARINEFORD_WAR          = 9;   // 3V3顶上战争
    GT_INFINITE_TRAIN          = 10;  // 1v4无限列车模式
    GT_ANNIHILATION            = 11;  // 3v3歼灭战争
    GT_GREAT_SHINOBI_WAR       = 12;  // 3v3忍界大战
    GT_HUNTER_NUMBER_PLATE_ONE = 13;  // 猎人数号码牌_单人
    GT_HUNTER_NUMBER_PLATE_TWO = 14;  // 猎人数号码牌_双人
    GT_DRAGONBALL_BATTLE       = 15;  // 3v3龙珠争夺
    GT_GOLD_BOX                = 16;  // 金库模式
    GT_HAZARD_OPS              = 17;  // 危险行动（搜打撤模式）
    GT_MAX                     = 18;  // 有效游戏类型最大值

    GT_AI_TRAINING             = 100; // AI单机训练模式
    GT_GUIDANCE_DRAGON_BALL    = 200; // 引导模式-龙珠
    GT_GUIDANCE_ONE_PIECE      = 201; // 引导模式-海贼
    GT_GUIDANCE_NARUTO         = 202; // 引导模式-火影
}

// 战斗结果类型
enum BattleResultType {
    BRT_INVALID = 0; // 无
    BRT_WIN     = 1; // 胜利
    BRT_LOSE    = 2; // 失败
    BRT_DRAW    = 3; // 平局
}

enum EAttribute {
    MIN_INDEX          = 0;  // 最小索引
    PhysicalAtk        = 1;  // 物理攻击
    MaxHP              = 2;  // 血量最大值
    MoveSpeed          = 3;  // 移速
    Crit               = 4;  // 暴击概率
    CritRatio          = 5;  // 暴击伤害
    PhysicalVampire    = 6;  // 物理吸血
    CDDecrease         = 7;  // 冷却缩减
    Tenacity           = 8;  // 韧性
    Block              = 9;  // 伤害格挡
    ReviveTimeDecrease = 10; // 复活时间缩减
    EnergyMax          = 11; // 最大能量值
    EnergySpeed        = 12; // 每秒恢复多少值
    Energy             = 13; // 当前能量值
    EnergyNum          = 14; // 能量格子数量
    EnergyType         = 15; // 能量类型
    ChargeSpeed        = 16; // 蓄力速度
    HealingReceived    = 17; // 受到治疗效果
    HealingDone        = 18; // 造成治疗效果
    GreyHP             = 19; // 灰血层比列
    ExtraEnergy        = 20; // 额外能量当前值
    ExtraEnergyMax     = 21; // 额外能量最大值
    MAX_INDEX          = 22; // 最大索引
}

// 加入队伍方式
enum JoinTeamWay {
    JTW_Normal        = 0; // 普通方式
    JTW_ConveneCreate = 1; // 通过招募创建队伍
    JTW_ConveneJoin   = 2; // 通过招募加入队伍
}

// 收益评级
enum SDCRating {
  SDC_RATING_INVALID = 0; // 无效
  SDC_RATING_D       = 1; // D级
  SDC_RATING_C       = 2; // C级
  SDC_RATING_B       = 3; // B级
  SDC_RATING_A       = 4; // A级
  SDC_RATING_S       = 5; // S级
}

// 装配槽位类型
enum SDCSlotType {
  SDC_SLOT_TYPE_UNKNOWN            = 0; // 未知
  SDC_SLOT_TYPE_ARMOR              = 1; // 护甲槽
