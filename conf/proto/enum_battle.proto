syntax             = "proto3"; //[proto2|proto3]

option  go_package = ".;pb";
package Game;

// 阵营枚举
enum CampType {
    CtInvalid = 0;  // 无效
    CtCamp0   = 1;  // 阵营0 moba->红方
    CtCamp1   = 2;  // 阵营1 moba->蓝方
    CtCamp2   = 3;  // 阵营2 moba->怪物
    CtCamp3   = 4;  // 阵营3
    CtCamp4   = 5;  // 阵营4
    CtCamp5   = 6;  // 阵营5
    CtCamp6   = 7;  // 阵营6
    CtCamp7   = 8;  // 阵营7
    CtCamp8   = 9;  // 阵营8
    CtCamp9   = 10; // 阵营9
    JUDGE     = 11; // 裁判阵营 最大值，增加的时候往前增加
}

enum JudgeIndex {
    JI_Invalid = 0;
    JI_Value   = 10; // 裁判index起始值
}
// 阵营枚举标志 用于处理视野等多阵营选择
enum CampTypeMask {
    CtmInvalid = 0;    // 无效
    CtmCamp0   = 2;    // 阵营0 moba->红方
    CtmCamp1   = 4;    // 阵营1 moba->蓝方
    CtmCamp2   = 8;    // 阵营2 moba->怪物
    CtmCamp3   = 16;   // 阵营3
    CtmCamp4   = 32;   // 阵营4
    CtmCamp5   = 64;   // 阵营5
    CtmCamp6   = 128;  // 阵营6
    CtmCamp7   = 256;  // 阵营7
    CtmCamp8   = 512;  // 阵营8
    CtmCamp9   = 1024; // 阵营9
    CtmCamp10  = 2048; // 阵营10
    CtmCamp11  = 4096; // 阵营11
    CtmAll     = -1;   // 全部
}

// 战斗指令
enum BattleSyncCmd {
    BSC_NORMAL                 = 0;  // 占位
    USE_OBJECT_SKILL           = 1;  // 使用对象技能
    USE_DIRECTION_SKILL        = 2;  // 使用方向技能
    USE_POSITION_SKILL         = 3;  // 使用指定坐标技能
    BASE_ATTACK                = 4;  // 普攻
    MOVE                       = 5;  // 移动
    BUY_EQUIP                  = 6;  // 买装备
    SELL_EQUIP                 = 7;  // 卖装备
    LEARN_SKILL                = 8;  // 升级技能
    OLD_KEY_FRAME_DATA         = 9;  // 临时指令
    GM_COMMAND                 = 10; // GM指令
    SYNC_SKILL_STATUS          = 11; // 同步技能状态
    SELECT_USE_EQUIP           = 12; // 选择使用那件主动装备
    BATTLE_SETTING             = 13; // 战斗设置
    SELECT_EQUIP_INDEX         = 14; // 选则英雄装备设置下标
    EMISSION_SIGNAL            = 15; // 发送信号
    ENTER_NORMAL_ATK_STATE     = 16; // 进入普攻状态
    CHOOSE_LOOT                = 17; // 衍生玩法-抽卡
    CHOOSE_TALENT              = 18; // 衍生玩法-选择天赋
    SET_LOCK_TARGET            = 19; // 锁定目标
    SHORTCUT_SPEECH            = 20; // 快捷聊天
    EXPRESSION                 = 21; // 表情
    TITLE                      = 22; // 称号
    RandomRelax                = 23; // 互动
    PLAYER_OFFLINE             = 24; // 掉线
    RefreshPreEquipQueue       = 25; // 刷新预购装备队列
    SKILL_BUTTON_STATE         = 26; // 技能按键状态
    PLAYER_POINT_CHOOSE        = 27; // 英雄出生点选择
    MARINEFORD_WAR_SELECT_DRAW = 28; // 顶上战争玩家选择是否平局
    HERO_TALK                  = 29; // 英雄交流
    LFE_ITEM_CTL               = 30; // 搜打撤物品操作
    LFE_CHEST_CTL              = 31; // 搜打撤宝箱操作
    SKIN_BUFF_REGISTER         = 32; // 表现层BUFF注册
    CMD_MAX                    = 33; // 最大指令
}

// 任务参数组枚举
enum GroupDetailParamsType {
    GPT_INVALID      = 0;   // 无效
    GPT_Hero         = 1;   // 英雄id
    GPT_Image        = 2;   // 形象id
    GPT_Skill        = 3;   // 技能id
    GPT_Buff         = 4;   // buffId
    GPT_Area         = 5;   // 区域id
    GPT_Group        = 6;   // 组id
    GPT_Skin         = 7;   // 皮肤id
    GPT_RankLevel    = 8;   // RankLevel id
    GPT_Occupation   = 9;   // 职业 id
    GPT_NumberOfTime = 10;  // 纯数字
    GPT_Item         = 11;  // 道具id
    GPT_Prop         = 12;  // 局内装备id
    GPT_GameType     = 13;  // 游戏模式id组   同样读取GroupDetail中的数据
    GPT_Action       = 14;  // 动作id        Customized.xlsx
    GPT_Attribute    = 15;  // 属性id        Attribute.xlsx
    GPT_Stage        = 16;  // 局内地图id    Stage.xlsx
    GPT_Unit         = 17;  // Unitid     怪物id来这里    Unit.xlsx
    GPT_EventType    = 18;  // 事件类型
    GPT_EMOJI        = 19;  // 表情类型
    GPT_Times        = 100; // 次数  动态可变参数，显示的分母      客户端局内将忽略该数据
}

// 任务参数枚举
