syntax            = "proto3";
option go_package = ".;pb";
package Game;

import "global_operate_activity.proto";

// 获取运营活动列表
message OperateGetListC2S {
}

// 获取运营活动列表
message OperateGetListS2C {
    repeated Operate list = 1;  // 活动详细信息
}

// 添加运营活动
message OperateNewS2C {
    repeated Operate list = 1;  // 活动详细信息
}

// 更新运营活动内容
message OperateUpdateS2C {
    repeated OperateActivityDB detailed = 1;  // 更新内容
}

// 删除运营活动
message OperateDeleteS2C {
    int64 activityId = 1;  // 活动Id
}

// 领取运营任务奖励
message OperateGetTaskRewardC2S {
    int64 activityId          = 1;  // 活动Id
    int32 tplIndex            = 2;  // 模板索引
    repeated int32 taskIndexs = 3;  // 条目id
    int32 tplDay              = 4;  // 哪天的模板
}
// 领取运营任务奖励
message OperateGetTaskRewardS2C {
    int64 activityId          = 1;  // 活动Id
    int32 tplIndex            = 2;  // 模板索引
    repeated int32 taskIndexs = 3;  // 条目id
    int32 tplDay              = 4;  // 哪天的模板
}

// 签到
message OperateSignC2S {
    int64 activityId = 1;  // 活动Id
    int32 tplIndex   = 2;  // 模板索引
    int32 tplDay     = 3;  // 哪天的模板
}
// 签到
message OperateSignS2C {
    int64 activityId = 1;  // 活动Id
    int32 tplIndex   = 2;  // 模板索引
    int32 tplDay     = 3;  // 哪天的模板
}

// 补签
message OperateRepairSignC2S {
    int64 activityId = 1;  // 活动Id
    int32 tplIndex   = 2;  // 模板索引
    int32 tplDay     = 3;  // 哪天的模板
}
// 补签
message OperateRepairSignS2C {
    int64 activityId = 1;  // 活动Id
    int32 tplIndex   = 2;  // 模板索引
    int32 tplDay     = 3;  // 哪天的模板
}

// 签到领奖
message OperateSignGetRewardC2S {
    int64 activityId = 1;  // 活动Id
    int32 tplDay     = 2;  // 哪天的模板
    int32 tplIndex   = 3;  // 模板索引
    int32 day        = 4;  // 领取那个奖励
}

// 签到领奖
message OperateSignGetRewardS2C {
    int64 activityId = 1;  // 活动Id
    int32 tplDay     = 2;  // 哪天的模板
    int32 tplIndex   = 3;  // 模板索引
    int32 day        = 4;  // 领取那个奖励
}

// 购买商品
message OperateShopBuyC2S {
    int64 activityId = 1;  // 活动Id
    int32 tplIndex   = 2;  // 模板索引
    int32 goodsIndex = 3;  // 商品索引
    int32 tplDay     = 4;  // 哪天的模板
    int32 buyCnt     = 5;  // 购买数量
}
// 购买商品
message OperateShopBuyS2C {
    int64 activityId = 1;  // 活动Id
    int32 tplIndex   = 2;  // 模板索引
    int32 goodsIndex = 3;  // 商品索引
    int32 tplDay     = 4;  // 哪天的模板
    int32 buyCnt     = 5;  // 购买数量
}

// 获取积分奖励
message OperateGetScoreRewardC2S {
    int64 activityId = 1;  // 活动Id
    int32 scoreIndex = 2;  // 积分索引
}
// 获取积分奖励
message OperateGetScoreRewardS2C {
    int64 activityId = 1;  // 活动Id
    int32 scoreIndex = 2;  // 积分索引
}
// 获取自己排名
message OperateGetSelfRankC2S {
    int32 rankType = 1;
}
// 获取自己排名
message OperateGetSelfRankS2C {
    int32 rankType = 1;
    int32 rank     = 2;  // 排名
}
//旧号回归
message OperateGetRegressionRewardC2S
{
  int64 activityId = 1;  // 活动Id
}
//旧号回归
message OperateGetRegressionRewardS2C
{
}
//毕业礼
message OperateGetGraduationGiftRewardC2S
{
  int64 activityId = 1;  // 活动Id
}
//毕业礼
message OperateGetGraduationGiftRewardS2C
{
}
//充值返利
message OperateGetPaymentRefundRewardC2S
{
  int64 activityId = 1;  // 活动Id
}
//充值返利
message OperateGetPaymentRefundRewardS2C
{
}

//任务宝箱进度奖励
message OperateGetTaskBoxRewardC2S
{
  int64 activityId = 1;  // 活动Id
}
//任务宝箱进度奖励
message OperateGetTaskBoxRewardS2C
{
  int64 activityId = 1;  // 活动Id
  int32 score = 2; // 当前积分
  map<int32,bool> rewardFlag = 3; // 已经领取奖励标记
}
//任务宝箱进度更新
message OperateGetTaskBoxScoreUpdateS2C
{
  int64 activityId = 1;  // 活动Id
  int32 score = 2; // 当前积分
}
//领取首次充值奖励
message OperateGetFirstPayRewardC2S
{
}
//领取首次充值奖励
message OperateGetFirstPayRewardS2C
{
}
//签到领奖
message OperateSignNewGetRewardC2S
{
  int64 activityId = 1;  // 活动Id
}
//签到领奖
message OperateSignNewGetRewardS2C
{
  int64 activityId = 1;  // 活动Id
}
//连锁礼包内购
message OperateChainGiftBuyItemC2S
{
  int64 activityId = 1;  // 活动Id
  int32 id = 2; // 礼包id
}
//连锁礼包内购
message OperateChainGiftBuyItemS2C
{
}
//兑换商店
message OperateExchangeShopBuyItemC2S
{
  int64 activityId = 1;  // 活动Id
  int32 id = 2; // 礼包id
  int32 num = 3; // 数量
}
//兑换商店
message OperateExchangeShopBuyItemS2C
{
}

// 更新运营活动配置
message OperateUpdateConfigS2C
{
    OperateActivity config = 1; // 活动配置信息
}
// 好友邀请-获取自己的邀请码（含申请绑定页主面板）
message OperateInviteGetCodeC2S
{
    int64 activityId = 1; // 活动Id
}
// 好友邀请-获取自己的邀请码 应答；详细进度通过 OperateUpdateS2C 推送
message OperateInviteGetCodeS2C
{
    int64 activityId = 1; // 活动Id
    string inviteCode = 2; // 自己的邀请码（10位 Crockford Base32）
}

// 好友邀请-提交邀请码绑定
message OperateInviteBindCodeC2S
{
    int64 activityId = 1; // 活动Id
    string inviteCode = 2; // 输入的 10 位邀请码
}
// 好友邀请-提交邀请码绑定 应答
message OperateInviteBindCodeS2C
{
    int64 activityId = 1; // 活动Id
}

// 好友邀请-领取邀请任务奖励 [V2 已废弃] 改用通用 TaskGetRewardC2S
message OperateInviteClaimTaskC2S
{
    option deprecated = true;
    int64 activityId = 1; // 活动Id
    int32 taskId     = 2; // 任务Id（对应 InviteActivityTask.csv 行Id）
}
// 好友邀请-领取邀请任务奖励 应答 [V2 已废弃]
message OperateInviteClaimTaskS2C
{
    option deprecated = true;
    int64 activityId = 1; // 活动Id
    int32 taskId     = 2; // 任务Id
}

// 好友邀请-领取充值档位奖励 [V2 已废弃] 改用通用 TaskGetRewardC2S
message OperateInviteClaimRechargeC2S
{
    option deprecated = true;
    int64 activityId = 1; // 活动Id
    int32 tierId     = 2; // 充值档位Id（对应 InviteActivityRechargeTask.csv 行Id）
}
// 好友邀请-领取充值档位奖励 应答 [V2 已废弃]
message OperateInviteClaimRechargeS2C
{
    option deprecated = true;
    int64 activityId = 1; // 活动Id
    int32 tierId     = 2; // 充值档位Id
}

// 好友邀请-领取终极奖励
message OperateInviteClaimFinalC2S
{
    int64 activityId = 1; // 活动Id
}
// 好友邀请-领取终极奖励 应答
message OperateInviteClaimFinalS2C
{
    int64 activityId = 1; // 活动Id
}

// 好友邀请-上报首次分享
message OperateInviteFirstShareC2S
{
    int64 activityId = 1; // 活动Id
}
// 好友邀请-上报首次分享 应答
message OperateInviteFirstShareS2C
{
    int64 activityId = 1; // 活动Id
}
