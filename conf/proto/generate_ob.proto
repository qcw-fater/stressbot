syntax            = "proto3";
option go_package = ".;pb";
package Game;

import "custom_ob.proto";

// 观战列表
message ObBattleListC2S {
    int32 battleModeId = 1;
}
// 观战列表
message ObBattleListS2C {
    repeated ObBattleClient list = 1;
    int32 battleModeId           = 2;
    map<int32, int64> heatHero   = 3;  // 英雄热度 heroId->热度(×1000)，筛选UI展示（读L0快照，零额外Redis）
    map<int32, int64> heatMode   = 4;  // 玩法热度 battleModeId->热度(×1000)
    map<int32, int64> heatMap    = 5;  // 地图热度 mapId->热度(×1000)
}

// 请求观战房间地址
message ObRoomAddressC2S {
    int64 battleId     = 1;  // 房间ID
    int32 battleModeId = 2;
    bool filterApplied = 3;  // 是否经筛选进入（决定热度增量口径：筛选>普通）
}
// 请求观战房间地址
message ObRoomAddressS2C {
    int64 battleId     = 1;  // 房间ID
    int32 battleModeId = 2;  // 战斗模式
    int64 session      = 3;  // 进入观战服务器session
    string address     = 4;  // 观战服务器地址
    int32 sid          = 5;  // 观战服务器Id
}

