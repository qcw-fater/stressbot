syntax            = "proto3";
option go_package = ".;pb";
package Game;

import "custom_ob.proto";

// 观战列表
message ObBattleListC2S {
    int32 battleModeId = 1;
}
// 观战列表
message ObBattleListS2C {
    repeated ObBattleClient list = 1;
    int32 battleModeId           = 2;
}

// 请求观战房间地址
message ObRoomAddressC2S {
    int64 battleId     = 1;  // 房间ID
    int32 battleModeId = 2;
}
// 请求观战房间地址
message ObRoomAddressS2C {
    int64 battleId     = 1;  // 房间ID
    int32 battleModeId = 2;  // 战斗模式
    int64 session      = 3;  // 进入观战服务器session
    string address     = 4;  // 观战服务器地址
    int32 sid          = 5;  // 观战服务器Id
}

