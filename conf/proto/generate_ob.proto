// 加载观战房间初始数据
message ObEnterRoomC2S {
    int32 playerId         = 1;
    int64 battleId         = 2;  // 房间ID
    int64 session          = 3;  // 进入观战服务器session
    int32 spectateStartMode = 4; // 起点模式 0=从头 1=从最新（配置 SpectatorParameter ID=29）
    int32 lastFrameIndex   = 5;  // 断线重连续传：客户端本地已收到的最后帧索引；首次进房传 -1（从头）
}
// 加载观战房间初始数据
message ObEnterRoomS2C {
    //    ObBattleInfoBase base = 1;
}

// 推送观战房间帧数据
message ObPutRoomFrameDataS2C {
    repeated bytes frames = 1;  // 帧数据
}

// 发送弹幕聊天
message ObSendBulletChatC2S {
    string msg      = 1;  // 聊天信息
    int64 timestamp = 2;  // 时间戳
}
// 发送弹幕聊天
message ObSendBulletChatS2C {
    string msg      = 1;  // 聊天信息
    int64 timestamp = 2;  // 时间戳
}

// 开始加载
message ObBeginLoadingS2C {
    int32 maxFrame        = 1;  // 最大帧索引
    ObBattleInfoBase data = 2;
}
// 心跳
message ObPlayerTimeC2S {
}
// 心跳  字节流 little-endian | int64 |
message ObPlayerTimeS2C {
}

// 开始同步弹幕聊天
message ObBeginSyncBulletChatC2S {
    int64 beginTimestamp = 1;  // 弹幕同步起始时间
}
// 同步弹幕聊天（房间弹幕列表）
message ObSyncBulletChatListS2C {
    repeated BulletInfoMap list = 1;  // 房间弹幕列表
    int64 beginTimestamp        = 2;  // 弹幕同步起始时间
}
// 请求好友战斗详细信息
message ObFriendBattleListC2S {
}
// 请求好友战斗详细信息
message ObFriendBattleListS2C {
    repeated FriendBattleInfo infos = 1;
}
// 请求好友观战房间地址
message ObFriendRoomAddressC2S {
    int64 battleId = 1;  // 房间ID
    int32 friendId = 2;  // 好友Id
}
// 请求好友观战房间地址
message ObFriendRoomAddressS2C {
    int64 battleId = 1;  // 房间ID
    int32 friendId = 2;  // 好友Id
    int64 session  = 3;  // 进入观战服务器session
    string address = 4;  // 观战服务器地址
    int32 sid      = 5;  // 观战服务器Id
}
// 请求好友观战房间地址
message ObFriendRoomC2S {
}
// 请求好友观战房间地址
message ObFriendRoomS2C {
}
//巅峰回放榜列表
message ObReplayListC2S
{
    int32 battleModeId = 1;  // 玩法筛选，0=全部
}
//巅峰回放榜列表
message ObReplayListS2C
{
    repeated ObReplayInfo list = 1;  // 巅峰回放列表
    int32 battleModeId         = 2;  // 玩法筛选回显
}
//我的录像列表
message ObMyRecordListC2S
{
}
//我的录像列表
message ObMyRecordListS2C
{
    repeated ObReplayInfo list = 1;  // 我的录像列表
    int32 saveCountLeft        = 2;  // 剩余可保存数量
}
//我的收藏列表
message ObCollectListC2S
{
}
//我的收藏列表
message ObCollectListS2C
{
    repeated ObReplayInfo list = 1;  // 我的收藏列表
    int32 collectCountLeft     = 2;  // 剩余可收藏数量
}
//收藏/取消收藏录像
message ObCollectC2S
{
    int64 battleId = 1;  // 录像（对战）ID
    bool collect   = 2;  // true=收藏 false=取消收藏
}
//收藏/取消收藏录像
message ObCollectS2C
{
    int64 battleId         = 1;  // 录像（对战）ID
    bool collect           = 2;  // 当前收藏状态
    int32 collectCountLeft = 3;  // 剩余可收藏数量
}
//保存录像
message ObSaveRecordC2S
{
    int64 battleId = 1;  // 对战ID
}
//保存录像
message ObSaveRecordS2C
{
    int64 battleId      = 1;  // 对战ID
    int32 saveCountLeft = 2;  // 剩余可保存数量
}
//删除录像
message ObDelRecordC2S
{
    int64 battleId = 1;  // 对战ID
}
//删除录像
message ObDelRecordS2C
{
    int64 battleId      = 1;  // 对战ID
    int32 saveCountLeft = 2;  // 剩余可保存数量
}
