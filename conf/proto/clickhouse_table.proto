// SDC段位赛季重置结果
message ch_sdc_season_reset_result_log {
    Common     common         = 1;  // 公共字段
    RoleCommon roleCommon     = 2;  // 角色公共字段
    int64      uuid           = 3;  // 日志ID
    int64      writeTime      = 4;  // 写入时间
    string     version        = 5;  // 版本
    int32      oldSeasonId    = 6;  // 旧赛季ID
    int32      newSeasonId    = 7;  // 新赛季ID
    int32      playerId       = 8;  // 玩家ID
    int32      oldFinalRank   = 9;  // 旧赛季最终段位
    int32      oldFinalScore  = 10; // 旧赛季最终排位分
    int32      oldHighestRank = 11; // 旧赛季最高段位
    int32      newRank        = 12; // 新赛季初始段位
    int32      newScore       = 13; // 新赛季初始排位分
}
message ch_squad_log {
    // PRIMARY KEY:team_id,logType
    int64        uuid           = 1;  // 日志ID 必填 Hidden
    int64        writeTime      = 2;  // 日志记录时间 必填 DateTime
    string       version        = 3;  // 版本号 必填
    Common       common         = 4;  // 公共字段
    RoleCommon   roleCommon     = 5;  // 角色公共字段
    LcxSdkCommon sdkCommon      = 6;  // LCX的SDK公共字段
    int32        logType        = 7;  // 事件类型:1创建 2申请加入 3加入成功 4退出踢出解散 5签到 6任务领奖 7称号设置 8报名换区 9对战产分 10场次领奖 11排名奖励 12积分领奖 13点赞
    int64        team_id        = 8;  // 小队id
    int32        player_id      = 9;  // 主体玩家id(操作者/产分者/领奖者)
    int32        target_id      = 10; // 目标玩家id(创建者/新队长/被踢者)
    int32        sub_type       = 11; // 子类型:加入来源(1申请2邀请)/退出类型(1退出2踢出3解散)/报名动作(1报名2换区)/对战结果(1胜2负)/排名类型(1赛区2全服)/积分类型(1个人2小队)
    int32        task_id        = 12; // 任务id(任务领奖)
    int32        title_id       = 13; // 称号id(称号设置)
    int32        battle_zone_id = 14; // 赛区id(报名)
    int32        score          = 15; // 积分(对战产分本场所得)
    int32        session_count  = 16; // 累计场次(场次领奖)
    int32        rank           = 17; // 最终排名(排名奖励)
    int64        target_team_id = 18; // 被点赞小队id(点赞)
    int32        result         = 19; // BattleResultType结算结果:1胜2负3平
}

// 玩家个性化资源获得日志(头像/头像框/背景/称号/表情/英雄动作/战斗播报板皮肤)
message ch_player_individuation_log {
    // PRIMARY KEY:role_id,individuation_type,config_id
    int64        uuid                  = 1;  // 日志ID 必填 Hidden
    int64        writeTime             = 2;  // 日志记录时间 必填 DateTime
    string       version               = 3;  // 版本号 必填
    Common       common                = 4;  // 公共字段
    RoleCommon   roleCommon            = 5;  // 角色公共字段
    LcxSdkCommon sdkCommon             = 6;  // LCX的SDK公共字段
    int32        individuation_type    = 7;  // 个性化类型:1头像 2头像框 3背景 4称号 5表情 6英雄动作 7战斗播报板皮肤
    int32        config_id             = 8;  // 个性化配置ID
    int32        is_have               = 9;  // 是否永久获得:1永久 0临时体验
    int64        start_experience_time = 10; // 体验开始时间戳(秒)
    int64        end_experience_time   = 11; // 体验结束时间戳(秒)
    string       reason                = 12; // 一级原因
    string       sub_reason            = 13; // 二级原因
}
