    int64          tcpPostponeWriteOn    = 15; // tcp延迟写次数
    int64          udpConnectCount       = 16; // udp连接创建个数
    int64          udpReadCount          = 17; // udp读取次数
    int64          udpMaxReadMMsgPackets = 18; // udp最大读取消息包数
    int64          udpAvgReadMMsgPackets = 19; // udp平均读取消息包数
    int64          udpReadFails          = 20; // udp读取失败次数
    int64          udpSendCount          = 21; // udp发送次数
    int64          udpMaxSendMMsgPackets = 22; // udp最大发送消息包数
    int64          udpAvgSendMMsgPackets = 23; // udp平均发送消息包数
    int64          udpSendFails          = 24; // udp发送失败次数
    int64          udpReadRate1          = 25; // udp读取速率
    int64          udpSendRate1          = 26; // udp发送速率
    int64          udpUnboundedChSize    = 27; // udp无限缓冲区大小
    int64          udpUnboundedBuffCount = 28; // udp无限缓冲区缓存大小
    int64          udpEagainCount        = 29; // udpEAGAIN次数
    int64          udpMaxReadPacketBytes = 30; // udp最大读取数据包大小
    int64          udpMaxSendPacketBytes = 31; // udp最大发送数据包大小
    int64          udpAvgReadPacketBytes = 32; // udp平均读取数据包大小
    int64          udpAvgSendPacketBytes = 33; // udp平均发送数据包大小
    int64          udpReadEmptyCount     = 34; // udp读取数据为空的次数
    int64          udpProcessMsgMaxTime  = 35; // 消息处理最大耗时(微秒)
    int64          udpProcessMsgAvgTime  = 36; // UDP消息处理平均耗时(微秒)
    int64          udpProcessMsgTime99PT = 37; // UDP消息处理百分之99耗时(微秒)
    repeated int32 udpProcessorChanSize  = 38; // udp处理器chan大小
    int64          epollWait             = 39; // epoll_wait返回的次数
    int64          epollNoWait           = 40; // msc=0时epoll_wait调用的次数
    int64          epollEvents           = 41; // epoll事件总数
    int64          taskAssigned          = 42; // 任务执行次数
    int32          workPoolRunning       = 43; // 正在运行的工作线程的数量
    string         serverName            = 44; // 服务器名称
    string         serverType            = 45; // 服务器类型
}

