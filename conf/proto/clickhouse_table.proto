message ch_player_logic_main_log {
    // PRIMARY KEY:role_id
    int64                      uuid                   = 1;  // 日志ID 必填 Hidden
    string                     writeTime              = 2;  // 日志记录时间必填 DateTime
    string                     version                = 3;  // 版本号
