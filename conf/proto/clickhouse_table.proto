    int32        job_id                = 20; // 职业id
    int32        settlement_type       = 21; // 结算类型
    string       result                = 22; // 结果
    string       reason                = 23; // 原因
    bool         hero_title_changed    = 24; // 英雄最高称号是否变化
    int32        old_lbs_id            = 25; // 旧LbsId
    int32        old_rank              = 26; // 旧排名
    int32        old_rank_level        = 27; // 旧称号等级
    int32        server_id             = 28; // 服务器id
    int32        err_code              = 29; // 错误码
    int32        rank_level            = 30; // 当前称号等级
    string       old_title_key         = 31; // 旧称号key
    int32        title_index           = 32; // 称号槽位
    int32        ladder_level          = 33; // 本局开始时排位段位(LadderLevel)
