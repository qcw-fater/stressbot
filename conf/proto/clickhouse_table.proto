// SDC段位排位分变化
message ch_sdc_rank_score_change_log {
    Common     common             = 1;  // 公共字段
    RoleCommon roleCommon         = 2;  // 角色公共字段
    int64      uuid               = 3;  // 日志ID
    int64      writeTime          = 4;  // 写入时间
    string     version            = 5;  // 版本
    int32      seasonId           = 6;  // 赛季ID
    int32      playerId           = 7;  // 玩家ID
    int64      matchId            = 8;  // 对局ID
    string     changeReason       = 9;  // 变化原因
    int32      scoreBefore        = 10; // 排位分(前)
    int32      scoreChange        = 11; // 排位分变化
    int32      scoreAfter         = 12; // 排位分(后)
    int32      rankBefore         = 13; // 段位(前)
    int32      rankAfter          = 14; // 段位(后)
    int32      protectType        = 15; // 保护类型
    int32      protectCountBefore = 16; // 保护次数(前)
    int32      protectCountAfter  = 17; // 保护次数(后)
}

// SDC段位段位变化
message ch_sdc_rank_level_change_log {
    Common     common      = 1;  // 公共字段
    RoleCommon roleCommon  = 2;  // 角色公共字段
    int64      uuid        = 3;  // 日志ID
    int64      writeTime   = 4;  // 写入时间
    string     version     = 5;  // 版本
    int32      seasonId    = 6;  // 赛季ID
    int32      playerId    = 7;  // 玩家ID
    string     changeType  = 8;  // 变化类型(promote/demote/inherit)
    int32      rankBefore  = 9;  // 段位(前)
    int32      rankAfter   = 10; // 段位(后)
    int32      scoreBefore = 11; // 排位分(前)
    int32      scoreAfter  = 12; // 排位分(后)
    int32      starBefore  = 13; // 星级(前)
    int32      starAfter   = 14; // 星级(后)
}

// SDC段位保护触发
message ch_sdc_rank_protection_trigger_log {
    Common     common             = 1;  // 公共字段
    RoleCommon roleCommon         = 2;  // 角色公共字段
    int64      uuid               = 3;  // 日志ID
    int64      writeTime          = 4;  // 写入时间
    string     version            = 5;  // 版本
    int32      seasonId           = 6;  // 赛季ID
    int32      playerId           = 7;  // 玩家ID
    int32      protectionType     = 8;  // 保护类型(1新手保护/2大段位保护)
    int32      rankId             = 9;  // 段位ID
    int32      scoreBefore        = 10; // 排位分(前)
    int32      scoreAfter         = 11; // 排位分(后)
    int32      protectCountBefore = 12; // 保护次数(前)
    int32      protectCountAfter  = 13; // 保护次数(后)
    int64      matchId            = 14; // 对局ID
}

// SDC段位赛季奖励领取
message ch_sdc_season_rank_reward_claim_log {
    Common     common         = 1;  // 公共字段
    RoleCommon roleCommon     = 2;  // 角色公共字段
    int64      uuid           = 3;  // 日志ID
    int64      writeTime      = 4;  // 写入时间
    string     version        = 5;  // 版本
    int32      seasonId       = 6;  // 赛季ID
    int32      playerId       = 7;  // 玩家ID
    int32      rewardConfigId = 8;  // 奖励配置ID
    int32      requireRankId  = 9;  // 需要段位ID
    int32      currentRankId  = 10; // 当前段位ID
    int32      highestRankId  = 11; // 最高段位ID
    string     reward         = 12; // 奖励内容
    int32      isBigReward    = 13; // 是否大奖(0否/1是)
    string     claimResult    = 14; // 领取结果(success/already_claimed/not_qualified)
