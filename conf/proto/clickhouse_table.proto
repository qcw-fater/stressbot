// SDC结算审计日志
message ch_player_sdc_settle_audit_log {
    // PRIMARY KEY:role_id,battle_id
    int64      uuid                  = 1;  // 日志ID 必填 Hidden
    int64      writeTime             = 2;  // 日志记录时间 必填 DateTime
    string     version               = 3;  // 版本号 必填
    Common     common                = 4;  // 公共字段
    RoleCommon roleCommon            = 5;  // 角色公共字段
    int64      battle_id             = 6;  // 战斗ID
    int64      room_id               = 7;  // 房间ID
    int32      result_type           = 8;  // 结算结果
    string     validation_result     = 9;  // pass/rejected/unknown_end/compensated
    string     reject_reason         = 10; // 拒绝原因
    int32      loot_value_reported   = 11; // 客户端上报lootValue
    int32      loot_value_server     = 12; // 服务器重算lootValue
    int32      rating_reported       = 13; // 客户端上报评级
    int32      rating_server         = 14; // 服务器重算评级
    int32      settle_value_cap      = 15; // 结算价值上限
    int32      settle_value_actual   = 16; // 结算实际价值
    int32      lost_item_count       = 17; // 丢失道具数
    int32      kept_item_count       = 18; // 保留道具数
    int32      final_pack_item_count = 19; // 藏品背包道具数
    int32      final_equip_count     = 20; // 装配槽位数
    string     raw_settle_data       = 21; // 异常时原始结算数据base64
    string     before_snapshot       = 22; // 异常时结算前快照base64
    string     after_snapshot        = 23; // 异常时结算后快照base64
    string     field_warnings        = 24; // 字段阈值告警信息
    int32      collection_destroyed  = 25; // 藏品销毁数量
    int32      settle_duration_ms    = 26; // 结算耗时（毫秒）
    int32      sdc_level             = 27; // 结算时玩家SDC等级
}

// SDC战备操作日志
message ch_player_sdc_prepare_log {
    // PRIMARY KEY:role_id,log_type
    int64      uuid                  = 1;  // 日志ID Hidden
    int64      writeTime             = 2;  // 日志记录时间 DateTime
    string     version               = 3;  // 版本号
    Common     common                = 4;  // 公共字段
    RoleCommon roleCommon            = 5;  // 角色公共字段
    int32      log_type              = 6;  // 操作类型: 1=装配 2=卸下 3=移动 4=出售 5=批量出售 6=使用藏品 7=设置补齐队友
    int32      result                = 7;  // 操作结果: 0=失败 1=成功
    string     error_code            = 8;  // 失败时的错误码
    int32      sdc_level             = 9;  // SDC等级
    int32      total_equip_value     = 10; // 操作后总装配价值
    int32      item_count            = 11; // 仓库道具总数
    int32      slot_type             = 12; // 槽位类型
    int64      item_guid             = 13; // 操作道具GUID
    int32      item_id               = 14; // 道具配置ID
    int32      from_pack_type        = 15; // 来源: 0=仓库 1-5=背包 -1=装配槽
    int32      to_pack_type          = 16; // 目标: 0=仓库 1-5=背包
    int32      sell_count            = 17; // 出售数量
    int32      sell_value            = 18; // 出售获得总价值
    int32      money_type            = 19; // 货币类型
    int32      batch_total           = 20; // 批量出售请求总数
    int32      batch_success         = 21; // 批量出售成功数
    int32      use_number            = 22; // 使用数量
    int32      hero_id               = 23; // 关联英雄ID
    int32      fill_teammate         = 24; // 补齐队友选项(0=关 1=开)
    string     equip_item_guids_json = 25; // 装配槽道具GUID列表（JSON数组）
    string     pack_item_guids_json  = 26; // 背包道具GUID列表（JSON数组）
    int32      skill_pack_value      = 27; // 技能背包总价值
}

// SDC掉落数据日志
message ch_player_sdc_drop_log {
    // PRIMARY KEY: battle_id, room_id
    int64  uuid                     = 1;  // 日志ID 必填 Hidden
    int64  writeTime                = 2;  // 日志记录时间 必填 DateTime
    string version                  = 3;  // 版本号 必填
    Common common                   = 4;  // 公共字段（仅使用 day + record_time，不含 RoleCommon，本表为房间维度）
    int64  battle_id                = 5;  // 战斗ID
    int64  room_id                  = 6;  // 房间ID
    int32  mode_id                  = 7;  // 游戏模式ID
    int32  difficulty_level         = 8;  // 难度等级
    int32  config_id                = 9;  // SDCResourceAreaConfig 配置ID
    int32  total_budget             = 10; // 本局总价值预算
    int32  area_count               = 11; // 区域数量
    int32  task_group_count         = 12; // 任务奖励组数量
    int32  total_chest_count        = 13; // 宝笱总数
    int32  total_item_count         = 14; // 掉落物品总数
    string drop_item_guids_json     = 15; // 所有掉落物GUID列表（JSON数组）
    string drop_items_detail_json   = 16; // 掉落物详情（JSON数组[{guid,itemId,value}...]）
    bool   is_drop_data_nil         = 17; // SDCDropData是否为nil（UInt8）
    bool   config_missing           = 18; // 配置是否缺失（UInt8）
    bool   area_groups_empty        = 19; // AreaGroups是否为空（UInt8）
    bool   task_groups_empty        = 20; // TaskGroups是否为空（UInt8）
    int32  remaining_budget         = 21; // 剩余预算
    bool   fallback_triggered       = 22; // 是否触发山底（UInt8）
    int32  empty_chest_count        = 23; // 空宝笱数量
    int32  config_parse_error_count = 24; // 配置解析错误数
    string warning_messages         = 25; // 告警消息
    int32  generation_duration_ms   = 26; // 生成耗时
    int32  area_generation_ms       = 27; // 区域生成耗时
    int32  task_generation_ms       = 28; // 任务生成耗时
    int32  iterations_count         = 29; // 迭代次数
    string snapshot_raw_drop_data   = 30; // 原始数据快照(base64，仅异常时)
    string generation_phase         = 31; // "startLoading" / "notifyBattleServer"
}

// SDC战斗上报日志
message ch_player_sdc_battle_report_log {
    // PRIMARY KEY: role_id, battle_id
    int64      uuid                            = 1;  // 日志ID 必填 Hidden
    int64      writeTime                       = 2;  // 日志记录时间 必填 DateTime
    string     version                         = 3;  // 版本号 必填
    Common     common                          = 4;  // 公共字段
    RoleCommon roleCommon                      = 5;  // 角色公共字段
    int64      battle_id                       = 6;  // 战斗ID
    int64      room_id                         = 7;  // 房间ID
    string     battle_version                  = 8;  // 战斗版本
    int32      game_model                      = 9;  // 游戏模式
    int32      game_type                       = 10; // 玩法类型
    int32      mode_id                         = 11; // 模式ID
    int64      begin_time                      = 12; // 战斗开始时间戳
    int64      end_time                        = 13; // 战斗结束时间戳
    int32      settlement_reason               = 14; // 结算原因
    int32      client_result                   = 15; // 客户端上报结果
    int32      server_result                   = 16; // 服务器判定结果
    string     result_md5                      = 17; // MD5校验值
    int32      loot_value_reported             = 18; // 客户端上报收益价值
    int32      total_value_reported            = 19; // 客户端上报装配总价值
    int32      rating_reported                 = 20; // 客户端上报评级
    int32      lost_item_count                 = 21; // 丢失道具数
    int32      kept_item_count                 = 22; // 保留道具数
    int32      final_pack_slots_count          = 23; // 背包数量
    int32      final_pack_items_total          = 24; // 背包内总道具数
    int32      final_pack_total_value          = 25; // 背包内总价值
    string     final_pack_slots_details_json   = 26; // 各背包类型详情摘要(JSON)
    int32      final_equip_slots_count         = 27; // 装配槽位数
    int32      final_equip_total_value_derived = 28; // 装配总价值
    string     final_equip_slots_details_json  = 29; // 各槽位详情摘要(JSON)
    bool       sdc_drop_data_nil               = 30; // SDCDropData是否为nil（UInt8）
    int32      drop_total_budget               = 31; // 本局总价值预算
    int32      drop_area_groups_count          = 32; // 区域掉落组数
    int32      drop_task_groups_count          = 33; // 任务奖励组数
    int32      drop_total_items_count          = 34; // 掉落总道具数
    string     drop_registry_legality          = 35; // 掉落注册表合法性摘要
    string     legal_item_guids_json           = 36; // 合法道具注册表完整GUID列表
    int32      kill_count                      = 37; // 击杀玩家数
    int32      monster_kill_count              = 38; // 击杀怪物数
    int32      assist_count                    = 39; // 助攻数
    int32      rescue_count                    = 40; // 救助数
    int32      survive_time                    = 41; // 存活时长(秒)
    int32      sdc_level_reported              = 42; // 客户端上报SDC等级
    int32      sdc_exp_reported                = 43; // 客户端上报当前经验
    int32      sdc_exp_max_reported            = 44; // 客户端上报经验上限
    int32      sdc_exp_change_reported         = 45; // 客户端上报本局获得经验
    int32      ping_quality                    = 46; // 画面品质
    string     device_resolution               = 47; // 设备分辨率
    int32      resolution_level                = 48; // 分辨率档位
    int32      target_fps                      = 49; // 目标帧数
    int32      cpu_count                       = 50; // CPU个数
    int32      gpu_count                       = 51; // GPU个数
    int32      memory_size                     = 52; // 内存大小
    string     lost_item_guids_list_json       = 53; // 丢失GUID列表(JSON数组)
    string     kept_item_guids_list_json       = 54; // 保留GUID列表(JSON数组)
    string     result_md5_match_status         = 55; // MD5校验状态
    string     data_integrity_warning          = 56; // 数据完整性告警
    string     raw_sdc_settle_data             = 57; // 原始结算数据(base64，仅异常时)
    string     cross_validation_notes          = 58; // 与Logic端对比备注
}

// SDC异常恢复日志
message ch_player_sdc_recovery_log {
    // PRIMARY KEY: role_id, battle_id
    int64      uuid                          = 1;  // 日志ID 必填 Hidden
    int64      writeTime                     = 2;  // 日志记录时间 必填 DateTime
    string     version                       = 3;  // 版本号 必填
    Common     common                        = 4;  // 公共字段
    RoleCommon roleCommon                    = 5;  // 角色公共字段
    int64      battle_id                     = 6;  // 战斗ID
    int64      room_id                       = 7;  // 房间ID
    int32      be_reason                     = 8;  // 战斗结束原因枚举值
    string     be_reason_name                = 9;  // 战斗结束原因文本

    string     recovery_type                 = 10; // snapshot_restored / compensation_downgrade / timeout_recovery
    string     trigger_stage                 = 11; // normal_path / login_compensation / timeout_triggered
    int32      is_downgrade                  = 12; // 是否降级处理
    string     downgrade_reason              = 13; // 降级原因
    int64      frozen_at                     = 14; // 快照冻结时间戳
    int64      recovered_at                  = 15; // 快照恢复时间戳
    int32      recovery_duration_ms          = 16; // 恢复耗时(毫秒)
    int64      battle_end_result_at          = 17; // 战斗结果记录时间戳
    int32      sdc_level_before              = 18; // 快照中SDC等级
    int32      sdc_exp_before                = 19; // 快照中SDC经验
    int32      warehouse_level_before        = 20; // 快照中仓库等级
    int32      warehouse_max_slots_before    = 21; // 快照中仓库最大格子数
    int32      warehouse_used_slots_before   = 22; // 快照中仓库已用格子数
    int32      warehouse_total_value_before  = 23; // 快照中仓库总价值
    int32      warehouse_item_count_before   = 24; // 快照中仓库道具总数
    string     warehouse_item_guids_lost     = 25; // 恢复过程中丢失的道具GUID列表(JSON)
    int32      equip_slot_count_before       = 26; // 快照中装配槽位数
    string     equip_item_guids_before       = 27; // 恢复前装配道具GUID列表(JSON数组)
    int32      pack_slot_count_before        = 28; // 快照中背包组数
    string     pack_item_guids_before        = 29; // 恢复前背包道具GUID列表(JSON数组)
    int32      prepare_total_value_before    = 30; // 快照中装配总价值
    int32      prepare_hero_id_before        = 31; // 快照中英雄ID
    int32      collection_count_before       = 32; // 快照中藏品总数
    int32      collection_total_value_before = 33; // 快照中藏品总价值

    int32      season_id_before              = 34; // 快照中赛季ID
    int32      season_tier_before            = 35; // 快照中段位
    int32      season_tier_star_before       = 36; // 快照中段位星数
    int32      season_coin_before            = 37; // 快照中赛季币
    int32      restore_success               = 38; // 恢复是否成功
    string     restore_error_msg             = 39; // 恢复失败错误信息
    int32      redis_persist_success         = 40; // Redis持久化是否成功
    string     persist_error_msg             = 41; // 持久化失败错误信息
    int32      warehouse_item_count_after    = 42; // 恢复后仓库道具数
    int32      warehouse_used_slots_after    = 43; // 恢复后仓库已用格子数
    int32      warehouse_total_value_after   = 44; // 恢复后仓库总价值
    int32      equip_slot_count_after        = 45; // 恢复后装配槽位数
    int32      collection_count_after        = 46; // 恢复后藏品总数
    string     frozen_lock_status            = 47; // 冻结锁状态
    int32      idempotent_lock_checked       = 48; // 是否检查过幂等锁
    int32      idempotent_lock_exists        = 49; // 幂等锁是否存在
    int64      snapshot_frozen_battleid      = 50; // 快照中记录的battleId
    int32      snapshot_battle_end_result    = 51; // 快照中的battleEndResult值
    string     before_snapshot_base64        = 52; // 恢复前快照数据base64(仅异常时)
    string     offline_result_status         = 53; // 离线结算数据状态
    string     recovery_path_detail          = 54; // 恢复路径详细信息(JSON)
}

// 赛季结算触发（排位）
message ch_player_season_settlement_log {
    // PRIMARY KEY: season_id
    int64        uuid          = 1; // 日志ID 必填 Hidden
    int64        writeTime     = 2; // 日志记录时间 必填 DateTime
    string       version       = 3; // 版本号       必填
    Common       common        = 4; // 公共字段
    RoleCommon   roleCommon    = 5; // 角色公共字段
    LcxSdkCommon sdkCommon     = 6; // LCX的SDK公共字段
    int32        season_id     = 7; // 赛季ID
    int32        highest_rank  = 8; // 当赛季最高段位
    int32        actual_rank   = 9; // 赛季结束实际段位
}

// 赛季奖励邮件补发
message ch_player_season_reward_mail_log {
    // PRIMARY KEY: season_id
    int64                    uuid          = 1; // 日志ID 必填 Hidden
    int64                    writeTime     = 2; // 日志记录时间 必填 DateTime
    string                   version       = 3; // 版本号       必填
    Common                   common        = 4; // 公共字段
    RoleCommon               roleCommon    = 5; // 角色公共字段
    LcxSdkCommon             sdkCommon     = 6; // LCX的SDK公共字段
    int32                    season_id     = 7; // 赛季ID
    int32                    season_type   = 8; // 赛季类型 1:排位 2:漫斗
    repeated LogResourceInfo resourceInfo  = 9; // 未领取奖励列表（item_id + diff 字段有效）
}

// 漫斗赛赛季结算触发
message ch_player_mandou_season_settlement_log {
    // PRIMARY KEY: season_id
    int64        uuid              = 1; // 日志ID 必填 Hidden
    int64        writeTime         = 2; // 日志记录时间 必填 DateTime
    string       version           = 3; // 版本号       必填
    Common       common            = 4; // 公共字段
    RoleCommon   roleCommon        = 5; // 角色公共字段
    LcxSdkCommon sdkCommon         = 6; // LCX的SDK公共字段
    int32        season_id         = 7; // 赛季ID
    int32        mandou_rank       = 8; // 结算前漫斗赛段位
    int32        new_mandou_rank   = 9; // 重置后新段位
}

// 惊喜宝箱开箱日志
message ch_surprise_box_log {
    // PRIMARY KEY: role_id,origin_box_id
    int64        uuid                = 1;  // 日志ID 必填 Hidden
    int64        writeTime           = 2;  // 日志记录时间 必填 DateTime
    string       version             = 3;  // 版本号 必填
    Common       common              = 4;  // 公共字段
    RoleCommon   roleCommon          = 5;  // 角色公共字段
    LcxSdkCommon sdkCommon           = 6;  // LCX的SDK公共字段
    int32        origin_box_id       = 7;  // 原始宝箱ID（月卡升级前）
    int32        effective_box_id    = 8;  // 最终抽奖使用的宝箱ID（含月卡升级+时间段切换）
    int32        card_type           = 9;  // 升级卡种：0=无 1=月卡 2=终身卡（复用MonthCardPrivilegeType枚举）
    int32        is_time_slot_switch = 10; // 是否被时间段切换 0=否 1=是
    int32        rand_quality        = 11; // 命中品质位（1~6）
    int32        drop_id             = 12; // 命中掉落ID
    string       reward_brief        = 13; // 奖励摘要 格式: itemId:num,itemId:num
    int32        is_crit             = 14; // 是否有暴击 0=否 1=是
    string       reason              = 15; // 一级原因
    string       sub_reason          = 16; // 二级原因
}
// 直购限购拦截日志
message ch_cash_goods_limit_log {
    // PRIMARY KEY:role_id,cashGoodsId,limitType
    int64        uuid         = 1; // 日志ID 必填 Hidden
    int64        writeTime    = 2; // 日志记录时间 必填 DateTime
    string       version      = 3; // 版本号 必填
    Common       common       = 4; // 公共字段
    RoleCommon   roleCommon   = 5; // 角色公共字段
    LcxSdkCommon sdkCommon    = 6; // LCX的SDK公共字段
    string       purchaseId   = 7; // 订单id
    string       cashGoodsId  = 8; // 直购商品id
    int32        limitType    = 9; // 限购类型
}
