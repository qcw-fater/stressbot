// 行为日志监控日志
message ch_action_log_metrics_log {
    int64                     uuid                       = 1;  // 日志ID 必填 Hidden
    string                    writeTime                  = 2;  // 日志记录时间必填 DateTime
    string                    version                    = 3;  // 版本号
    Common                    common                     = 4;  // 公共字段
    int64                     delayCount                 = 5;  // 延迟次数
    int64                     delayMin                   = 6;  // 最小延迟
    int64                     delayMax                   = 7;  // 最大延迟
    int64                     delayMean                  = 8;  // 平均延迟
    int64                     delayStddev                = 9;  // 延迟标准差
    int64                     delayPercentiles50         = 10; // 延迟50%%百分位数
    int64                     delayPercentiles75         = 11; // 延迟75%%百分位数
    int64                     delayPercentiles95         = 12; // 延迟95%%百分位数
    int64                     delayPercentiles99         = 13; // 延迟99%%百分位数
    int64                     channelBack                = 14; // 通道积压
    int64                     dropped                    = 15; // 丢弃数
    int64                     error                      = 16; // 错误数
    int64                     poolHit                    = 17; // 内存池命中
    int64                     poolMiss                   = 18; // 内存池未命中
    int64                     fileIOCount                = 19; // 文件I/O计
    int64                     batchSizeHistCount         = 20; // 批量次数
    int64                     batchSizeHistMin           = 21; // 最小批量
    int64                     batchSizeHistMax           = 22; // 最大批量
    int64                     batchSizeHistMean          = 23; // 平均批量
    int64                     batchSizeHistStddev        = 24; // 批量标准差
    int64                     batchSizeHistPercentiles50 = 25; // 批量50%%百分位数
    int64                     batchSizeHistPercentiles75 = 26; // 批量75%%百分位数
    int64                     batchSizeHistPercentiles95 = 27; // 批量95%%百分位数
    int64                     batchSizeHistPercentiles99 = 28; // 批量99%%百分位数
    int32                     channelCapacity            = 29; // 通道容量
    int32                     channelLength              = 30; // 当前通道长度
    int32                     writerCount                = 31; // 活跃writer数量
    repeated WriterGroupStats writerGroups               = 32; // 每个writer组状态
    int32                     writerGroupCount           = 33; // writer组数量
}

