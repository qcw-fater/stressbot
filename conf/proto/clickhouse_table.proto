// LBS日志：
// 1.LBS定位
// 2.LBS积分变动
// 3.LBS称号获取
// 4.LBS战力衰减
// 5.LBS称号写入缓存
// 6.LBS称号领取写入Hash
// 7.LBS称号佩戴变更
// 8.LBS局内称号设置
message ch_player_lbs_log {
    // PRIMARY KEY:player_id
    int64        uuid                  = 1;  // 日志ID 必填 Hidden
    int64        writeTime             = 2;  // 日志记录时间 必填 DateTime
    string       version               = 3;  // 版本号       必填
    Common       common                = 4;  // 公共字段
    RoleCommon   roleCommon            = 5;  // 角色公共字段
    LcxSdkCommon sdkCommon             = 6;  // LCX的SDK公共字段
    int32        player_id             = 7;  // 玩家玩家id
    int32        lbs_id                = 8;  // 城市id
    int32        lbs_score             = 9;  // lbs当前积分值
    int32        lbs_score_change      = 10; // LBS积分变动
    int32        lbs_title_rank        = 11; // LBS称号排行
    bool         isUse                 = 12; // 是否使用
    int64        getTime               = 13; // 获取时间
    int64        expireTime            = 14; // 失效时间
