    int64  net_err_out                = 15; // 网络发送时的错误数/s
    int64  net_drop_in                = 16; // 网络被丢弃的入站数据包数/s
    int64  net_drop_out               = 17; // 网络丢弃的出站数据包数/s
    int64  net_fifo_in                = 18; // 网络接收时FIFO缓冲区错误的数/s
    int64  net_fifo_out               = 19; // 网络发送时FIFO缓冲区错误的数/s
    int64  disk_user_mb               = 20; // 磁盘已用空间(mb)
    int64  mem_percent                = 21; // 系统内存使用率
    int32  process_fd_number          = 22; // 进程使用的文件描述符的数量
    int32  process_panic_count        = 23; // 进程Panic次数
    int32  process_server_load        = 24; // 进程当前负载
    int32  process_connect_num        = 25; // 进程连接数
    int32  process_go_num             = 26; // 进程协程数量
    int64  process_cpu_percent        = 27; // 进cpu使用率
    int64  process_mem_percent        = 28; // 该进程使用的总RAM的百分比
    int64  process_self_goroutine_num = 29; // 自身创建协程个数
    int64  process_count              = 30; // 在线人数
    int64  hits                       = 31; // 连接池中找到空闲连接的次数
    int64  misses                     = 32; // 连接池中未找到空闲连接的次数
    int64  timeouts                   = 33; // 等待连接超时发生的次数
    int64  waitCount                  = 34; // 连接等待发生的次数
    int64  waitDurationNs             = 35; // 等待连接所花费的总时间（单位：纳秒）
    int64  totalConns                 = 36; // 连接池中的总连接数
    int64  idleConns                  = 37; // 连接池中的空闲连接数
    int64  staleConns                 = 38; // 从连接池中移除的失效（陈旧）连接数
}

