    int64        uuid         = 1; // 日志ID 必填 Hidden
    int64        writeTime    = 2; // 日志记录时间 必填 DateTime
    string       version      = 3; // 版本号       必填
    Common       common       = 4; // 公共字段
    RoleCommon   roleCommon   = 5; // 角色公共字段
    LcxSdkCommon sdkCommon    = 6; // LCX的SDK公共字段
    int32        season_id    = 7; // 赛季ID
    int32        highest_rank = 8; // 当赛季最高段位
    int32        actual_rank  = 9; // 赛季结束实际段位
}

// 赛季奖励邮件补发
message ch_player_season_reward_mail_log {
    // PRIMARY KEY: season_id
    int64                    uuid         = 1; // 日志ID 必填 Hidden
    int64                    writeTime    = 2; // 日志记录时间 必填 DateTime
    string                   version      = 3; // 版本号       必填
    Common                   common       = 4; // 公共字段
    RoleCommon               roleCommon   = 5; // 角色公共字段
    LcxSdkCommon             sdkCommon    = 6; // LCX的SDK公共字段
    int32                    season_id    = 7; // 赛季ID
    int32                    season_type  = 8; // 赛季类型 1:排位 2:漫斗
    repeated LogResourceInfo resourceInfo = 9; // 未领取奖励列表（item_id + diff 字段有效）
}

// 漫斗赛赛季结算触发
message ch_player_mandou_season_settlement_log {
    // PRIMARY KEY: season_id
    int64        uuid            = 1; // 日志ID 必填 Hidden
    int64        writeTime       = 2; // 日志记录时间 必填 DateTime
    string       version         = 3; // 版本号       必填
    Common       common          = 4; // 公共字段
    RoleCommon   roleCommon      = 5; // 角色公共字段
    LcxSdkCommon sdkCommon       = 6; // LCX的SDK公共字段
    int32        season_id       = 7; // 赛季ID
    int32        mandou_rank     = 8; // 结算前漫斗赛段位
    int32        new_mandou_rank = 9; // 重置后新段位
}

// 惊喜宝箱开箱日志
message ch_surprise_box_log {
    // PRIMARY KEY: role_id,origin_box_id
    int64        uuid                = 1;  // 日志ID 必填 Hidden
    int64        writeTime           = 2;  // 日志记录时间 必填 DateTime
    string       version             = 3;  // 版本号 必填
    Common       common              = 4;  // 公共字段
    RoleCommon   roleCommon          = 5;  // 角色公共字段
    LcxSdkCommon sdkCommon           = 6;  // LCX的SDK公共字段
    int32        origin_box_id       = 7;  // 原始宝箱ID（月卡升级前）
    int32        effective_box_id    = 8;  // 最终抽奖使用的宝箱ID（含月卡升级+时间段切换）
    int32        card_type           = 9;  // 升级卡种：0=无 1=月卡 2=终身卡（复用MonthCardPrivilegeType枚举）
    int32        is_time_slot_switch = 10; // 是否被时间段切换 0=否 1=是
    int32        rand_quality        = 11; // 命中品质位（1~6）
    int32        drop_id             = 12; // 命中掉落ID
    string       reward_brief        = 13; // 奖励摘要 格式: itemId:num,itemId:num
    int32        is_crit             = 14; // 是否有暴击 0=否 1=是
    string       reason              = 15; // 一级原因
    string       sub_reason          = 16; // 二级原因
}
// 直购限购拦截日志
message ch_cash_goods_limit_log {
    // PRIMARY KEY:role_id,cashGoodsId,limitType
    int64        uuid                = 1;  // 日志ID 必填 Hidden
    int64        writeTime           = 2;  // 日志记录时间 必填 DateTime
    string       version             = 3;  // 版本号 必填
    Common       common              = 4;  // 公共字段
    RoleCommon   roleCommon          = 5;  // 角色公共字段
    LcxSdkCommon sdkCommon           = 6;  // LCX的SDK公共字段
    string       purchaseId          = 7;  // 订单id
    string       cashGoodsId         = 8;  // 直购商品id
    int32        limitType           = 9;  // 限购类型
    int32        shopId              = 10; // 商店ID
    int32        goodsId             = 11; // 商品ID
    int32        cashGoodsRechargeId = 12; // 游戏内直购ID，对应CashGoodsConfig.RechargeID
    int32        buyCount            = 13; // 当前已购买次数
    int32        limitNumber         = 14; // 限购上限
    int32        checkResult         = 15; // 预检测结果 1=通过 2=配置异常 3=超过上限
    string       rejectReason        = 16; // 拒绝原因
}

message ch_frame_summary_log {
    int64           uuid                            = 1;  // 日志ID Hidden
    int64           writeTime                       = 2;  // 日志记录时间 DateTime
    string          version                         = 3;  // 版本号
    Common          common                          = 4;  // 公共字段
    string          battle_id                       = 5;  // 战斗id
    string          room_id                         = 6;  // 房间id
    int32           server_id                       = 7;  // 战斗服务器id
    string          battle_area                     = 8;  // 战斗区域(如 ap.hongkong)
    int32           match_flag                      = 9;  // 匹配类型(0=正常 1=补偿局 2=温暖局)
    int32           game_model_id                   = 10; // 模式配置id(modeId)
    int32           game_type                       = 11; // 游戏类型
    string          game_model_name                 = 12; // 模式名(GM_RECREATION 等)
    string          game_type_name                  = 13; // 游戏类型名(GT_3V3_ATHLETICS 等)
    int64           rand_seed                       = 14; // 随机种子
    string          battle_version                  = 15; // 战斗版本
    string          client_version                  = 16; // 客户端版本
    string          affix                           = 17; // 词缀
    int32           online_player_count             = 18; // 开局真实玩家数(BS_Fighting 瞬间快照)
    int32           real_player_count               = 19; // 本场战斗真人玩家数(fighterNum-robotNum-AINum)
    int32           robot_count                     = 20; // 机器人数量(由匹配服填充)
    int32           loaded_player_count             = 21; // 本场加载完成玩家数(len(loadOKMap))
    int32           room_max_num                    = 22; // 房间最大容量(按模式配置,如 3v3=6)
    int32           active_battle_count             = 23; // 该战斗服当前活跃战斗场次数
    int64           total_frame_count               = 24; // 总帧数
    int32           max_frame_size                  = 25; // 单帧最大字节
    int32           min_frame_size                  = 26; // 单帧最小字节
    int32           avg_frame_size                  = 27; // 平均帧大小(四舍五入)
    int32           p50_frame_size                  = 28; // 帧大小 P50
    int32           p75_frame_size                  = 29; // 帧大小 P75
    int32           p90_frame_size                  = 30; // 帧大小 P90
    int32           p95_frame_size                  = 31; // 帧大小 P95
    int32           p99_frame_size                  = 32; // 帧大小 P99
    int64           total_frame_bytes               = 33; // 累计帧字节
    int32           oversize_frame_count            = 34; // 超过 MTU 的帧数(触发拆包)
    int32           total_cmd_count                 = 35; // 总指令数
    int32           max_cmd_per_frame               = 36; // 单帧最大指令数
    int32           avg_cmd_per_frame               = 37; // 平均每帧指令(四舍五入)
    int32           p95_cmd_per_frame               = 38; // 帧指令 P95
    int32           empty_cmd_frame_count           = 39; // 空指令帧数(心跳帧)
    int32           mtu                             = 40; // MTU 阈值(字节)
    int32           max_mtu_usage_pct               = 41; // 峰值 MTU 利用率 (0~100)
    int32           avg_mtu_usage_pct               = 42; // 平均 MTU 利用率 (0~100)
    int32           p95_mtu_usage_pct               = 43; // MTU 利用率 P95
    int32           high_usage_frame_count          = 44; // MTU 利用率 > 80 的帧数
    int32           target_frame_interval_ms        = 45; // 目标帧间隔(ms)
    int64           battle_duration_ms              = 46; // 战斗总时长(ms,从 BS_Fighting 到结算)
    int32           battle_phase_duration_ms        = 47; // 战斗阶段耗时(ms,sysPassTime,从 BS_Fighting 到结算)
    int32           end_reason                      = 48; // 结束原因(BE_REASON 枚举值)
    string          end_reason_name                 = 49; // 结束原因名(BE_NORMAL/BE_UNUSUAL_*)
    string          result_md5                      = 50; // 结算 MD5
    int32           result_count                    = 51; // 收到结算上报数(resultsCount)
    int64           total_resend_count              = 52; // 累计重传帧数
    int64           total_pong_count                = 53; // 累计心跳次数
    int32           avg_rtt_ms                      = 54; // 全场平均 RTT(四舍五入)
    int32           max_rtt_ms                      = 55; // 全场最大 RTT
    int32           quick_frame_count               = 67; // 快速补帧次数
    int32           frame_diff_count                = 68; // 帧差补帧次数
    int32           timeout_frame_count             = 69; // 超时补帧次数
    int64           dynamic_redundancy_count        = 70; // 动态冗余开启次数
    int64           client_request_redundancy_count = 71; // 客户端请求补包次数
    bool            has_crc                         = 72; // 本场是否出现过CRC不一致
    int32           crc_count                       = 73; // 本场CRC不一致次数
    repeated int32  crc_player_ids                  = 74; // 出现CRC的玩家ID集合
    repeated int32  crc_fighter_indexes             = 75; // CRC异常fighterIndex集合
    repeated int32  settled_player_ids              = 76; // 已发送BattleEndC2S的玩家ID集合
    repeated int32  unsettled_player_ids            = 77; // 结算超时时仍未发送BattleEndC2S的玩家ID集合
    int32           settled_player_count            = 78; // 已结算玩家数量
    int32           unsettled_player_count          = 79; // 未结算玩家数量
    repeated int32  unsettled_crc_player_ids        = 80; // 未结算且发生过CRC的玩家ID交集
    int32           unsettled_crc_player_count      = 81; // 未结算且发生过CRC的玩家数量
    bool            unsettled_all_crc               = 82; // 未结算玩家是否全部在CRC玩家集合内
    repeated string result_md5_list                 = 83; // 本场出现过的所有结算MD5
    repeated int32  result_md5_count_list           = 84; // 每个MD5的上报人数,与result_md5_list对齐
    string          result_md5_player_ids           = 85; // JSON:md5->playerId数组
    string          result_md5_fighter_indexes      = 86; // JSON:md5->fighterIndex数组
    int32           result_md5_distinct_count       = 87; // 本场不同MD5数量
    int32           result_md5_majority_count       = 88; // 本场结算MD5最大票数
    bool            result_md5_all_same             = 89; // 已上报玩家MD5是否全部一致
}

message ch_player_battle_end_report_audit_log {
    int64   uuid                    = 1;  // 日志ID Hidden
    int64   writeTime               = 2;  // 日志记录时间 DateTime
    string  version                 = 3;  // 版本号
    Common  common                  = 4;  // 公共字段
    string  battle_id               = 5;  // 战斗ID字符串
    string  room_id                 = 6;  // 房间ID字符串
    string  team_id                 = 7;  // 队伍ID字符串
    int32   player_id               = 8;  // 玩家ID
    int32   fighter_index           = 9;  // 战斗内玩家索引
    int32   camp                    = 10; // 阵营枚举值
    int32   game_type               = 11; // GameType枚举值
    string  game_type_name          = 12; // GameType名称
    int32   game_model              = 13; // GameModel枚举值
    string  game_model_name         = 14; // GameModel名称
    int32   battle_mode_id          = 15; // 玩法配置ID
    string  affix                   = 16; // 词缀JSON
    int32   report_frame            = 17; // 玩家上报结算时服务器当前帧
    int64   report_time_ms          = 18; // 玩家上报结算服务器时间戳毫秒
    int64   report_elapsed_ms       = 19; // 玩家上报距离开战耗时毫秒
    int32   report_order            = 20; // 本场结算包接收顺序
    bool    has_report              = 21; // 玩家是否发送BattleEndC2S
    bool    report_valid            = 22; // 结算包是否参与有效投票
    string  report_status           = 23; // report状态(reported/rejected/missing)
    string  battle_end_report_json  = 24; // BattleEndC2S原始JSON
    int64   battle_end_report_json_bytes = 25; // BattleEndC2S JSON字节数
    string  json_error_code         = 26; // JSON编码错误码
    string  client_result_md5       = 27; // 客户端上报的原始MD5
    string  normalized_result_md5   = 28; // 服务端规范化后MD5
    string  selected_result_md5     = 29; // 本场最终选择的MD5
    string  md5_match_status        = 30; // 玩家MD5与最终MD5关系
    string  md5_distribution_json   = 31; // MD5票数与占比JSON
    repeated string result_md5_list = 32; // 本场出现过的所有规范化MD5
    repeated int32  result_md5_count_list = 33; // 每个MD5票数,与result_md5_list对齐
    repeated int32  result_md5_rate_bp_list = 34; // 每个MD5占比BP,与result_md5_list对齐
    int32   result_md5_distinct_count = 35; // 本场不同MD5数量
    int32   result_md5_majority_count = 36; // 本场最高票数
    bool    result_md5_all_same     = 37; // 本场有效MD5是否全部一致
    string  decision_kind           = 38; // 投票决策类型
    int32   settlement_reason       = 39; // BE_REASON枚举值
    string  settlement_reason_name  = 40; // BE_REASON名称
    string  close_reason            = 41; // 实际闭合原因
    string  requested_close_reason  = 42; // 请求闭合来源
    int32   expected_report_count   = 43; // 预期上报人数
    int32   required_report_count   = 44; // 最低有效票门槛
    int32   received_report_count   = 45; // 已收到上报数
    int32   valid_vote_count        = 46; // 有效投票数
    int32   invalid_report_count    = 47; // 无效上报数
    int32   missing_report_count    = 48; // 未上报人数
    string  normalization_error_code = 49; // 规范化错误码
    string  normalization_error_path = 50; // 规范化错误字段路径
    string  md5_version             = 51; // 规范化MD5版本
    int32   decision_frame          = 52; // 形成决策时服务器帧
    int64   decision_time_ms        = 53; // 形成决策时服务器时间戳毫秒
    string  battle_version          = 54; // 战斗版本
    string  client_version          = 55; // 客户端版本
    int32   server_id               = 56; // 战斗服务器ID
    string  battle_area             = 57; // 战斗区域
    int32   match_flag              = 58; // 匹配标记
    int64   rand_seed               = 59; // 随机种子
}

// 搜打撤温暖局命中与结算
message ch_warmup_match_log {
    Common common = 1; // 公共字段
    RoleCommon roleCommon = 2; // 角色公共字段
    int64 uuid = 3; // 日志ID
    int64 writeTime = 4; // 写入时间
    string version = 5; // 版本
    int32 playerId = 6; // 玩家ID
    int32 seasonId = 7; // 赛季ID
    int64 matchId = 8; // 玩家所属队伍本次匹配matchUuid（非Match.csv配置ID）
    int64 battleId = 9; // 战斗ID
    string stage = 10; // 阶段(decision/match_hit/cleanup/bind/settle_consume)
    string result = 11; // 结果(success/fail/skip)
    string reason = 12; // 固定低基数原因
    int32 loseStreak = 13; // 连败次数
    int32 lowPerfStreak = 14; // 低表现次数
    int32 cooldownLeft = 15; // 剩余冷却局数
    int32 dailyCount = 16; // 当日已触发次数
    int32 dailyLimit = 17; // 当日触发上限
    int32 cooldownAfterSettle = 18; // 结算后冷却局数
    int32 mmrScore = 19; // 当前MMR
    int32 modeId = 20; // 玩法ID
    string teamId = 21; // 队伍ID
    int32 matchFlag = 22; // 0正常 1补偿局 2温暖局
    bool persisted = 23; // 本阶段状态是否已持久化
    int32 qualityScoreTenThousand = 24; // Q
    int32 survivalTimeTenThousand = 25; // t_surv
    int32 evacuateResult = 26; // result_type
    bool extract = 27; // extract
    int32 mmrBefore = 28; // mmr_before
    int32 mmrAfter = 29; // mmr_after
}

// 搜打撤MMR结算
message ch_mmr_settlement_log {
    Common common = 1; // 公共字段
    RoleCommon roleCommon = 2; // 角色公共字段
    int64 uuid = 3; // 日志ID
    int64 writeTime = 4; // 写入时间
    string version = 5; // 版本
    int32 seasonId = 6; // 赛季ID
    int32 modeId = 7; // 模式ID
    int32 playerId = 8; // 玩家ID
    int64 matchId = 9; // 玩家所属队伍本次匹配matchUuid（非Match.csv配置ID）
    int64 battleId = 10; // 战斗ID
    int32 battleResult = 11; // 战斗结果
    int32 evacuateResult = 12; // 撤离结果(1成功/2失败)
    int32 mmrBefore = 13; // MMR(前)
    int32 mmrDelta = 14; // MMR变化
    int32 mmrAfter = 15; // MMR(后)
    int32 mmrLobby = 16; // 成房冻结MMR
    int32 mmrDiff = 17; // lobbyMMR-个人MMR
    int32 xTenThousand = 18; // 强弱局x系数(万分比)
    int32 factorTenThousand = 19; // 强弱局F系数(万分比)
    int32 qualityScoreTenThousand = 20; // 质量分(万分比)
    int32 baseScoreTenThousand = 21; // 基础分(万分比)
    int32 secondaryScoreTenThousand = 22; // 次级分(万分比)
    int32 scoreTenThousand = 23; // 原始MMR变化分(万分比)
    int32 killPlayerCount = 24; // 击杀玩家数
    int32 assistPlayerCount = 25; // 助攻数
    int32 rescueCount = 26; // 救援数
    int32 damage = 27; // 伤害
    int32 lootValue = 28; // 物资价值
    int32 surviveTime = 29; // 存活时长(秒)
    bool extract = 30; // 是否成功撤离
    bool lowPerformance = 31; // 是否低表现
    string stage = 32; // 阶段(persist/skip)
    string result = 33; // 结果(success/skip)
    string reason = 34; // 固定低基数结果原因
    bool persisted = 35; // MMR是否已最终持久化
}

// 搜打撤MMR结算错误
message ch_mmr_settlement_error_log {
    Common common = 1; // 公共字段
    RoleCommon roleCommon = 2; // 角色公共字段
    int64 uuid = 3; // 日志ID
    int64 writeTime = 4; // 写入时间
    string version = 5; // 版本
    int32 seasonId = 6; // 赛季ID
    int32 modeId = 7; // 模式ID
    int32 playerId = 8; // 玩家ID
    int64 matchId = 9; // 玩家所属队伍本次匹配matchUuid（非Match.csv配置ID）
    int64 battleId = 10; // 战斗ID
    string stage = 11; // 阶段(param/context/lock/persist)
    string reason = 12; // 固定低基数原因
    int32 errorCode = 13; // 错误码
    int32 mmrBefore = 14; // MMR(前)
    int32 mmrLobby = 15; // 成房冻结MMR
    bool sdcMmrEligible = 16; // 是否具备MMR资格
    string result = 17; // 结果(fail)
    bool persisted = 18; // MMR是否已最终持久化
}

