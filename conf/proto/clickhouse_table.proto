    int64  sys_load1                  = 7;  // 1min系统负载（放大100倍）
    int64  sys_load5                  = 8;  // 5min系统负载（放大100倍）
    int64  sys_load15                 = 9;  // 15min系统负载（放大100倍）
    int64  net_bytes_sent             = 10; // 网络发送字节数/s
    int64  net_bytes_recv             = 11; // 网络收到字节数/s
    int64  net_packets_sent           = 12; // 网络发送包数/s
    int64  net_packets_recv           = 13; // 网络收到包数/s
