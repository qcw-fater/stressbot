    RoleCommon                 roleCommon             = 5;  // 角色公共字段
    LcxSdkCommon               sdkCommon              = 6;  // LCX的SDK公共字段
    int32                      logType                = 7;  // 日志类型
    string                     name                   = 8;  // 玩家姓名
    int32                      icon                   = 9;  // 头像
    int32                      iFrame                 = 10; // 头像框
    string                     sign                   = 11; // 玩家签名
    int32                      lbs                    = 12; // 玩家位置信息【当前定位】
    string                     city                   = 13; // 玩家常驻城市
    int32                      showLevel              = 14; // 玩家总等级
    int32                      showVip                = 15; // 会员等级
    int32                      ladderLevel            = 16; // 段位等级
    int32                      starNum                = 17; // 星星数量
    int32                      meSeason               = 18; // 自己所在赛季
    int32                      currSeason             = 19; // 当前版本
    bool                       promotion              = 20; // 晋级赛中
    int32                      braveryScore           = 21; // 勇者积分
    int32                      unitId                 = 22; // unit 配置表Id
    repeated int32             titles                 = 23; // 称号id
    int32                      moralityScore          = 24; // 品德分
    int32                      freeRenameNum          = 25; // 当前免费重命名次数
    int64                      lastRenameTime         = 26; // 上次重命名时间
    repeated int32             wantHeroList           = 27; // 玩家想玩英雄
    repeated string            privacySetList         = 28; // 隐私(屏蔽base的游戏字段)
    repeated CommonUsedHero    commonUsedHeroes       = 29; // 常用英雄
    int32                      showHeroId             = 30; // 个人信息展示页面英雄Id
    int32                      showHeroSkinId         = 31; // 个人信息展示页面英雄皮肤Id
    repeated LbsTitleInfo      lbsTitles              = 32; // 当前使用的称号
    int32                      allAchievementScore    = 33; // 玩家成就积分(玩家成就值+所有漫画成就值)
    int32                      dayLimitScore          = 34; // 每日通过战斗获得的战斗积分上限
    int32                      score                  = 35; // 总积分 总积分为各玩法积分之和，各玩法积分减少，总积分跟随减少
    int32                      level                  = 36; // 等级, 由每个玩法的等级累加得到
    int64                      firstWinTime           = 37; // 首胜时间戳 秒
    string                     guildName              = 38; // 战队名称
    string                     position               = 39; // 战队职位
    int32                      beUpvoteNum            = 40; // 被点赞数
    repeated int32             lbsJobScoreList        = 41; // lbs职位积分
    int32                      normalBattleTitle      = 42; // 战斗局内普通称号id
    repeated LbsTitleInfo      inBattleLbsTitle       = 43; // 战斗局内Lbs职业和英雄称号
    repeated int32             showJobs               = 44; // 展示职业
}

