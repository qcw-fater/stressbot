}

// LBS结算事件日志
message ch_lbs_settlement_log {
    // PRIMARY KEY:server_id
    int64  uuid                 = 1;  // 日志ID 必填 Hidden
    int64  writeTime            = 2;  // 日志记录时间 必填 DateTime
    string version              = 3;  // 版本号       必填
    Common common               = 4;  // 公共字段
    int32  server_id            = 5;  // 服务器ID
    string server_role          = 6;  // 服务器角色(leader/worker)
    string event_type           = 7;  // 事件类型
    int32  settlement_type      = 8;  // 结算类型(0=活跃检查,1=国服,2=省榜,3=市榜,4=区榜)
    string settlement_type_name = 9;  // 结算类型名称
    int64  duration_ms          = 10; // 耗时(毫秒)
    int32  count                = 11; // 数量(如LbsId数量、命令数量)
    int32  success_count        = 12; // 成功数量
    int32  fail_count           = 13; // 失败数量
    string status               = 14; // 状态(success/fail/timeout/panic)
    int32  batch_index          = 15; // 批次索引
    int32  total_batches        = 16; // 总批次数
    int32  total_commands       = 17; // 总命令数
    string error_message        = 18; // 错误信息
    string error_stack          = 19; // 错误堆栈
    string context_json         = 20; // 上下文信息JSON
    int32  lbs_id               = 21; // LbsId(processLbsId事件专用)
    int64  lock_wait_ms         = 22; // 锁获取耗时(毫秒)
    int64  semaphore_wait_ms    = 23; // 信号量等待总耗时(毫秒)
    int32  hero_count           = 24; // 处理的英雄数量
    int32  job_count            = 25; // 处理的职业数量
}

