// SDC结算审计日志
message ch_player_sdc_settle_audit_log {
    // PRIMARY KEY:role_id,battle_id
    int64      uuid                  = 1;  // 日志ID 必填 Hidden
    int64      writeTime             = 2;  // 日志记录时间 必填 DateTime
    string     version               = 3;  // 版本号 必填
    Common     common                = 4;  // 公共字段
    RoleCommon roleCommon            = 5;  // 角色公共字段
    int64      battle_id             = 6;  // 战斗ID
    int64      room_id               = 7;  // 房间ID
    int32      result_type           = 8;  // 结算结果
    string     validation_result     = 9;  // pass/rejected/unknown_end/compensated
    string     reject_reason         = 10; // 拒绝原因
    int32      loot_value_reported   = 11; // 客户端上报lootValue
    int32      loot_value_server     = 12; // 服务器重算lootValue
    int32      rating_reported       = 13; // 客户端上报评级
    int32      rating_server         = 14; // 服务器重算评级
    int32      settle_value_cap      = 15; // 结算价值上限
    int32      settle_value_actual   = 16; // 结算实际价值
    int32      lost_item_count       = 17; // 丢失道具数
    int32      kept_item_count       = 18; // 保留道具数
    int32      final_pack_item_count = 19; // 藏品背包道具数
    int32      final_equip_count     = 20; // 装配槽位数
    string     raw_settle_data       = 21; // 异常时原始结算数据base64
    string     before_snapshot       = 22; // 异常时结算前快照base64
    string     after_snapshot        = 23; // 异常时结算后快照base64
    string     field_warnings        = 24; // 字段阈值告警信息
    int32      collection_destroyed  = 25; // 藏品销毁数量
    int32      settle_duration_ms    = 26; // 结算耗时（毫秒）
    int32      sdc_level             = 27; // 结算时玩家SDC等级
}

// SDC战备操作日志
message ch_player_sdc_prepare_log {
    // PRIMARY KEY:role_id,log_type
    int64      uuid                  = 1;  // 日志ID Hidden
    int64      writeTime             = 2;  // 日志记录时间 DateTime
    string     version               = 3;  // 版本号
    Common     common                = 4;  // 公共字段
    RoleCommon roleCommon            = 5;  // 角色公共字段
    int32      log_type              = 6;  // 操作类型: 0=进战冻结快照 1=装配 2=卸下 3=移动 4=出售 5=批量出售 6=使用藏品 7=设置补齐队友 8=替换 9=使用套装 10=取消套装 17=修理护甲
    int32      result                = 7;  // 操作结果: 0=失败 1=成功
    string     error_code            = 8;  // 失败时的错误码
    int32      sdc_level             = 9;  // SDC等级
    int32      total_equip_value     = 10; // 操作后总装配价值
    int32      item_count            = 11; // 仓库道具总数
    int32      slot_type             = 12; // 槽位类型
    int64      item_guid             = 13; // 操作道具GUID
    int32      item_id               = 14; // 道具配置ID
    int32      from_pack_type        = 15; // 来源: 0=仓库 1-5=背包 -1=装配槽
    int32      to_pack_type          = 16; // 目标: 0=仓库 1-5=背包
    int32      sell_count            = 17; // 出售数量
    int32      sell_value            = 18; // 出售获得总价值
    int32      money_type            = 19; // 货币类型
    int32      batch_total           = 20; // 批量出售请求总数
    int32      batch_success         = 21; // 批量出售成功数
    int32      use_number            = 22; // 使用数量
    int32      hero_id               = 23; // 关联英雄ID
    int32      fill_teammate         = 24; // 补齐队友选项(0=关 1=开)
    string     equip_item_guids_json = 25; // 装配槽道具GUID列表（JSON数组）
    string     pack_item_guids_json  = 26; // 背包道具GUID列表（JSON数组）
    int32      skill_pack_value      = 27; // 技能背包总价值
    int32      suit_type                         = 28; // 套装券档位
    int32      plan_id                           = 29; // 套装方案ID
    int32      before_using_suit                 = 30; // 操作前套装状态: 0=未使用 1=使用中
    int32      after_using_suit                  = 31; // 操作后套装状态: 0=未使用 1=使用中
    int64      suit_use_time                     = 32; // 本次套装使用时间戳（秒）
    string     suit_snapshot_equip_guids_json    = 33; // 使用套装前装备GUID列表（JSON数组）
    string     sold_item_guids_json              = 34; // 本次实际成功出售GUID列表（JSON数组）
    string     warehouse_item_guids_json         = 35; // 操作后仓库GUID列表（JSON数组）
    int32      preset_slot_index                 = 36; // 预设槽位索引
    bool       preset_overwrite                  = 37; // 是否覆盖预设
    string     preset_name_before                = 38; // 改名前预设名称
    string     preset_name_after                 = 39; // 改名后预设名称
    bool       has_temporary_preset              = 40; // 是否使用临时预设
    int32      request_count                     = 41; // 请求物品数量
    int32      moved_count                       = 42; // 实际移动数量
    int32      remained_count                    = 43; // 未移动数量
    int64      value_before                      = 44; // 操作前价值
    int64      value_after                       = 45; // 操作后价值
    string     request_items_json                = 46; // 请求物品明细JSON
    string     actual_items_json                 = 47; // 实际物品明细JSON
    string     cost_json                         = 48; // 实际消耗JSON
    int32      save_result                       = 49; // 持久化结果:0=失败1=成功
    int32      cost_result                       = 50; // 扣费结果:0=未扣费1=成功2=失败
    string     preset_slots_before_json          = 51; // 操作前预设或战备槽位完整快照JSON
    string     preset_slots_after_json           = 52; // 操作后预设或战备槽位完整快照JSON
    int32      item_type                         = 53; // 实际道具一级类型
    int32      item_sub_type                     = 54; // 实际道具二级类型
    int32      item_sub_type2                    = 55; // 实际道具三级类型
    int32      item_count_before                 = 56; // 操作前实例堆叠数量
    int32      item_count_after                  = 57; // 操作后实例堆叠数量
    string     effect_before_json                = 58; // 操作前服务器计算的英雄临时效果JSON
    string     effect_after_json                 = 59; // 操作后服务器计算的英雄临时效果JSON
    int32      durability_before                 = 60; // 修理前护甲耐久
    int32      durability_after                  = 61; // 修理后护甲耐久
    int32      max_durability                    = 62; // 护甲最大耐久
    int32      repair_cost_per_point             = 63; // 每点耐久修理消耗
    int64      repair_cost_total                 = 64; // 本次修理总消耗
}

// SDC道具资产流水
message ch_player_sdc_item_flow_log {
    // PRIMARY KEY:role_id,item_guid,flow_id
    int64 uuid = 1; // 日志ID Hidden
    int64 writeTime = 2; // 日志记录时间 DateTime
    string version = 3; // 版本号
    Common common = 4; // 公共字段
    RoleCommon roleCommon = 5; // 角色公共字段
    LcxSdkCommon sdkCommon = 6; // LCX的SDK公共字段
    int64 flow_id = 7; // 同一业务事务的流水组ID
    string action = 8; // 资产动作:add/delete/update
    string reason_code = 9; // 稳定一级原因编码
    int32 reason_id = 10; // common.Reason稳定ID
    string reason_desc = 11; // 原因说明
    string sub_reason = 12; // 二级原因
    int32 season_id = 13; // 事务开始时SDC赛季ID
    int64 battle_id = 14; // 关联战斗ID
    string source_type = 15; // 关联业务类型
    int64 source_id = 16; // 关联业务标识
    int64 item_guid = 17; // 道具实例GUID
    int32 item_id = 18; // 查询用道具ID
    int32 before_item_id = 19; // 变更前道具ID
    int32 after_item_id = 20; // 变更后道具ID
    int32 before_number = 21; // 变更前有效数量
    int32 after_number = 22; // 变更后有效数量
    int64 before_value = 23; // 变更前当前价值
    int64 after_value = 24; // 变更后当前价值
    int64 before_original_value = 25; // 变更前原始价值
    int64 after_original_value = 26; // 变更后原始价值
    int32 before_durability = 27; // 变更前耐久
    int32 after_durability = 28; // 变更后耐久
    int32 before_max_durability = 29; // 变更前最大耐久
    int32 after_max_durability = 30; // 变更后最大耐久
    int32 before_capacity = 31; // 变更前容量
    int32 after_capacity = 32; // 变更后容量
    int32 before_sdc_type = 33; // 变更前SDC类型
    int32 after_sdc_type = 34; // 变更后SDC类型
    int32 before_sdc_sub_type = 35; // 变更前SDC子类型
    int32 after_sdc_sub_type = 36; // 变更后SDC子类型
    repeated int32 before_affix_ids = 37; // 变更前规范化词条ID
    repeated int32 after_affix_ids = 38; // 变更后规范化词条ID
