syntax             = "proto3"; //[proto2|proto3]

option  go_package = ".;pb";
package Game;

import "nohot_custom_battle.proto";

// 道具产耗
message resource_info {
    int32 item_id    = 1;
    int32 after_num  = 2;
    int32 before_num = 3;
    int32 change_num = 4;
}

// 产能消耗字段
message LogResourceInfo {
    int32 item_id = 1;
    int32 after   = 2;
    int32 before  = 3;
    int32 diff    = 4;
}

// 公共字段
message Common {
    int32 day         = 1; // 生成记录的日期
    int32 record_time = 2; // 生成记录的时间
}

// 角色公共字段
message RoleCommon {
    string zone_id   = 1; // 区组id
    int32  role_id   = 2; // 角色id
    string role_name = 3; // 角色名称
    string role_vip  = 4; // 角色VIP
    string role_pay  = 5; // 角色充值
}

// LCX公共字段
message LcxSdkCommon {
    string app_id         = 1;  // 游戏ID
    string device_id      = 2;  // 设备号
    string lcx_id         = 3;  // 账号ID
    string aff_code       = 4;  // 渠道ID(小包)
    string device_model   = 5;  // 设备型号
    string os             = 6;  // 操作系统
    string store          = 7;  // 商店(大包)
    string app_version    = 8;  // 游戏包版本号
    string sdk_version    = 9;  // SDK版本号
    string carrier        = 10; // 移动运营商
    string android_id     = 11; // 安卓ID
    string advertising_id = 12; // 广告ID
    string idfv           = 13; // 应用开发商标识符
    string idfa           = 14; // 广告主标识符
    string country_code   = 15; // 国家或地区代码
    string network_type   = 16; // 网络类型
    string locale         = 17; // 设备语言
    string manufacturer   = 18; // 设备制造商
    string request_stamp  = 19; // 每次SDK初始化时生成的唯一ID
}

// 货币存量
message CurrencyInfo {
    int64 total_diamond     = 1; // 意志结晶/钻石当前存量
    int64 total_gold        = 2; // 金币当前存量
    int64 total_star_money  = 3; // 纪念币当前存量
    int64 total_gacha_money = 4; // 阅览/抽卡券存量
}

// 总比赛信息
message TotalFightInfo {
    int32 rank_wins       = 1;  //  天梯/排位胜利次数
    int32 rank_fail       = 2;  //  天梯/排位失败次数
    int32 budokai_wins    = 3;  //  武道会胜利次数
    int32 budokai_fail    = 4;  //  武道会失败次数
    int32 duel_one_wins   = 5;  //  单人乱斗胜利次数
    int32 duel_one_fail   = 6;  //  单人乱斗失败次数
    int32 duel_two_wins   = 7;  //  双人乱斗胜利次数
    int32 duel_two_fail   = 8;  //  双人乱斗失败次数
    int32 score_wins      = 9;  //  积分争夺胜利次数
    int32 score_fail      = 10; //  积分争夺失败次数
    int32 infinity_wins   = 11; //  无限城胜利次数
    int32 infinity_fail   = 12; //  无限城失败次数
    int32 dragonball_wins = 13; //  龙珠收集胜利次数
    int32 dragonball_fail = 14; //  龙珠收集失败次数
}

// 总比赛信息
message SeasonFightInfo {
    int32 season_rank_wins       = 1;  //  天梯/排位胜利次数
    int32 season_rank_fail       = 2;  //  天梯/排位失败次数
    int32 season_budokai_wins    = 3;  //  武道会胜利次数
    int32 season_budokai_fail    = 4;  //  武道会失败次数
    int32 season_duel_one_wins   = 5;  //  单人乱斗胜利次数
    int32 season_duel_one_fail   = 6;  //  单人乱斗失败次数
    int32 season_duel_two_wins   = 7;  //  双人乱斗胜利次数
    int32 season_duel_two_fail   = 8;  //  双人乱斗失败次数
    int32 season_score_wins      = 9;  //  积分争夺胜利次数
    int32 season_score_fail      = 10; //  积分争夺失败次数
    int32 season_infinity_wins   = 11; //  无限城胜利次数
    int32 season_infinity_fail   = 12; //  无限城失败次数
    int32 season_dragonball_wins = 13; //  龙珠收集胜利次数
    int32 season_dragonball_fail = 14; //  龙珠收集失败次数
}

// 角色基础快照
message ch_daily_role_snapshot {
    // PRIMARY KEY:role_id
    int64           uuid                = 1;  // 日志ID 必填 Hidden
    string          writeTime           = 2;  // 日志记录时间必填 DateTime
    string          version             = 3;  // 版本号必填
    Common          common              = 4;  // 公共字段
    RoleCommon      roleCommon          = 5;  // 角色公共字段
    LcxSdkCommon    sdkCommon           = 6;  // LCX的SDK公共字段
    int32           guildId             = 7;  // 公会id
    int32           guild_job           = 8;  // 公会职位
    int32           total_amount        = 9;  // 角色当前付费水晶存量
    int32           total_free_amount   = 10; // 角色当前绑定水晶存量
    CurrencyInfo    currency_info       = 11; // 其他货币存量
    int32           total_fight_trophy  = 12; // 总奖杯获得
    int32           total_fight_wins    = 13; // 总胜利次数
    int32           total_fight_fail    = 14; // 总失败次数
    int32           total_fight_ranked  = 15; // 最高段位
    TotalFightInfo  total_fight_info    = 16; // 总比赛信息
    int32           season_fight_trophy = 17; // 本赛季奖杯获得
    int32           season_fight_wins   = 18; // 本赛季胜利次数
    int32           season_fight_fail   = 19; // 本赛季失败次数
    int32           season_fight_ranked = 20; // 当前段位
    SeasonFightInfo season_fight_info   = 21; // 本赛季比赛信息
    int32           continuous_wins     = 22; // 最高连胜
    int32           thumbs_up           = 23; // 被赞次数
    int32           total_days          = 24; // 总在线天数
    string          first_pay_time      = 25; // 角色首次充值时间
    string          last_pay_time       = 26; // 角色末次充值时间
    repeated int32  bp_id               = 27; // 拥有战令id
    repeated int32  bp_level            = 28; // 战令当前等级
    int32           role_info           = 29; // 角色其他信息
    int32           total_pay           = 30; // 总充值金额
    int32           is_ban              = 31; // 封号状态1-活跃，0-封杀
}

// 角色卡牌快照
message ch_daily_role_card_snapshot_log {
    // PRIMARY KEY:role_id,card_id
    int64          uuid               = 1;  // 日志ID 必填 Hidden
    int64          writeTime          = 2;  // 日志记录时间必填 DateTime
    string         version            = 3;  // 版本号必填
    Common         common             = 4;  // 公共字段
    RoleCommon     roleCommon         = 5;  // 角色公共字段
    LcxSdkCommon   sdkCommon          = 6;  // LCX的SDK公共字段
    int32          card_id            = 7;  // 卡牌id
    string         card_name          = 8;  // 卡牌名称
    int32          card_manga         = 9;  // 卡牌所属漫画
    int32          card_level         = 10; // 卡牌等级
    repeated int32 card_awake         = 11; // 卡牌觉醒
    repeated int32 card_talent_slot   = 12; // 卡牌天赋(装备中)
    int32          card_trophy        = 13; // 卡牌奖杯
    int32          card_proficiency   = 14; // 卡牌熟练度
    int32          card_favor         = 15; // 卡牌好感度
    int32          card_achieve_level = 16; // 卡牌成就等级
    int32          card_achieve_exp   = 17; // 卡牌成就经验
    repeated int32 card_skin          = 18; // 卡牌皮肤
    int32          card_total_nums    = 19; // 卡牌总使用次数
    int32          card_total_wins    = 20; // 卡牌总胜利次数
    int32          card_season_nums   = 21; // 本赛季使用次数
    int32          card_season_wins   = 22; // 本赛季胜利次数
    int32          card_info          = 23; // 卡牌信息
}

// 道具快照
message ch_daily_role_item_snapshot_log {
    // PRIMARY KEY:role_id,item_id,item_guid
    int64        uuid       = 1;  // 日志ID 必填 Hidden
    int64        writeTime  = 2;  // 日志记录时间必填 DateTime
    string       version    = 3;  // 版本号必填
    Common       common     = 4;  // 公共字段
    RoleCommon   roleCommon = 5;  // 角色公共字段
    LcxSdkCommon sdkCommon  = 6;  // LCX的SDK公共字段
    int32        item_id    = 7;  // 道具id
    string       item_name  = 8;  // 道具名称
    int32        item_nums  = 9;  // 道具数量
    int64        item_guid  = 10; // 道具guid
}

// 道具流水
message ch_resource_change_log {
    // PRIMARY KEY:role_id,item_type,id,unique_id
    int64          uuid        = 1;  // 日志ID 必填 Hidden
    int64          writeTime   = 2;  // 日志记录时间必填 DateTime
    string         version     = 3;  // 版本号必填
    Common         common      = 4;  // 公共字段
    RoleCommon     roleCommon  = 5;  // 角色公共字段
    LcxSdkCommon   sdkCommon   = 6;  // LCX的SDK公共字段
    int32          item_type   = 7;  // 道具类型
    int32          gu_type     = 8;  // 获得或消耗
    int32          id          = 9;  // 道具id
    int64          unique_id   = 10; // 道具唯一id
    int32          nums        = 11; // 道具数量
    int32          before      = 12; // 改变之前的数量
    int32          after       = 13; // 改变之后的数量
    repeated int32 item_detail = 14; // 使用道具类型
    string         reason      = 15; // 一级原因
    string         sub_reason  = 16; // 二级原因
}

// 卡牌升级
message ch_card_levelUp_log {
    // PRIMARY KEY:role_id,card_id
    int64                    uuid         = 1;  // 日志ID 必填 Hidden
    int64                    writeTime    = 2;  // 日志记录时间必填 DateTime
    string                   version      = 3;  // 版本号必填
    Common                   common       = 4;  // 公共字段
    RoleCommon               roleCommon   = 5;  // 角色公共字段
    LcxSdkCommon             sdkCommon    = 6;  // LCX的SDK公共字段
    int32                    before       = 7;  // 改变之前的角色等级
    int32                    after        = 8;  // 改变之后的角色等级
    int32                    card_id      = 9;  // 英雄id
    repeated LogResourceInfo resourceInfo = 10; // 道具产耗
}

// 卡牌觉醒
message ch_card_awake_log {
    // PRIMARY KEY:role_id,card_id
    int64                    uuid         = 1;  // 日志ID 必填 Hidden
    int64                    writeTime    = 2;  // 日志记录时间必填 DateTime
    string                   version      = 3;  // 版本号必填
    Common                   common       = 4;  // 公共字段
    RoleCommon               roleCommon   = 5;  // 角色公共字段
    LcxSdkCommon             sdkCommon    = 6;  // LCX的SDK公共字段
    repeated int32           before       = 7;  // 改变之前的觉醒等级
    repeated int32           after        = 8;  // 改变之后的觉醒等级
    int32                    card_id      = 9;  // 英雄id
    repeated LogResourceInfo resourceInfo = 10; // 道具产耗
}

// 卡牌天赋激活
message ch_card_talent_log {
    // PRIMARY KEY:role_id,card_id
    int64                    uuid         = 1; // 日志ID 必填 Hidden
    int64                    writeTime    = 2; // 日志记录时间必填 DateTime
    string                   version      = 3; // 版本号必填
    Common                   common       = 4; // 公共字段
    RoleCommon               roleCommon   = 5; // 角色公共字段
    LcxSdkCommon             sdkCommon    = 6; // LCX的SDK公共字段
    int32                    talentId     = 7; // 天赋Id
    int32                    card_id      = 8; // 英雄id
    repeated LogResourceInfo resourceInfo = 9; // 道具产耗
}

// 好友操作
message ch_friend_add_log {
    // PRIMARY KEY:role_id,target_user_id
    int64        uuid           = 1; // 日志ID 必填 Hidden
    int64        writeTime      = 2; // 日志记录时间必填 DateTime
    string       version        = 3; // 版本号必填
    Common       common         = 4; // 公共字段
    RoleCommon   roleCommon     = 5; // 角色公共字段
    LcxSdkCommon sdkCommon      = 6; // LCX的SDK公共字段
    int32        type           = 7; // 1请求添加好友 2处理好友申请 3删除好友 4拉黑 5删除黑名单
    int32        target_user_id = 8; // 改变之后的角色等级
}

// 邮件
message ch_email_log {
    // PRIMARY KEY:role_id,cfg_id,mail_guid
    int64                    uuid             = 1;  // 日志ID 必填 Hidden
    int64                    writeTime        = 2;  // 日志记录时间必填 DateTime
    string                   version          = 3;  // 版本号必填
    Common                   common           = 4;  // 公共字段
    RoleCommon               roleCommon       = 5;  // 角色公共字段
    LcxSdkCommon             sdkCommon        = 6;  // LCX的SDK公共字段
    int32                    mail_operation   = 7;  // 操作类型 1-发送、2-领取、3-删除
    string                   title            = 8;  // 邮件标题
    int32                    mail_source      = 9;  // 邮件来源
    bool                     is_hidden        = 10; // 是否隐藏邮件
    repeated int64           mail_guid        = 11; // 邮件唯一id列表
    string                   mail_source_info = 12; // 邮件来源信息
    int32                    cfg_id           = 13; // 邮件配置id
    repeated int32           item_id_list     = 14; // 附件内的道具id
    repeated int32           item_number_list = 15; // 附件内的道具数量
    repeated LogResourceInfo resourceInfo     = 16; // 道具产耗
    repeated int32           cfgIds           = 17; // 邮件配置ids
}

// 商城购买日志
message ch_player_shop_log {
    // PRIMARY KEY:role_id,shop_id,goods_id
    int64                    uuid          = 1;  // 日志ID 必填 Hidden
    int64                    writeTime     = 2;  // 日志记录时间必填 DateTime
    string                   version       = 3;  // 版本号必填
    Common                   common        = 4;  // 公共字段
    RoleCommon               roleCommon    = 5;  // 角色公共字段
    LcxSdkCommon             sdkCommon     = 6;  // LCX的SDK公共字段
    int32                    shop_id       = 7;  //	商店id
    int32                    shop_type     = 8;  //	商店类型
    int32                    goods_id      = 9;  //	商品id
    int32                    buy_count     = 10; //	购买商品次数
    int32                    buy_nums      = 11; //	购买商品数量
    int32                    is_discount   = 12; //	商品折扣
    int32                    limit_type    = 13; //	限购类型
    int32                    limit_group   = 14; //	限购分组
    repeated LogResourceInfo resourceInfo  = 15; //	道具产耗
    string                   cash_goods_id = 16; //	直购商品id
}

// 玩家抽卡日志
message ch_player_lottery_lucky_log {
    // PRIMARY KEY:role_id,gacha_id
    int64                    uuid            = 1;  // 日志ID 必填 Hidden
    int64                    writeTime       = 2;  // 日志记录时间 必填 DateTime
    string                   version         = 3;  // 版本号       必填
    int32                    playerId        = 4;  // 玩家id
    Common                   common          = 5;  // 公共字段
    RoleCommon               roleCommon      = 6;  // 角色公共字段
    LcxSdkCommon             sdkCommon       = 7;  // LCX的SDK公共字段
    int32                    count           = 8;  // 抽卡次数
    repeated int32           cost_id         = 9;  // 消耗道具id
    repeated int32           cost_number     = 10; // 消耗道具数量
    repeated int32           add_item_id     = 11; // 产出道具id
    repeated int32           add_item_number = 12; // 产出道具数量
    int32                    gacha_id        = 13; // 卡池id
    repeated LogResourceInfo resourceInfo    = 14; //	道具产耗
}

// 玩家活动达成日志
message ch_active_finish_log {
    // PRIMARY KEY:role_id,active_id
    int64          uuid         = 1;  // 日志ID 必填 Hidden
    int64          writeTime    = 2;  // 日志记录时间 必填 DateTime
    string         version      = 3;  // 版本号       必填
    int32          playerId     = 4;  // 玩家id
    Common         common       = 5;  // 公共字段
    RoleCommon     roleCommon   = 6;  // 角色公共字段
    LcxSdkCommon   sdkCommon    = 7;  // LCX的SDK公共字段
    int32          active_id    = 8;  // 活动id
    string         active_type  = 9;  // new_sign_in-新账号签到领取奖励 bp_reward-BP奖励 trophy-奖杯成就
    int32          active_index = 10; // 活动档位
    repeated int32 active_info  = 11; // 活动信息补充
}

// 玩家活动领奖日志
message ch_active_reward_log {
    // PRIMARY KEY:role_id,active_id
    int64          uuid            = 1;  // 日志ID 必填 Hidden
    int64          writeTime       = 2;  // 日志记录时间 必填 DateTime
    string         version         = 3;  // 版本号       必填
    int32          playerId        = 4;  // 玩家id
    Common         common          = 5;  // 公共字段
    RoleCommon     roleCommon      = 6;  // 角色公共字段
    LcxSdkCommon   sdkCommon       = 7;  // LCX的SDK公共字段
    int32          active_id       = 8;  // 活动id
    string         active_type     = 9;  // new_sign_in-新账号签到领取奖励 bp_reward-BP奖励 trophy-奖杯成就
    repeated int32 active_index    = 10; // 活动档位
    repeated int32 cost_id         = 11; // 消耗道具id
    repeated int32 cost_number     = 12; // 消耗道具数量
    repeated int32 add_item_id     = 13; // 产出道具id
    repeated int32 add_item_number = 14; // 产出道具数量
    repeated int32 active_info     = 15; // 活动信息补充
}

// 玩家登陆日志(HTTP)
message ch_login_log {
    // PRIMARY KEY:account
    int64  uuid          = 1;  // 日志ID 必填 Hidden
    int64  writeTime     = 2;  // 日志记录时间必填 DateTime
    string version       = 3;  // 版本号必填
    string account       = 4;  // 账号
    int64  lastLoginTime = 5;  // 最后登录时间 TimeStamp
    string loginIp       = 6;  // 登录IP
    string ipCity        = 7;  // 登录城市 Hidden
    string osSystem      = 8;  // 设备系统
    string deviceBrand   = 9;  // 设备品牌
    string deviceMemory  = 10; // 设备内存
    string deviceDpi     = 11; // 分辨率
    string deviceVersion = 12; // 系统版本号
    string netType       = 13; // 联网方式
    string cpuModel      = 14; // cpu型号
}

// 玩家登出日志
message ch_logout_log {
    // PRIMARY KEY:playerId,account,lastLogoutTime
    int64          uuid           = 1;  // 日志ID 必填 Hidden
    int64          writeTime      = 2;  // 日志记录时间    必填 DateTime
    string         version        = 3;  // 版本号       必填
    int32          playerId       = 4;  // 玩家id
    string         account        = 5;  // 账号
    int64          lastLogoutTime = 6;  // 最后登出时间 TimeStamp
    int32          onlineTime     = 7;  // 在线时长 Seconds
    int32          lsId           = 8;  // 所在的逻辑服ID
    string         deviceId       = 9;  // 设备ID
    string         deviceModel    = 10; // 设备机型
    int64          createTime     = 11; // 建立时间 TimeStamp
    int64          lastLogin      = 12; // 最后登陆时间 TimeStamp
    int32          ladder         = 13; // 段位
    int32          ladderStar     = 14; // 段位星星
    int32          dragonScore    = 15; // 龙珠积分
    repeated int32 attrList       = 16; // 玩家属性
    int32          bigLadder      = 17; // 玩家大段位
    string         battleId       = 18; // 战斗id
    int32          gameModelId    = 19; // 模式id
    string         teamId         = 20; // 队伍id
    string         playerState    = 21; // 离线时玩家状态
    int32          playerLevel    = 22; // 玩家等级
    int32          normalCount    = 23; // 匹配场次
    int32          ladderCount    = 24; // 排位场次
}

// 登录问券数据
message ch_auth_question_log {
    // PRIMARY KEY:account,log_type
    int64        uuid        = 1;  // 日志ID 必填 Hidden
    int64        writeTime   = 2;  // 日志记录时间    必填 DateTime
    string       version     = 3;  // 版本号       必填
    Common       common      = 4;  // 公共字段
    RoleCommon   roleCommon  = 5;  // 角色公共字段
    LcxSdkCommon sdkCommon   = 6;  // LCX的SDK公共字段
    string       account     = 7;  // 账号
    int32        area_id     = 8;  // 区服id
    int32        log_type    = 9;  // 日志类型，1开始答题，2答题完成
    string       question_id = 10; // 问券id
    bool         finish      = 11; // 完成验证是否成功
}

// 玩家创角日志
message ch_registerRole_log {
    // PRIMARY KEY:playerId,account,name,createTime
    int64          uuid        = 1;  // 日志ID 必填 Hidden
    int64          writeTime   = 2;  // 日志记录时间    必填 DateTime
