syntax             = "proto3"; //[proto2|proto3]

option  go_package = ".;pb";
package Game;
import "player.proto";
import "enum.proto";

// 玩家匹配数据
message MatchPlayerInfo {
    int32                playerId        = 1; // 玩家id
    bool                 isRobot         = 2; // 是否机器人
    PlayerGameInfo       gameInfo        = 3; // 玩家数据
    repeated BattleDelay battleDelayList = 4; // 战斗区域延迟
}

// 战斗区域延迟
message MatchBattleDelay {
    string battleArea = 1; // 战斗区域
    int32  delayTime  = 2; // 平均延迟时间(毫秒)
}

// 搜打撤匹配诊断快照（仅服务器内部使用，循环内更新、终态或限频采样时写actionLog）
message SDCMatchTrace {
    int32  rankLeft             = 1;  // 当前段位锚点窗口左边界
    int32  rankRight            = 2;  // 当前段位锚点窗口右边界
    int32  valueLeft            = 3;  // 当前战前价值锚点窗口左边界
    int32  valueRight           = 4;  // 当前战前价值锚点窗口右边界
    int32  mmrLeft              = 5;  // 当前MMR锚点窗口左边界
    int32  mmrRight             = 6;  // 当前MMR锚点窗口右边界
    int32  indexedCandidateCount = 7;  // 三层索引命中的候选阵营数
    int32  candidateCount       = 8;  // 通过房间规则的候选阵营数
    int32  rejectedCount        = 9;  // 被房间规则拒绝的候选阵营数
    string rejectReasonSummary  = 10; // 拒绝原因计数JSON
    string decisionReason       = 11; // 最近一次撮合决策原因
    bool   aiTimeout            = 12; // 是否达到普通AI填充时间
    bool   aiMaxTimeout         = 13; // 是否达到最大AI填充时间
    bool   mmrMaxExpanded       = 14; // MMR是否完成最大扩圈
    int64  updateTime           = 15; // 快照更新时间（Unix秒）
    int32  realCampCount        = 16; // 当前房间真人阵营数
    int32  robotCampCount       = 17; // 当前房间机器人阵营数
    int32  realPlayerCount      = 18; // 当前房间真人玩家数
    int32  robotPlayerCount     = 19; // 当前房间机器人玩家数
    bool   candidateLimitHit    = 20; // 是否达到候选扫描上限
    int32  lastDecisionSeq      = 21; // 最近一次更新快照的匹配轮次
    bool   terminalEmitted      = 22; // 是否已尝试写入成功或失败终态日志
    string terminalResult       = 23; // 已占用的终态结果(success/fail)
}

// 存入池子的队伍数据
message MatchTeamData {
    int64                     teamId               = 1;  // 队伍id
    int64                     startMatchTime       = 2;  // 开始匹配时间
    string                    battleVersion        = 3;  // 战斗版本号
    string                    clientVersion        = 4;  // 客户端版本号
    int32                     modeId               = 5;  // 游戏模式Id
    repeated MatchPlayerInfo  teamMembers          = 6;  // 玩家数据
    bool                      isRobot              = 7;  // 是否是机器人
    repeated MatchBattleDelay teamBattleDelayList  = 8;  // 队伍战斗区域延迟
    bool                      isMatchSucceeded     = 9;  // 是否匹配成功
    int32                     matchRuleId          = 10; // 匹配规则id
    int64                     addRobotMatchTime    = 11; // 匹配填充机器人最小时间
    int64                     addRobotMatchTimeMax = 12; // 匹配填充机器人最大时间
    int64                     matchUuid            = 13; // 匹配Uuid
    int32                     tsId                 = 14; // 队伍服务器ID
    LadderDraftType           draftType            = 15; // 是否征召模式
    MatchBattleStats          teamBattleStats      = 16; // 队伍的战斗统计数据
    int32                     cupAnchor            = 17; // 杯数锚点Id
    int32                     ladderAnchor         = 18; // 段位锚点Id
    int32                     matchFlag            = 19; // 匹配标志 0正常 1补偿局 2温暖局
    map<int32, bool>          black                = 20; // 队伍内的黑名单列表
    repeated int32            heroes               = 21; // 队伍内的英雄列表
    int32                     levelAnchor          = 22; // 娱乐赛专精平均等级锚点Id
    int32                     scoreAnchor          = 23; // 娱乐赛专精平均积分
    repeated int32            excludeModeTypes     = 24; // 队伍内所有玩家上一把打过的模式类型列表
    int32                     affix                = 25; // 开始匹配时冻结的基础词缀
    int32                     sdcRankAnchor        = 26; // 搜打撤匹配段位锚点ID，仅GM_HAZARD_OPS模式使用
    int32                     sdcValueAnchor       = 27; // 搜打撤匹配战前价值锚点ID，仅GM_HAZARD_OPS模式使用
    int32                     sdcMmrAnchor         = 28; // 搜打撤匹配MMR锚点ID，仅GM_HAZARD_OPS模式使用
    int32                     sdcMmrScore          = 29; // 搜打撤队伍平均MMR，仅服务器内部使用
    bool                      fillTeammate         = 30; // 搜打撤是否允许补齐队友，仅双人图组阵营阶段消费
    SDCMatchTrace             sdcMatchTrace        = 31; // 搜打撤最近一次撮合诊断快照，仅服务器内部使用
}
