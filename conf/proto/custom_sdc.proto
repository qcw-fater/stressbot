syntax = "proto3";  //[proto2|proto3]

option go_package = ".;pb";
package Game;

import "nohot_custom_battle.proto";

// ==================== 基础数据结构 ====================


// ==================== Redis存储用结构 ====================

// 装配槽位列表（用于Redis存储）
message SDCEquipSlotList {
    repeated SDCEquipSlot slots = 1; // 槽位列表
}

// 背包槽位列表（用于Redis存储）
message SDCPackSlotList {
    repeated SDCPackSlot packs = 1; // 背包列表
}

// ==================== 业务数据结构 ====================

// 战备数据
message SDCPrepareData {
    repeated SDCEquipSlot equipSlots      = 1; // 装配槽位列表
    repeated SDCPackSlot packSlots        = 2; // 背包槽位列表（含完整道具信息）
    int32 totalValue                      = 3; // 装配区域总价值
    int32 heroId                          = 4; // 当前选择英雄ID
    SDCHeroTalentAwakeInfo heroInfo       = 5; // SDC道具天赋/觉醒加成（仅增量，基础值由客户端从英雄系统获取）
    bool fillTeammate                     = 6; // 是否开启补齐队友（持久化选项，界面回显用）
    int32 skinId                          = 7; // 当前选择皮肤ID
    int32 modeId                          = 8; // 默认地图ID（来自SDCParameter ID=13）
}

// 仓库数据
message SDCWarehouseData {
    repeated SDCWarehouseItem items = 1; // 仓库道具列表
    int32 maxSlots                  = 2; // 仓库最大格子数
    int32 usedSlots                 = 3; // 已使用格子数
    int32 totalValue                = 4; // 仓库总价值
}

// ==================== 商店数据 ====================

// 商店商品信息
message SDCGoodsInfo {
    int32 id            = 1;  // 商品ID
    int32 itemId        = 2;  // 道具ID
    int32 num           = 3;  // 单份数量
    int32 costMoneyType = 4;  // 货币类型
    int32 price         = 5;  // 原始价格
    int32 discountPrice = 6;  // 折扣价格
    int32 discount      = 7;  // 折扣度
    int32 limitType     = 8;  // 限购类型
    int32 limitNum      = 9;  // 限购数量
    int32 boughtNum     = 10; // 已购买数量
}

// 商店数据
message SDCShopData {
    int32 shopId                = 1; // 商店ID
    repeated SDCGoodsInfo goods = 2; // 商品列表
    int32 refreshTime           = 3; // 刷新时间
}

// ==================== 赛季数据 ====================

// 赛季数据
message SDCSeasonData {
    int32 seasonId               = 1;  // 赛季ID
    int32 tier                   = 2;  // 段位
    int32 tierStar               = 3;  // 段位星数
    int32 seasonCoin             = 4;  // 赛季币
    int32 totalGames             = 5;  // 总场次
    int32 winGames               = 6;  // 胜场
    int32 totalKills             = 7;  // 总击杀玩家数（含人机玩家）
    int32 totalLootValue         = 8;  // 赛季累计收益总价值
    repeated int32 rewardedTiers = 9;  // 已领取奖励的段位列表
    int32 totalMonsterKills      = 10; // 总击杀怪物数
}

// ==================== 任务数据 ====================

// 任务信息
message SDCTaskInfo {
    int32 taskId   = 1; // 任务ID
    int32 progress = 2; // 当前进度
    int32 target   = 3; // 目标进度
    int32 status   = 4; // 状态 (0-进行中 1-已完成 2-已领取)
}

// 任务数据
message SDCTaskData {
    repeated SDCTaskInfo tasks = 1; // 任务列表
    int32 refreshTime          = 2; // 刷新时间
}

// ==================== 成长数据 ====================

// 成长数据
message SDCGrowthData {
    int32 warehouseLevel      = 1; // 仓库等级
    int32 warehouseSlots      = 2; // 仓库格子数
    int32 amplifierPackLevel  = 3; // 增幅器背包等级
    int32 amplifierPackSlots  = 4; // 增幅器背包格子数
    int32 medicinePackLevel   = 5; // 药品背包等级
    int32 medicinePackSlots   = 6; // 药品背包格子数
    int32 safeBoxSlots        = 7; // 安全箱格子数
    int32 sdcLevel            = 8; // SDC等级
    int32 sdcExp              = 9; // SDC当前经验
    // --- 新增字段 ---
    int32 battlePackLevel     = 10; // 战斗背包等级（统一管理增幅器+药品背包）
    int32 shopLevel           = 11; // 商店等级
    // 4个制作台等级
    int32 craftArmorLevel     = 12; // 护甲制作台等级
    int32 craftAmplifierLevel = 13; // 增幅器制作台等级
    int32 craftChipLevel      = 14; // 芯片制作台等级
    int32 consumableLevel     = 15; // 消耗品制作台等级
    // 4个制作台当前制作状态
    SDCCraftSlot craftArmorSlot       = 16; // 护甲制作台当前制作状态
    SDCCraftSlot craftAmplifierSlot   = 17; // 增幅器制作台当前制作状态
    SDCCraftSlot craftChipSlot        = 18; // 芯片制作台当前制作状态
    SDCCraftSlot craftConsumableSlot  = 19; // 消耗品制作台当前制作状态
}

// ==================== 藏品数据 ====================

// 藏品信息
message SDCCollectionInfo {
    int64 guid       = 1; // 藏品唯一ID
    int32 id         = 2; // 藏品配置ID
    int32 value      = 3; // 价值
    int64 obtainTime = 4; // 获得时间
    int32 source     = 5; // 来源 (1-局内带出 2-商店购买 3-其他)
}

// 藏品数据
message SDCCollectionData {
    repeated SDCCollectionInfo collections = 1; // 藏品列表
    int32 totalValue                       = 2; // 藏品总价值
}

// ==================== 战斗结算数据 ====================

// 战斗结算结果（返回给客户端）
message SDCBattleResult {
    int32 result                    = 1;  // 结果
    int32 killCount                 = 2;  // 击杀玩家数（含人机玩家）
    repeated int64 lostItemGuids    = 3;  // 丢失的道具GUID列表
    repeated int64 keptItemGuids    = 4;  // 保留的道具GUID列表
    int32 seasonCoin                = 5;  // 获得赛季币
    int32 exp                       = 6;  // 获得经验
    repeated SDCWarehouseItem rewardItems = 7;  // 获得奖励道具列表
    int32 monsterKillCount          = 8;  // 击杀怪物数
    int32 surviveTime               = 9;  // 存活时长/撤离用时(秒)
    int32 rating                    = 10; // 收益评级
    string ratingText               = 11; // 评价文本
}

// ==================== 战备快照 ====================

// 战备快照（用于匹配和战斗服加载）
message SDCPrepareSnapshot {
    repeated SDCEquipSlot equipSlots     = 1; // 装配槽位
    repeated SDCPackSlot packSlots       = 2; // 背包槽位
    int32 heroId                         = 3; // 英雄ID
    int32 totalValue                     = 4; // 装配总价值
    repeated SDCWarehouseItem itemDetails = 5; // 战备内所有道具的完整信息
    bool fillTeammate                    = 6; // 是否开启补齐队友匹配
    int32 skinId                         = 7; // 皮肤ID
    int32 modeId                         = 8; // 默认地图ID（来自SDCParameter ID=13）
}

// SDC战场掉落宝箱（含道具实例）
message SDCDropChest {
    int32 chestId = 1;                    // 宝箱配置ID（关联SDCChest表）
    int32 chestType = 2;                  // 宝箱类型（0=默认 1=钥匙 2=QTE 3=任务）
    repeated SDCWarehouseItem items = 3;  // 宝箱内的道具实例列表（含GUID、ItemId、Ext等）
}

// SDC区域掉落组
message SDCDropAreaGroup {
    int32 areaIndex = 1;                  // 场景区域索引
    repeated SDCDropChest chests = 2;     // 该区域的宝箱列表
}

// SDC任务奖励组（第二期实现，第一期返回空列表）
message SDCDropTaskGroup {
    string taskGuid = 1;                  // 任务GUID
    repeated SDCDropChest chests = 2;     // 该任务的奖励宝箱列表
}

// SDC战场掉落数据（完整）
message SDCDropData {
    int32 totalBudget = 1;                // 本局总价值预算
    repeated SDCDropAreaGroup areaGroups = 2;  // 区域掉落组列表
    repeated SDCDropTaskGroup taskGroups = 3;  // 任务奖励组列表（第一期为空）
}

// ====== 成长系统扩展 ======

// 单个制作台的制作状态
message SDCCraftSlot {
    int32 craftingItemId   = 1; // 正在制作的道具ID（0=空闲）
    int64 craftStartTime   = 2; // 制作开始时间戳（秒）
    int32 craftDuration    = 3; // 制作总耗时（分钟）
    bool  readyToClaim     = 4; // 是否已可领取
    repeated int32 randomAffixIds = 5; // 随机词条ID列表（当前版本仅取1个，预留多词条扩展）
    int64 craftedItemGuid  = 6; // 产出道具GUID（领取时生成）
}

// 成长升级类型枚举
enum SDCGrowthUpgradeType {
    SDC_GROWTH_UPGRADE_TYPE_UNKNOWN     = 0; // 未知
    SDC_GROWTH_UPGRADE_TYPE_WAREHOUSE   = 1; // 仓库
    SDC_GROWTH_UPGRADE_TYPE_BATTLE_PACK = 2; // 战斗背包
    SDC_GROWTH_UPGRADE_TYPE_SHOP        = 3; // 商店
    SDC_GROWTH_UPGRADE_TYPE_CRAFT_ARMOR = 4; // 护甲制作台
    SDC_GROWTH_UPGRADE_TYPE_CRAFT_AMP   = 5; // 增幅器制作台
    SDC_GROWTH_UPGRADE_TYPE_CRAFT_CHIP  = 6; // 芯片制作台
    SDC_GROWTH_UPGRADE_TYPE_CRAFT_CONS  = 7; // 消耗品制作台
}

// 升级预览单项
message SDCUpgradePreviewItem {
    int32 level          = 1; // 等级
    repeated string texts = 2; // 该等级的展示文案数组
}

// 可制作道具信息
message SDCCraftableItem {
    int32 itemId                    = 1; // 道具ID
    bool  unlocked                  = 2; // 是否已解锁
    string unlockTip                = 3; // 未解锁提示
    repeated int32 costItemIds      = 4; // 消耗道具ID列表
    repeated int32 costItemNums     = 5; // 消耗数量列表
    int32 craftTime                 = 6; // 制作耗时（分钟）
    repeated int32 randomAffixIds   = 7; // 随机词条ID列表
}

// ==================== 冻结快照 ====================

// 冻结快照（Phase 2: 战斗态生命周期安全）
message SDCFrozenSnapshot {
    int32 playerId = 1;                   // 玩家ID
    SDCWarehouseData warehouse = 2;       // 仓库完整数据
    SDCPrepareData prepare = 3;           // 装配 + 背包完整数据
    SDCCollectionData collection = 4;     // 藏品数据
    SDCGrowthData growth = 5;             // 成长数据
    SDCSeasonData season = 6;             // 赛季数据
    int64 battleId = 7;                   // 关联战斗 ID
    int64 frozenAt = 8;                   // 冻结时间戳
    int32 battleEndResult = 9;            // BE_REASON，0=战斗未完成
    int64 battleResultAt = 10;            // 战斗结果写入时间戳
}

