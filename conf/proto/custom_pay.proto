syntax = "proto3";  //[proto2|proto3]

option go_package = ".;pb";
package Game;

// 导入枚举
import "enum.proto";

message  storeProductInfo {
 string store = 1; // 商店类型
 string id = 2;  // 商品id
}

// 充值订单数据
message payInfo {
  string            purchaseId          = 1;   // 支付唯一ID， 一定要基于此ID进行幂等性检查，以免出现重复发放道具
  string            userId              = 2;   // 哪位LCX UserID 购买的
  storeProductInfo  storeProduct        = 3;   // 商品信息
  string            purchasePayload     = 4;   // 客户端透传参数
  string            currencyCode        = 5;   // 支付的法币类型
  double            price               = 6;   // 真实支付的法币数额
  PayState          state               = 7;   // 订单状态
  int32             zoneId              = 8;   // 区服id
}

// 支付客户端透传参数
message purchasePayloadInfo {
  int32 payTargetServerType = 1; //充值订单目标环境, 服务器区服id
  int32 playerId = 2; // 玩家id
  int32 shopId = 3; // 来源商店ID（法币购买时携带）
  int32 goodsId = 4; // 商店商品ID（GoodsInfo.ID）
}


// 直购限购类型数据（按限购类型分组）
message cashGoodsLimitTypeData {
  map<string, int32> goodsCount = 1; // key:商品id(CashGoods ID) value:已购次数
}

// 玩家充值统计
message playerPayStatistics {
  map<string,double>            money             = 1; // 充值的钱 key:法币名称 value:累计充值数量
  int64                         lastDayBuyTime    = 2; // 每日限购上次购买时间
  int64                         lastWeekBuyTime   = 3; // 每周限购上次购买时间
  int64                         lastMonthBuyTime  = 4; // 每月限购上次购买时间
  map<string,int32>             buyCount          = 5; // key:已经购买的商品id,value: 购买次数
  int64                         totalPayCoupons   = 6; // 累计充值点券
  firstRewardFlag               firstReward       = 7; // 首次充值奖励标识
  int32                         totalCouponsValue = 8; // 累计充值价值
  map<int32, cashGoodsLimitTypeData> cashLimitCount = 9; // 直购限购计数 key:限购类型 value:该类型下各商品已购次数
}

// 首充奖励标识（多档位结构）
// FEATURE-4050：首充支持多档位呈现解锁梯度
// 历史字段 flag/loginDay 已 reserved，请勿复用 tag=1/2
message firstRewardFlag {
  reserved 1, 2;
  reserved "flag", "loginDay";
  map<int32, gradeFlag> grades   = 3; // key:档位ID(FirstPay.csv ID), value:该档位状态
  int32                 globalDay = 4; // 全局首充天数(自首份首充购买日起算, 购买当日=1, 每次跨天+1, 封顶全局最大档位天数)
}

// 单个首充档位的领取状态
message gradeFlag {
  int32             startDay = 1; // 该档位已开放到第几天(1-based, 购买当日=1, 跨天累加, 封顶=len(RewardID))
  map<int32, int32> flag     = 2; // key:天序号(1-based), value: 0未达成 1可领 2已领
}

// 玩家月卡数据
message playerPayMonthCard {
  int32  id                 = 1;  // 月卡id
  int64  timeOut            = 2;  // 到期时间
  int64  lastGetRewardTime  = 3;  // 上次领奖时间
  int64  lastSendExpireTime = 4;  // 上次发放过期邮件时间
  bool   day7mail           = 5; // 剩余7天的邮件有没有发
  bool   day3mail           = 6; // 剩余3天的邮件有没有发
}

// 退款订单商品信息
message refundsInfo {
  storeProductInfo  storeProduct        = 1;   // 商品信息
  int32             count               = 2;   // 数量
  repeated  string  purchaseIds         = 3;   // 支付唯一ID， 一定要基于此ID进行幂等性检查，以免出现重复发放道具
}

// 退款订单数据
message RefundInfo {
  string                 userId   = 1;   // 哪位LCX UserID 购买的
  string                 zoneId   = 2;   // 支付的用户所在的区服
  repeated refundsInfo   refunds  = 3;   // 商品信息
  int64                  uuid     = 4;
}


// 退款订单数据
message RpcRefundInfo {
  RefundInfo       refundData   = 1;   // 退款订单数据
  repeated string  purchaseIds  = 2;   // 原始订单列表
  repeated string  payCfgIds    = 3;   // 配置表id列表
}

// 充值补单数据（GM后台 → Logic）
message GmPayReissueData {
  // 必填字段（场景A + B）
  int32  playerId        = 1;  // 玩家ID
  string purchaseId      = 2;  // 订单唯一ID（幂等性主键）
  string operatorId      = 3;  // 后台操作人ID（审计）
  string remark          = 4;  // 补单原因备注（审计）

  // 场景B必填字段（订单不存在时由后台补充）
  string storeProductId  = 5;  // 商品配置ID（CashGoodsConfig主键）
  string userId          = 6;  // 第三方账号ID
  string currencyCode    = 7;  // 法币代码（如USD/CNY）
  double price           = 8;  // 法币金额
  string store           = 9;  // 渠道（如google/apple/dena）
  string purchasePayload = 10; // 透传数据JSON（可选）

  // 元数据
  int32  scene           = 11; // 1=场景A 2=场景B
  int64  createTime      = 12; // 后台发起时间戳
}