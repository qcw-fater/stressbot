// 同意交换
message BattleAgreeExchangeC2S {
    int32 reqPlayerIndex = 1; // 请求玩家index
}
// 同意交换
message BattleAgreeExchangeS2C {
    int32 reqPlayerIndex    = 1; // 请求玩家index
