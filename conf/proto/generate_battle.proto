// 玩家战斗结束消息  房间服务器发送给logic
message PlayerBattleEnd {
    int64                              battleId         = 1;  // 战斗ID
    int64                              roomId           = 2;  // 房间id
    BrawlBattleResultType              resultType       = 3;  // 结算类型
    string                             MD5              = 4;  // 结算信息MD5
    GameModel                          model            = 5;  // 游戏模式
    GameType                           gType            = 6;  // 玩法类型
    int32                              modeId           = 7;  // 模式id
    string                             battleVersion    = 8;  // 战斗版本
    int64                              beginTime        = 9;  // 比赛开始时间
    int64                              endTime          = 10; // 比赛结束时间
    BE_REASON                          settlementReason = 11; // 结算原因
    map<int32, PlayerBattleStatistics> playerResult     = 12; // 个人比赛信息key:玩家id
    midwayExitInfo                     midwayExit       = 13; // 中途结算
    map<int32, BattleEndHeroAttr>      battleAttr       = 14; // 战斗属性数据
    repeated RoundStatistics           bonStatisData    = 15; // 打点数据，bo3模式下所有玩家每回合的战斗数据 index:回合
    int32                              addBraveScore    = 16; // 队友违规给自己的勇者积分
    int32                              battleActivitySteo   = 17; // 活动赛阶段
}

// 服务器结算广播战斗结束消息(BattleTCP)
message BattleResultNoticeS2C {
    int64                           battleId         = 1;  // 战斗ID
    int64                           roomId           = 2;  // 房间id
    BrawlBattleResultType           resultType       = 3;  // 结算类型
    string                          MD5              = 4;  // 结算信息MD5
    GameModel                       model            = 5;  // 游戏模式
    GameType                        gType            = 6;  // 玩法类型
    int32                           modeId           = 7;  // 模式id
    string                          battleVersion    = 8;  // 战斗版本
    int64                           beginTime        = 9;  // 比赛开始时间
    int64                           endTime          = 10; // 比赛结束时间
    BE_REASON                       settlementReason = 11; // 结算原因
    repeated PlayerBattleStatistics playerResult     = 12; // 个人比赛信息
    midwayExitInfo                  midwayExit       = 13; // 中途结算
    repeated int32                  campSettleSort   = 14; // 阵营结算顺序
    repeated CampType               bo3Result        = 15; // bo3模式下每回合胜利阵营，index:回合
}
