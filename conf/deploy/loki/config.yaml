# Loki 单机本地配置（Agent 日志存储，开发/压测排障用途）。
# 数据落在宿主机 D:/docker/volumes/stressbot-loki，无需对象存储。
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# 保留 7 天，与 conf/agent.toml 的 log.maxAge 对齐。
limits_config:
  retention_period: 168h

compactor:
  retention_enabled: true
  delete_request_store: filesystem
