server {
    listen 80;
    index index.php index.html index.htm default.php default.htm default.html;
    server_name 43.154.67.183 jump-tc-obt-gm.5xgames.com;
    root /data/gm/web/;
    client_max_body_size 100m;

    # 静态资源优化
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 防爬虫配置
    location ~* \.(php|asp|aspx|jsp|pl|cgi)$ {
        return 404;
    }

    # excel 下载链接
    location /excel/ {
        root /data/gm/server;
        add_header Content-Disposition "attachment; filename=$arg_filename";
        sendfile on;
        tcp_nopush on;
        autoindex off;
    }

    # newGm API
    location /api {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── stressbot ──
    # ^~ 让这个前缀匹配优先于上面的正则（如 .js/.css 缓存规则）
    location ^~ /stressbot/ {
        alias /data/stressbot/web/dist/;
        try_files $uri $uri/ @stressbot;
    }

    # SPA 路由兜底：/stressbot/xxx → index.html
    location @stressbot {
        root /data/stressbot/web/dist;
        rewrite .* /index.html break;
    }

    # stressbot API
    location /sbot/ {
        proxy_pass http://host.docker.internal:7718;
#         proxy_pass http://127.0.0.1:7718;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端路由处理（兜底）
    location / {
        try_files $uri $uri/ /index.html;
        expires max;
    }
}
