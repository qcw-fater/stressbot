# stressbot Nginx 配置示例
#
# 前端静态资源 + Admin API 反向代理
#
# 使用方式：
#   1. 将此文件复制到 Nginx conf 目录（或 include 进 nginx.conf）
#   2. 修改 upstream admin 为实际 Admin 服务器地址
#   3. 修改 root 为前端 dist 目录的绝对路径
#   4. nginx -t && nginx -s reload

upstream admin {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name _;

    # ── 前端静态资源 ──
    # npm run build → cmd/web/dist/
    root /opt/stressbot/web/dist;
    index index.html;

    # SPA 路由：所有非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Admin API（含 baseline 资源读取）──
    # 所有 /sbot/ 请求转发到 Go Admin 服务器
    location /sbot/ {
        proxy_pass http://admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 任务提交 multipart 较大（含 proto + scripts + adapter）
        client_max_body_size 50m;

        # SSE / 长轮询支持（未来扩展用）
        proxy_read_timeout 300s;
    }

    # ── 静态资源缓存 ──
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
