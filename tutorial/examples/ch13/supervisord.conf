; 第 13 章示例：supervisor 进程守护（Linux）
; ─────────────────────────────────────────────
; 安放：/etc/supervisor/conf.d/stressbot.conf
; 生效：supervisorctl reread && supervisorctl update
; 验证：supervisorctl status；重启机器后自动拉起。
; 注意：-d 守护 flag 与 supervisor 二选一（supervisor 场景不要传 -d）。

[program:stressbot-admin]
command=/opt/stressbot/admin -config /opt/stressbot/conf/admin.toml
directory=/opt/stressbot
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/stressbot/log/admin-supervisor.log
stderr_logfile=/opt/stressbot/log/admin-supervisor.err.log

; 施压节点机器上（可按机器拆分部署，不必与 admin 同机）
[program:stressbot-agent]
command=/opt/stressbot/agent -config /opt/stressbot/conf/agent.toml
directory=/opt/stressbot
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/stressbot/log/agent-supervisor.log
stderr_logfile=/opt/stressbot/log/agent-supervisor.err.log
