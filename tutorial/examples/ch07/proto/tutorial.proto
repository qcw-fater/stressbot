// 第 7 章示例协议：竞技场 (ArenaQuest) + 商店与聊天
syntax = "proto3";

package arena;

message LoginAccountC2S {
  string account = 1;
  string version = 2;
}

message LoginAccountS2C {
  int64 playerId = 1;
  int64 serverTime = 2;
}

message FetchPlayerC2S {
  int64 playerId = 1;
}

message PlayerItem {
  int32 itemId = 1;
  int32 count = 2;
}

message FetchPlayerS2C {
  string name = 1;
  int32 level = 2;
  int64 coins = 3;
  repeated PlayerItem items = 4;
}

// ── 商店 ──────────────────────────────────────────────

message ShopListC2S {
  int32 category = 1; // 0 全部
}

message ShopItem {
  int32 itemId = 1;
  string name = 2;
  int32 price = 3;   // 金币价
  int32 stock = 4;   // 剩余库存
  int32 bound = 5;   // 1=绑定 0=可交易
}

message ShopListS2C {
  repeated ShopItem items = 1;
}

message BuyItemC2S {
  int32 itemId = 1;
  int32 count = 2;
}

message BuyItemS2C {
  int64 orderId = 1;
}

// ── 聊天与上报 ────────────────────────────────────────

message ChatC2S {
  string text = 1;
  int32 channel = 2; // 1 世界 2 公会 3 队伍
}

message ChatS2C {
  int64 seq = 1;
}

message ReportStatsC2S {
  map<int32, string> tags = 1;
}

message ReportStatsS2C {
  int32 ok = 1;
}
