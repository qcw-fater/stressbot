// 第 8 章示例协议：竞技场 (ArenaQuest) + 匹配推送与公会广播
syntax = "proto3";

package arena;

message LoginAccountC2S {
  string account = 1;
  string version = 2;
}

message LoginAccountS2C {
  int64 playerId = 1;
  int64 serverTime = 2;
}

// ── 战斗匹配 ──────────────────────────────────────────

message MatchApplyC2S {
  int32 mode = 1; // 1 快速 2 排位
}

message MatchApplyS2C {
  int64 ticket = 1; // 匹配申请回执（立即返回）
}

message MatchFoundS2C {
  int64 battleId = 1;
  repeated string teammates = 2;
}

// ── 公会广播（服务器主动推送）─────────────────────────

message GuildNoticeS2C {
  string notice = 1;
  int64 publishAt = 2;
}
