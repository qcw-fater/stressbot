openapi: 3.0.3
info:
  title: stressbot management API
  version: 1.0.0
  description: 浏览器管理面 API；复杂压测指标在首轮仍保留为领域模型。
paths:
  /sbot/tasks:
    get: { operationId: listTasks, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '500': { $ref: '#/components/responses/ServerError' } } }
    post:
      operationId: createTask
      requestBody: { $ref: '#/components/requestBodies/TaskCreateMultipart' }
      responses: { '201': { $ref: '#/components/responses/JsonCreated' }, '400': { $ref: '#/components/responses/BadRequest' }, '500': { $ref: '#/components/responses/ServerError' } }
  /sbot/tasks/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { operationId: getTask, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
    delete: { operationId: deleteTask, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/tasks/{id}/config/{path}:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/ResourcePath' }]
    get: { operationId: getTaskConfigFile, responses: { '200': { $ref: '#/components/responses/FileOK' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/tasks/{id}/start:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post: { operationId: startTask, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/tasks/{id}/stop:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post: { operationId: stopRunningTask, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/agents:
    get: { operationId: listAgents, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/agents/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { operationId: getAgent, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
    delete: { operationId: deleteAgent, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/agents/{id}/shutdown:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post: { operationId: shutdownManagedAgent, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/agents/shutdown-all:
    post: { operationId: shutdownAllAgents, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/metrics:
    get: { operationId: getMetrics, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '400': { $ref: '#/components/responses/BadRequest' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/metrics/summary:
    get: { operationId: getMetricsSummary, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '400': { $ref: '#/components/responses/BadRequest' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/metrics/agents:
    get: { operationId: getAgentMetrics, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '400': { $ref: '#/components/responses/BadRequest' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/metrics/agents/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { operationId: getSingleAgentMetrics, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/system:
    get: { operationId: getClusterSystem, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/system/agents:
    get: { operationId: getSystemAgents, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/system/agents/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { operationId: getSystemAgent, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/history:
    get: { operationId: listHistory, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '400': { $ref: '#/components/responses/BadRequest' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/history/tags:
    get: { operationId: getHistoryTags, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/history/compare:
    get: { operationId: compareHistory, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '400': { $ref: '#/components/responses/BadRequest' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/history/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { operationId: getHistory, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
    put:
      operationId: updateHistory
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '200': { $ref: '#/components/responses/JsonOK' }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } }
    delete: { operationId: deleteHistory, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/history/{id}/agents:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { operationId: getHistoryAgents, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/history/{id}/config:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { operationId: getHistoryConfig, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/history/{id}/config/archive:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { operationId: getHistoryConfigArchive, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/history/{id}/timeseries:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { operationId: getHistoryTimeseries, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/history/{id}/clone:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: cloneHistory
      requestBody: { $ref: '#/components/requestBodies/OptionalJsonObject' }
      responses: { '201': { $ref: '#/components/responses/JsonCreated' }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } }
  /sbot/baseline/proto/index.json:
    get: { operationId: getBaselineProtoIndex, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/baseline/proto/{name}:
    parameters: [{ $ref: '#/components/parameters/Name' }]
    get: { operationId: getBaselineProtoFile, responses: { '200': { $ref: '#/components/responses/FileOK' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/baseline/scripts/index.json:
    get: { operationId: getBaselineScriptIndex, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/baseline/scripts/{name}:
    parameters: [{ $ref: '#/components/parameters/Name' }]
    get: { operationId: getBaselineScriptFile, responses: { '200': { $ref: '#/components/responses/FileOK' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/baseline/adapter/index.json:
    get: { operationId: getBaselineAdapterIndex, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/baseline/adapter/{name}:
    parameters: [{ $ref: '#/components/parameters/Name' }]
    get: { operationId: getBaselineAdapterFile, responses: { '200': { $ref: '#/components/responses/FileOK' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/baseline/flow/flow.json:
    get: { operationId: getBaselineFlow, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/api/error-codes:
    get: { operationId: getErrorCodeIndex, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/flows:
    get: { operationId: listFlows, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '500': { $ref: '#/components/responses/ServerError' } } }
    post:
      operationId: createFlow
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '201': { $ref: '#/components/responses/JsonCreated' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/ServerError' } }
  /sbot/flows/snapshot:
    get: { operationId: getFlowSnapshot, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '500': { $ref: '#/components/responses/ServerError' } } }
    put:
      operationId: replaceFlowSnapshot
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '200': { $ref: '#/components/responses/JsonOK' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/ServerError' } }
  /sbot/flows/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { operationId: getFlow, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
    put:
      operationId: updateFlow
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '200': { $ref: '#/components/responses/JsonOK' }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/ServerError' } }
    delete: { operationId: deleteFlow, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/action-templates:
    get: { operationId: listActionTemplates, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '500': { $ref: '#/components/responses/ServerError' } } }
    post:
      operationId: createActionTemplate
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '201': { $ref: '#/components/responses/JsonCreated' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/ServerError' } }
  /sbot/action-templates/snapshot:
    get: { operationId: getActionTemplateSnapshot, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '500': { $ref: '#/components/responses/ServerError' } } }
    put:
      operationId: replaceActionTemplateSnapshot
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '200': { $ref: '#/components/responses/JsonOK' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/ServerError' } }
  /sbot/action-templates/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { operationId: getActionTemplate, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
    put:
      operationId: updateActionTemplate
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '200': { $ref: '#/components/responses/JsonOK' }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/ServerError' } }
    delete: { operationId: deleteActionTemplate, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/listen-templates:
    get: { operationId: listListenTemplates, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '500': { $ref: '#/components/responses/ServerError' } } }
    post:
      operationId: createListenTemplate
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '201': { $ref: '#/components/responses/JsonCreated' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/ServerError' } }
  /sbot/listen-templates/snapshot:
    get: { operationId: getListenTemplateSnapshot, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '500': { $ref: '#/components/responses/ServerError' } } }
    put:
      operationId: replaceListenTemplateSnapshot
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '200': { $ref: '#/components/responses/JsonOK' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/ServerError' } }
  /sbot/listen-templates/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { operationId: getListenTemplate, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } } }
    put:
      operationId: updateListenTemplate
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '200': { $ref: '#/components/responses/JsonOK' }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/ServerError' } }
    delete: { operationId: deleteListenTemplate, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /sbot/capabilities:
    get:
      operationId: getCapabilities
      responses:
        '200':
          description: 服务器能力
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilitiesResponse' }
        '500': { $ref: '#/components/responses/ServerError' }
  /sbot/codec/preview:
    post:
      operationId: previewCodec
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '200': { $ref: '#/components/responses/JsonOK' }, '400': { $ref: '#/components/responses/BadRequest' }, '500': { $ref: '#/components/responses/ServerError' } }
  /sbot/codec/algorithms:
    get: { operationId: getCodecAlgorithms, responses: { '200': { $ref: '#/components/responses/JsonOK' }, '500': { $ref: '#/components/responses/ServerError' } } }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
    Name: { name: name, in: path, required: true, schema: { type: string, minLength: 1 } }
    ResourcePath: { name: path, in: path, required: true, schema: { type: string, minLength: 1 } }
  requestBodies:
    TaskCreateMultipart:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [name, totalBots, flow.json]
            properties:
              name: { type: string, minLength: 1 }
              totalBots: { type: integer, minimum: 1 }
              flow.json: { type: string, format: binary }
              robotConfig: { type: string }
              deadline: { type: string, format: date-time }
              flowTemplateId: { type: string }
            additionalProperties: true
    JsonObject:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    OptionalJsonObject:
      required: false
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
  responses:
    JsonOK:
      description: 成功
      content:
        application/json:
          schema: {}
    JsonCreated:
      description: 已创建
      content:
        application/json:
          schema: {}
    FileOK:
      description: 文件内容
      content:
        application/json: { schema: {} }
        text/plain: { schema: { type: string } }
        application/octet-stream: { schema: { type: string, format: binary } }
    BadRequest:
      description: 请求不合法
      content: { application/json: { schema: { $ref: '#/components/schemas/ManagementApiError' } } }
    NotFound:
      description: 资源不存在
      content: { application/json: { schema: { $ref: '#/components/schemas/ManagementApiError' } } }
    Conflict:
      description: 状态或版本冲突
      content: { application/json: { schema: { $ref: '#/components/schemas/ManagementApiError' } } }
    ServerError:
      description: 内部错误
      content: { application/json: { schema: { $ref: '#/components/schemas/ManagementApiError' } } }
  schemas:
    ManagementApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: {}
      additionalProperties: true
    CapabilitiesResponse:
      type: object
      required: [sharedState, flowLibrary, templateLibrary]
      properties:
        sharedState: { type: boolean }
        sharedAddr: { type: string }
        flowLibrary: { type: boolean }
        templateLibrary: { type: boolean }
      additionalProperties: false
